id var(--blue);border-radius:8px;overflow:hidden}\n.seg button{border:0;background:transparent;color:var(--blue);padding:10px 14px;min-height:44px;font-weight:700;font-size:.9rem}\n.seg button[aria-pressed=\"true\"]{background:var(--blue);color:var(--card)}\n@media (max-width:520px){.src{grid-template-columns:1fr}}\n.chartbox{overflow-x:auto}\n.chartbox svg{display:block;width:100%;min-width:320px;height:auto}\n.chartbox .cap{font-size:.8rem;color:var(--muted)}\nfieldset{border:0;margin:0;padding:0;display:grid;gap:6px}\nlegend{font-weight:700;margin-bottom:6px;padding:0}\n.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;border:1px solid transparent}\n.opt:hover{background:var(--blue-soft)}\n.opt input{margin-top:5px;accent-color:var(--blue)}\n.opt.ok{background:var(--good-soft);border-color:var(--good)}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.explain{font-size:.92rem;color:var(--muted);padding-left:10px;border-left:3px solid var(--rule)}\n.quiz{display:grid;gap:22px;counter-reset:q}\n.quiz fieldset legend::before{counter-increment:q;content:counter(q) \". \";font-family:var(--mono);color:var(--blue)}\ntextarea{font:inherit;width:100%;min-height:9rem;padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);resize:vertical}\n.checks{display:grid;gap:6px}\n.checks label{display:flex;gap:10px;align-items:flex-start}\n.checks input{margin-top:5px;accent-color:var(--good)}\n.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}\n.score div{border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--card);display:grid;gap:2px}\n.score b{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}\n.score span{font-size:.85rem;color:var(--muted)}\n.small{font-size:.85rem;color:var(--muted)}\n.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.cert{background:var(--card);border:2px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:12px}\n.cert.complete{border-color:var(--good);box-shadow:0 0 0 4px var(--good-soft)}\n.cert-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}\n.stamp{font-family:var(--mono);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--muted);color:var(--muted)}\n.cert.complete .stamp{border-color:var(--good);color:var(--good);background:var(--good-soft)}\n.certdate{font-size:.85rem;color:var(--muted)}\n.shot{background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:16px 18px;display:grid;gap:8px}\n.shot ul,.shot ol{margin:0;padding-left:1.2em;display:grid;gap:4px}\n@media (max-width:520px){body{font-size:16px}.task{padding:14px}.match label{grid-template-columns:3.4rem 1fr}.order li{padding:6px 8px}.btn{width:100%}}\n@media (prefers-reduced-motion:no-preference){.order li,.src,.opt{transition:background .2s,border-color .2s}html{scroll-behavior:smooth}}\n\n\n/* Lesson 2 additions */\n.strip{display:grid;gap:6px}\n.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}\n.band>div{padding:10px;border-radius:6px;display:grid;gap:2px;align-content:start;min-width:0;overflow-wrap:anywhere}\n.band b{font-size:.85rem;line-height:1.2}\n.band .yr{font-size:1.1rem;color:var(--ink)}\n.seg0{background:var(--gold-soft)}\n.seg1{background:color-mix(in srgb,var(--gold-soft) 66%,var(--blue-soft))}\n.seg2{background:color-mix(in srgb,var(--gold-soft) 33%,var(--blue-soft))}\n.seg3{background:var(--blue-soft)}\n.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--muted)}\n.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}\n.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}\n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 5 of 17<\/p>\n  <h1>Mexican National Texas<\/h1>\n  <p class=\"q\">Big question: <b>Why did Mexico invite settlers, and why did that plan backfire?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.2D, 7.2E, 7.2F, 7.10A<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>From Spanish Texas to Mexican Texas<\/h2>\n  <div class=\"prose\">\n    <p>At the end of Lesson 4, Spain still held San Antonio, Goliad, and Nacogdoches, but it never had enough settlers. Then a war in Mexico changed everything.<\/p>\n    <p>In 1810, a priest named <b>Miguel Hidalgo<\/b> rang the church bell in the town of Dolores and called on the people of Mexico to rise up against Spain. That fight for independence lasted eleven years, and some of it spilled into Texas.<\/p>\n  <\/div>\n\n  <h3>How Texas became part of Mexico<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1810<\/span><div><b>Hidalgo's revolt<\/b><span>Father Hidalgo's call to rebel starts Mexico's war for independence from Spain.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1813<\/span><div><b>Battle of Medina<\/b><span>Spanish royal troops crushed a rebel army south of San Antonio. It was the deadliest battle ever fought in Texas. Spain then punished Tejanos who had backed the rebels, and many fled. Texas lost people it badly needed.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1821<\/span><div><b>Mexico wins independence<\/b><span>Spain gave up. Texas was now part of the new nation of Mexico. Moses Austin had just won permission to bring American families to Texas, but he died, and his son <b>Stephen F. Austin<\/b> took over the plan.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1824<\/span><div><b>A constitution and a new state<\/b><span>The <b>Constitution of 1824<\/b> made Mexico a federal republic, with power shared between the nation and its states. Texas was joined to Coahuila to make one state, <b>Coahuila y Tejas<\/b>, with its capital far away in Saltillo.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1825<\/span><div><b>Colonization laws<\/b><span>New laws offered cheap land to families who would become Mexican citizens, follow the Catholic faith, and obey Mexican law. Contractors called <b>empresarios<\/b> recruited the families.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"dates\">\n    <div class=\"date\"><span class=\"yr\">1821<\/span><b>Mexico wins independence from Spain<\/b><p>This is one of your eight required dates. Add it to your timeline from Lesson 1.<\/p><\/div>\n  <\/div>\n\n  <h3>Why invite settlers?<\/h3>\n  <div class=\"prose\">\n    <p>Mexico had the same problem Spain had: a huge land with few people. Comanche and Apache raids made the frontier dangerous, and Mexico worried the United States wanted Texas. Mexican leaders hoped loyal, hardworking settlers would farm the land, pay taxes, and act as a buffer against raids and against the United States.<\/p>\n  <\/div>\n\n  <h3>The empresarios<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Stephen F. Austin<\/b><span class=\"tag\">empresario<\/span><\/div><p>Brought the first 300 families, called the <b>Old Three Hundred<\/b>, to the Brazos and Colorado river valleys. He learned Spanish, worked closely with Mexican officials, and is called the Father of Texas.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Martín De León<\/b><span class=\"tag\">empresario<\/span><\/div><p>Founded the town of Victoria in 1824. His was the only colony settled mostly by Mexican families.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Erasmo Seguín<\/b><span class=\"tag\">Tejano leader<\/span><\/div><p>A San Antonio leader who welcomed the Austins, represented Texas at the meeting that wrote the Constitution of 1824, and pushed for laws that opened Texas to settlers.<\/p><\/div>\n  <\/div>\n\n  <h3>Three plans for settling Texas<\/h3>\n  <div class=\"cmpbox\"><table class=\"cmp\">\n    <thead><tr><th><\/th><th>Spain<\/th><th>Mexico<\/th><th>Anglo settlers<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><th>Goal<\/th><td>Hold the land and convert American Indians<\/td><td>Fill the land with loyal citizens and block the U.S.<\/td><td>Get cheap, rich farmland<\/td><\/tr>\n      <tr><th>Method<\/th><td>Missions, presidios, towns, ranches<\/td><td>Empresarios and land grants<\/td><td>Move in as families, many from the southern U.S.<\/td><\/tr>\n      <tr><th>Result<\/th><td>Too few settlers<\/td><td>Settlers came, but many did not become loyal Mexicans<\/td><td>Grew fast and soon outnumbered Tejanos<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n\n  <div class=\"callout\"><b>Slavery and the plan.<\/b> Many Anglo settlers came from the southern United States to grow cotton, and some brought enslaved African Americans to do the work. Mexico was moving to end slavery, and in 1829 its president abolished it. Texas settlers won an exemption, and some got around the rules by calling enslaved people \"indentured servants.\" This argument over slavery became one more source of conflict between settlers and the government.<\/div>\n\n  <div class=\"callout\"><b>Why the plan backfired.<\/b> The plan worked too well. By 1830, settlers from the United States far outnumbered Tejanos. Most lived apart from Mexican towns, spoke English, traded with the U.S., and did not follow Mexican customs or laws closely. Mexico had invited people to protect Texas, and now it worried it might lose Texas to them. That worry is where Lesson 6 begins.<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz + Checkpoint 1<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">15 questions. Questions 11–15 review Lessons 1–4 for Checkpoint 1. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>Why did Mexico invite settlers, and why did that plan backfire?<\/b> Make a claim, give one piece of evidence from today's lesson (a person, a date, a law, or a number), and explain how your evidence supports your claim.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"Mexico invited settlers because...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 5 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 5<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Mexican National Texas<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Austin, Stephen Fuller,” “Seguín, Erasmo,” “De León, Martín,” “Constitution of 1824,” “Battle of Medina,” “Slavery”<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson5-v1\", \"n\": 5, \"label\": \"Lesson 5\", \"title\": \"Mexican National Texas\", \"practice\": [{\"type\": \"order\", \"title\": \"Cause chain\", \"intro\": \"Use the arrows to put these events in order, earliest at the top. Each one led to the next.\", \"button\": \"Check my order\", \"word\" hoped new citizens would help keep Texas Mexican.\"], [\"Guard the frontier with presidios\", \"S\", \"Spain built forts to protect its missions.\"], [\"Bring enslaved workers to farm cotton\", \"A\", \"Many settlers from the southern U.S. brought enslaved people, against Mexico's wishes.\"]]}, {\"type\": \"mc\", \"title\": \"Why did it backfire?\", \"intro\": \"Pick the best answer.\", \"button\": \"Check my answers\", \"word\": \"correct\", \"items\": [{\"q\": \"Which fact best shows Mexico's plan worked <i>too<\\/i> well?\", \"o\": [\"By 1830, Anglo settlers far outnumbered Tejanos\", \"Few people came\", \"Spain took Texas back\"], \"a\": 0, \"e\": \"Mexico got settlers, but so many that Tejanos became a small minority.\"}, {\"q\": \"Why did slavery cause conflict?\", \"o\": [\"Mexico required every settler to own slaves\", \"Slavery was never discussed\", \"Mexico was moving to end slavery, while many settlers wanted to keep it\"], \"a\": 2, \"e\": \"Settlers pushed for exemptions and found ways around Mexico's rules.\"}, {\"q\": \"Settlers had to become Mexican citizens and follow the Catholic faith. Why might many settlers not take those rules seriously?\", \"o\": [\"The rules were written in English\", \"They lived far from Mexican officials and kept their own language and customs\", \"Mexico paid them to ignore the rules\"], \"a\": 1, \"e\": \"Distance and separate communities made the rules hard to enforce.\"}]}], \"quiz\": [{\"q\": \"What happened in 1821?\", \"o\": [\"Texas won independence\", \"Mexico won independence from Spain\", \"San Antonio was founded\", \"The Alamo fell\"], \"a\": 1, \"e\": \"1821 is one of the eight required dates.\"}, {\"q\": \"Who started Mexico's war for independence in 1810?\", \"o\": [\"Stephen F. Austin\", \"Santa Anna\", \"Martín De León\", \"Father Miguel Hidalgo\"], \"a\": 3, \"e\": \"Hidalgo's call to revolt began an eleven-year war.\"}, {\"q\": \"Why was the Battle of Medina (1813) so harmful to Texas?\", \"o\": [\"Many Tejanos were killed or fled, leaving Texas with even fewer people\", \"It destroyed the missions\", \"It gave Texas to France\", \"It started the Civil War\"], \"a\": 0, \"e\": \"Spain's punishment after the battle emptied much of Texas.\"}, {\"q\": \"An empresario was…\", \"o\": [\"A Spanish priest\", \"A Mexican soldier\", \"A contractor who brought settler families in return for land\", \"A Comanche leader\"], \"a\": 2, \"e\": \"Austin and De León were empresarios.\"}, {\"q\": \"What did the Constitution of 1824 do?\", \"o\": [\"Made Texas independent\", \"Ended Spanish rule in Florida\", \"Made Mexico a federal republic and created the state of Coahuila y Tejas\", \"Banned all settlers\"], \"a\": 2, \"e\": \"Power was shared between Mexico's national government and its states.\"}, {\"q\": \"Why did Mexico invite settlers from the United States?\", \"o\": [\"To fill the land, grow the economy, and buffer against raids and the U.S.\", \"To start a war with Spain\", \"To spread English\", \"To build oil wells\"], \"a\": 0, \"e\": \"Like Spain, Mexico had too few people in Texas.\"}, {\"q\": \"Which empresario's colony was settled mostly by Mexican families?\", \"o\": [\"Stephen F. Austin's\", \"Haden Edwards's\", \"Moses Austin's\", \"Martín De León's\"], \"a\": 3, \"e\": \"De León founded Victoria in 1824.\"}, {\"q\": \"Settlers who received land were expected to…\", \"o\": [\"Pay taxes to Spain\", \"Become Mexican citizens and follow the Catholic faith\", \"Join the U.S. Army\", \"Move back after five years\"], \"a\": 1, \"e\": \"Many did not follow these rules closely.\"}, {\"q\": \"How did many settlers get around Mexico's limits on slavery?\", \"o\": [\"They called enslaved people indentured servants\", \"They moved to Louisiana\", \"They asked Spain for help\", \"They didn't; no settlers held slaves\"], \"a\": 0, \"e\": \"Labels changed, but people were still held in bondage.\"}, {\"q\": \"Which sentence best answers the big question?\", \"o\": [\"Mexico n a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 6 of 17<\/p>\n  <h1>Road to Revolution<\/h1>\n  <p class=\"q\">Big question: <b>Was the Texas Revolution inevitable after 1830?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.3A, 7.16A, 7.20D<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>Trust breaks down, one step at a time<\/h2>\n  <div class=\"prose\">\n    <p>Lesson 5 ended with a problem. Mexico invited settlers to hold Texas, and now settlers from the United States far outnumbered Tejanos. Between 1826 and 1835, a chain of events turned that worry into open conflict.<\/p>\n    <p>As you read, ask the historian's question: <b>inevitable<\/b> means it was bound to happen no matter what. Could anyone have stopped this chain? Look at each step from two sides: the Mexican government's and the Texians' (Anglo settlers in Texas).<\/p>\n  <\/div>\n\n  <h3>Five steps toward revolution<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1826<\/span><div><b>Fredonian Rebellion<\/b><span>Empresario Haden Edwards fought with Mexican officials over land titles in Nacogdoches. His brother declared an independent \"Republic of Fredonia.\" Mexican troops, joined by Stephen F. Austin's militia, ended it quickly in early 1827. Even so, Mexico now suspected Anglo settlers.<\/span><em>Mexican view: proof settlers might rebel. Texian view: a few hotheads, not the colonies.<\/em><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1828<\/span><div><b>The Terán Report<\/b><span>General Manuel de Mier y Terán toured Texas. He reported that Anglos far outnumbered Mexicans in East Texas, kept their own schools and customs, and traded mostly with the U.S. He warned that Mexico could lose Texas.<\/span><em>Mexican view: a warning to act now. Texian view: they hardly knew it existed.<\/em><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1830<\/span><div><b>Law of April 6, 1830<\/b><span>Mexico banned further immigration from the United States, sent more soldiers, collected taxes on imports, and banned bringing in more enslaved people.<\/span><em>Mexican view: protecting its border. Texian view: an attack on their families still trying to come, and on their trade.<\/em><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1832<\/span><div><b>Turtle Bayou Resolutions<\/b><span>After clashes with a Mexican commander at Anahuac, Texians wrote these resolutions. They said they were loyal Mexicans who supported General Santa Anna and the federal Constitution of 1824, and only opposed officials who broke it.<\/span><em>Mexican view: an armed uprising. Texian view: defending Mexico's own constitution.<\/em><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1834<\/span><div><b>Austin's arrest<\/b><span>Austin traveled to Mexico City to ask for separate statehood for Texas and repeal of the immigration ban. On his way home he was arrested and held for about a year and a half without a trial.<\/span><em>Mexican view: punishing a letter that sounded like a threat. Texian view: if even Austin was jailed, peaceful requests had failed.<\/em><\/div><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>The final push.<\/b> In 1834 and 1835, Santa Anna switched sides. He threw out the federal Constitution of 1824 and took power for the central government. When the state of Zacatecas resisted, his army crushed it. Federalists across Mexico, including many Tejanos, were alarmed. Austin came home in 1835 and said war was the only remedy. In October, fighting began at Gonzales.<\/div>\n\n  <h3>Reading a document: the Turtle Bayou Resolutions<\/h3>\n  <div class=\"excerpt\">\n    <span class=\"who\">Summary of the main points, June 1832<\/span>\n    <p class=\"line\">The writers said they were loyal citizens of Mexico.<\/p>\n    <p class=\"line\">They supported General Santa Anna, who was then fighting for the Constitution of 1824.<\/p>\n    <p class=\"line\">They said they took up arms only against officials who ignored that constitution.<\/p>\n    <p><b>Think:<\/b> Why would Texians stress their loyalty to Mexico in 1832? Who was the audience?<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>What was the single most important cause of the Texas Revolution?<\/b> Make a claim, give one piece of evidence from today's lesson (an event, a date, a law, or a person), and explain why it mattered more than the others.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"The most important cause of the Texas Revolution was...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (an event, a date, a law, or a person).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>why<\/b> my cause mattered more than the others.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 6 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 6<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Road to Revolution<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Fredonian Rebellion,” “Mier y Terán, Manuel de,” “Law of April 6, 1830,” “Turtle Bayou Resolutions,” “Austin, Stephen Fuller”<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson6-v1\", \"n\": 6, \"label\": \"Lesson 6\", \"title\": \"Road to Revolution\", \"practice\": [{\"type\": \"order\", \"title\": \"Sequence the event cards\", \"intro\": \"Use the arrows to put the events in order, earliest at the top.\", \"button\": \"Check my order\", \"word\": \"in the right spot\", \"seed\": 5, \"items\": [[\"Fredonian Rebellion in Nacogdoches\", \"1826\"], [\"Terán tours Texas and warns Mexico\", \"1828\"], [\"Law of April 6 bans U.S. immigration\", \"1830\"], [\"Turtle Bayou Resolutions\", \"1832\"], [\"Austin is arrested on his way home\", \"1834\"], [\"Fighting begins at Gonzales\", \"1835\"]]}, {\"type\": \"sort\", \"title\": \"Two points of view\", \"intro\": \"Who would most likely say this: a <b>Mexican official<\\/b> or a <b>Texian settler<\\/b>?\", \"button\": \"Check my sorting\", \"word\": \"sorted correctly\", \"choices\": [[\"M\", \"Mexican official\"], [\"T\", \"Texian settler\"]], \"items\": [[\"“These settlers keep their own language and trade with the United States. We could lose Texas.”\", \"M\", \"That is the warning in the Terán Report.\"], [\"“Our relatives back in Tennessee can't join us now. That's unfair.”\", \"T\", \"The Law of April 6, 1830 stopped new U.S. immigration.\"], [\"“We need more soldiers and customs houses in Texas.”\", \"M\", \"Mexico sent troops and collected taxes to control the border.\"], [\"“We are loyal to the Constitution of 1824, not to officials who break it.”\", \"T\", \"That is the message of the Turtle Bayou Resolutions.\"], [\"“Austin's letter suggested Texas might act on its own. He must be held.”\", \"M\", \"Officials saw a letter Austin wrote as a threat.\"], [\"“If Austin can be jailed for asking politely, asking doesn't work.”\", \"T\", \"Austin's arrest convinced many that peaceful petitions had failed.\"]]}, {\"type nt republic around Nacogdoches\", \"The first battle of the Texas Revolution\", \"A Mexican army mutiny\"], \"a\": 1, \"e\": \"Haden Edwards's revolt failed, but it made Mexico suspicious.\"}, {\"q\": \"What did General Mier y Terán report in 1828?\", \"o\": [\"That Texas had gold\", \"That Texas should join the U.S.\", \"That settlers were very loyal\", \"That Anglos outnumbered Mexicans in East Texas and Mexico could lose Texas\"], \"a\": 3, \"e\": \"His report led to the Law of April 6, 1830.\"}, {\"q\": \"Which was part of the Law of April 6, 1830?\", \"o\": [\"A ban on immigration from the United States\", \"Free land for all U.S. citizens\", \"Texas becoming its own state\", \"An end to all taxes\"], \"a\": 0, \"e\": \"Mexico also sent troops and taxed imports.\"}, {\"q\": \"The Turtle Bayou Resolutions said Texians…\", \"o\": [\"Wanted independence right away\", \"Wanted to join France\", \"Were loyal to Mexico and the Constitution of 1824\", \"Supported the Law of April 6\"], \"a\": 2, \"e\": \"In 1832, they still hoped to work within Mexico.\"}, {\"q\": \"Why did Stephen F. Austin go to Mexico City in 1833?\", \"o\": [\"To sell land\", \"To join the army\", \"To ask for separate statehood and an end to the immigration ban\", \"To surrender Texas\"], \"a\": 2, \"e\": \"He was arrested on the way home.\"}, {\"q\": \"How did Santa Anna's actions in 1834–1835 push Texas toward war?\", \"o\": [\"He threw out the federal Constitution of 1824 and centralized power\", \"He gave Texas independence\", \"He moved to Texas\", \"He banned the Catholic Church\"], \"a\": 0, \"e\": \"Federalists, Anglo and Tejano, saw their rights taken away.\"}, {\"q\": \"Where did fighting begin in October 1835?\", \"o\": [\"San Jacinto\", \"El Paso\", \"Galveston\", \"Gonzales\"], \"a\": 3, \"e\": \"Lesson 7 starts there.\"}, {\"q\": \"From the Mexican government's point of view, the Law of April 6, 1830 was…\", \"o\": [\"A gift to settlers\", \"A way to protect its border and keep Texa <script type="application/json" id="doc-lesson-7">"<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Texas Revolution Lesson 7<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>\n/* Layout: same field-notebook column as Lesson 1; a west-to-east rain strip and region cards replace the timeline ruler; sticky step strip on top. */\n:root{\n  --paper:#f5f7f9; --card:#ffffff; --ink:#1b2433; --muted:#566275; --rule:#d4dbe4;\n  --blue:#2f5fb3; --blue-soft:#e3ebf8; --gold:#b9831b; --gold-soft:#f8eed9;\n  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b33a2f; --bad-soft:#f9e3e0;\n  --display:\"Zilla Slab\", Rockwell, \"Roboto Slab\", Georgia, serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n  --mono:\"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;\n  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;\n  --good:#6fd29f; --good-soft:#173527; --bad:#f08a7f; --bad-soft:#3d1f1c; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#131820; --card:#1b222d; --ink:#e7 :0}\n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 7 of 17<\/p>\n  <h1>The Texas Revolution<\/h1>\n  <p class=\"q\">Big question: <b>How did a small army win independence in seven weeks?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.3B, 7.3C<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>From Gonzales to San Jacinto<\/h2>\n  <div class=\"prose\">\n    <p>In Lesson 6, Santa Anna threw out the Constitution of 1824 and peaceful requests failed. In the fall of 1835, the fighting began. At first, many Texians and Tejanos fought to restore the 1824 Constitution. By March 1836, they were fighting for independence.<\/p>\n  <\/div>\n\n  <h3>The road to independence<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">Oct 2, 1835<\/span><div><b>Gonzales<\/b><span>Mexican soldiers came to take back a small cannon. Settlers flew a flag that said \"Come and Take It\" and drove them off. This was the first battle.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">Dec 1835<\/span><div><b>Siege of Béxar<\/b><span>Texian and Tejano volunteers, including <b>Juan Seguín<\/b>'s company, captured San Antonio from Mexican troops.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">Feb 23 – Mar 6, 1836<\/span><div><b>The Alamo<\/b><span>Santa Anna's army surrounded about 180 to 250 defenders in the old mission. On March 6 the Mexican army stormed the walls. Nearly all the defenders died, including William B. Travis, James Bowie, and David Crockett.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">Mar 2, 1836<\/span><div><b>Convention of 1836<\/b><span>Delegates at Washington-on-the-Brazos signed the <b>Texas Declaration of Independence<\/b>. <b>George Childress<\/b> was its main author. <b>Lorenzo de Zavala<\/b>, a Mexican federalist leader, signed it and became interim vice president. Sam Houston was named commander of the army.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">Mar 27, 1836<\/span><div><b>Goliad<\/b><span>Colonel <b>James Fannin<\/b> surrendered his men after a battle near Goliad. On Santa Anna's orders, about 340 prisoners were executed. \"Remember Goliad!\" became a battle cry.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">Apr 21, 1836<\/span><div><b>San Jacinto<\/b><span>Houston's army of about 900 attacked Santa Anna's camp in the afternoon while many soldiers rested. The battle lasted about 18 minutes. Santa Anna was captured the next day and agreed to order his army out of Texas.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"dates\">\n    <div class=\"date\"><span class=\"yr\">1836<\/span><b>Texas declares independence<\/b><p>This is one of your eight required dates. Add it to your timeline.<\/p><\/div>\n  <\/div>\n\n  <h3>Read the source: Travis writes from the Alamo<\/h3>\n  <div class=\"excerpt\">\n    <span class=\"who\">William B. Travis, February 24, 1836 · excerpt<\/span>\n    <p>“To the People of Texas &amp; All Americans in the World—<\/p>\n    <p class=\"line\">Fellow Citizens &amp; compatriots—I am besieged, by a thousand or more of the Mexicans under Santa Anna. … The enemy has demanded a surrender at discretion, otherwise, the garrison are to be put to the sword, if the fort is taken—I have answered the demand with a cannon shot, &amp; our flag still waves proudly from the walls—I shall never surrender or retreat.<\/p>\n    <p class=\"line\">Then, I call on you in the name of Liberty, of patriotism &amp; everything dear to the American character, to come to our aid, with all dispatch. … Victory or Death.”<\/p>\n    <p><b>Annotate as you read:<\/b> Who is his <b>audience<\/b>? What is his <b>purpose<\/b>? What words does he choose to <b>persuade<\/b> them?<\/p>\n  <\/div>\n\n  <h3>The defenders were a mix of people<\/h3>\n  <div class=\"prose\"><p>The Alamo defenders came from many places. Most were recent arrivals from the United States, but some were born in England, Ireland, Scotland, Germany, and Denmark. Tejanos fought inside the walls too, such as Gregorio Esparza and José Toribio Losoya. Some survivors were women and children, like Susanna Dickinson and Esparza's family, and Joe, a man Travis held in slavery. Juan Seguín survived because Travis sent him out as a messenger to find help.<\/p><\/div>\n\n  <h3>Key people<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Sam Houston<\/b><span class=\"tag\">commander<\/span><\/div><p>Retreated east for weeks while his army trained and grew, then struck at San Jacinto.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Santa Anna<\/b><span class=\"tag\">Mexico's president<\/span><\/div><p>Led the Mexican army. His orders of no mercy at the Alamo and Goliad angered Texians and brought in volunteers.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Juan Seguín<\/b><span class=\"tag\">Tejano captain<\/span><\/div><p>Messenger from the Alamo. His company of Tejanos fought at San Jacinto.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Lorenzo de Zavala<\/b><span class=\"tag\">signer<\/span><\/div><p>Helped write Mexico's 1824 constitution, then signed Texas's Declaration of Independence.<\/p><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>How did a small army win?<\/b> The Alamo and Goliad cost lives but bought time and turned anger into recruits. Houston's long retreat, called the Runaway Scrape for the families who fled with it, kept his army alive. Santa Anna split his forces and let his guard down. When Houston finally attacked, surprise did the rest. Independence was declared on March 2 and won on April 21: seven weeks.<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Explain a turning point<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, explain <b>one turning point<\/b> of the Texas Revolution and <b>one person's role<\/b> in it. Make a claim about why it mattered, give evidence from today's lesson, and explain how that evidence supports your claim.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"One turning point of the Texas Revolution was...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I named a <b>turning point<\/b> and made a claim about why it mattered.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I described <b>one person's role<\/b> with specific evidence.<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class= h:0}\n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 8 of 17<\/p>\n  <h1>The Republic of Texas<\/h1>\n  <p class=\"q\">Big question: <b>Why did the Republic of Texas last only nine years?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.4A, 7.4B, 7.17A<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>A new country with big problems<\/h2>\n  <div class=\"prose\">\n    <p>Lesson 7 ended with victory at San Jacinto. Texas was now an independent nation, the <b>Republic of Texas<\/b>. It had a constitution, a president, an army, and even a navy. It also had almost no money, a long border with a Mexico that refused to accept the loss, and strong American Indian nations whose lands settlers kept moving onto.<\/p>\n    <p>Most Texans voted in 1836 to join the United States. The U.S. said no, at least for now. So Texas tried to make it on its own.<\/p>\n  <\/div>\n\n  <h3>Three presidents, three approaches<\/h3>\n  <div class=\"cmpbox\"><table class=\"cmp\">\n    <thead><tr><th><\/th><th>Sam Houston<\/th><th>Mirabeau B. Lamar<\/th><th>Anson Jones<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><th>Years<\/th><td>1836–38 and 1841–44<\/td><td>1838–41<\/td><td>1844–46<\/td><\/tr>\n      <tr><th>Money<\/th><td>Cut spending hard<\/td><td>Spent heavily and printed paper money that lost its value; debt soared<\/td><td>Kept costs low<\/td><\/tr>\n      <tr><th>American Indians<\/th><td>Sought peace treaties and trade<\/td><td>Waged war: drove the Cherokee out in 1839 and fought the Comanche in 1840<\/td><td>Continued Houston's peace policy<\/td><\/tr>\n      <tr><th>Big goal<\/th><td>Join the United States<\/td><td>Build a large, independent Texas; sent the failed Santa Fe Expedition<\/td><td>Finished annexation<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n\n  <div class=\"callout\"><b>Lamar's lasting gift.<\/b> Lamar's spending hurt the Republic, but he also set aside public land to pay for schools and a future university. That is why he is called the Father of Texas Education. He also moved the capital to a new town on the Colorado River named Austin.<\/div>\n\n  <h3>Problems the Republic could not solve<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Debt<\/b><span class=\"tag\">money<\/span><\/div><p>The government owed millions of dollars. Its paper money, called \"redbacks,\" became nearly worthless.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Defense<\/b><span class=\"tag\">Mexico<\/span><\/div><p>Mexico never recognized Texas. In 1842 Mexican armies captured San Antonio twice. A Texian raid into Mexico ended at Mier, where captured men had to draw beans to see who would be shot.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Conflict<\/b><span class=\"tag\">frontier<\/span><\/div><p>War with the Cherokee and Comanche cost lives and money. Peace was cheaper, but settlers kept pushing onto Native lands.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>The Santa Fe Expedition<\/b><span class=\"tag\">1841<\/span><\/div><p>Lamar sent traders and soldiers to claim Santa Fe. They got lost, ran short of food, and were captured by Mexican troops. <b>José Antonio Navarro<\/b> was among them and spent years in a Mexican prison.<\/p><\/div>\n  <\/div>\n\n  <h3>The road to annexation<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1837<\/span><div><b>U.S. recognizes Texas<\/b><span>But it refused annexation. Northern leaders opposed adding another slave state, and many feared war with Mexico.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1839–40<\/span><div><b>Europe takes notice<\/b><span>France and Britain recognized Texas. Britain hoped Texas would stay independent, and maybe end slavery. Americans worried about Britain gaining influence next door.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1844<\/span><div><b>Annexation becomes a campaign issue<\/b><span>A treaty failed in the U.S. Senate. Then James K. Polk won the presidency promising to add Texas.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1845<\/span><div><b>Texas votes to join<\/b><span>Congress passed a joint resolution offering annexation. A Texas convention accepted it, and Texas became the 28th state on December 29, 1845. Navarro, home from prison, was the only Tejano delegate, and he fought to keep voting rights from being limited to white men only.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"dates\">\n    <div class=\"date\"><span class=\"yr\">1845<\/span><b>Annexation: Texas joins the United States<\/b><p>This is one of your eight required dates. Add it to your timeline.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Finish the claim<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, complete this claim and defend it: <b>Annexation was mostly about ___.<\/b> Give one piece of evidence from today's lesson and explain how it supports your claim.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"Annexation was mostly about...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 8 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 8<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">The Republic of Texas<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Republic of Texas,” “Lamar, Mirabeau Buonaparte,” “Navarro, José Antonio,” “Annexation,” “Texan Santa Fe Expedition”<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson8-v1\", \"n\": 8, \"label\": \"Lesson 8\", \"title\": \"The Republic of Texas\", \"practice\": [{\"type\": \"sort\", \"title\": \"Houston or Lamar?\", \"intro\": \"Which president's policy was this?\", \"button\": \"Check my sorting\", \"word\": \"sorted correctly\", \"choices\": [[\"H\", \"Houston\"], [\"L\", \"Lamar\"]], \"items\": [[\"Made peace treaties with American Indian nations\", \"H\", \"Houston had lived among the Cherokee and preferred peace.\"], [\"Drove the Cherokee out of East Texas\", \"L\", \"Lamar's Cherokee War was in 1839.\"], [\"Sent the Santa Fe Expedition\", \"L\", \"It was meant to expand Texas trade and territory.\"], [\"Cut government spending to reduce debt\", \"H\", \"Houston slashed costs in his second term.\"], [\"Set aside land to pay for public schools\", \"L\", \"This is why Lamar is the Father of Texas Education.\"], [\"Wanted Texas to join the United States\", \"H\", \"Lamar wanted an independent Texas.\"]]}, {\"type\": \"match\", \"title\": \"Problems and effects\", \"intro\": \"Match each problem to what it led to.\", \"placeholder\": \"Choose an effect…\", \"button\": \"Check my matches\", \"word\": \"correct\", \"options\": [\"Texans wanted the U.S. to take over the debt and protect them\", \"Northern leaders blocked annexation for years\", \"Americans feared Britain gaining a foothold\", \"Texas saw it needed a stronger protector\"], \"items\": [[\"Paper money became worthless and debt grew\", 0], [\"Texas allowed slavery\", 1], [\"Britain showed interest in an independent Texas\", 2], [\"Mexican armies captured San Antonio in 1842\", 3]]}, {\"type\": \"order\", \"title\": \"Republic timeline\", \"intro\": \"Use the arrows to put these in order, earliest at the top.\", \"button\": \"Check my order\", \"word\": \"in the right spot\", \"seed\": 6, \"items\": [[\"Victory at San Jacinto\", \"1836\"], [\"The U.S. recognizes Texas but refuses annexation\", \"1837\"], [\"Lamar drives out the Cherokee\", \"1839\"], [\"The Santa Fe Expedition is captured\", \"1841\"], [\"Mexican armies capture San Antonio twice\", \"1842\"], [\"Texas becomes the 28th state\", \"1845\"]]}, {\"type\": \"mc\", \"title\": \"Think it through\", \"intro\": \"Pick the best answer.\", \"button\": \"Check my answers\", \"word\": \"correct\", \"items\": [{\"q\": \"Why did many Texans want annexation?\", \"o\": [\"To escape debt and get U.S. protection from Mexico\", \"To become part of Britain\", \"To give up slavery\"], \"a\": 0, \"e\": \"Joining the U.S. solved the Republic's two biggest problems.\"}, {\"q\": \"Which is evidence that Lamar's policies made things worse?\", \"o\": [\"He moved the capital to Austin\", \"He supported schools\", \"Debt soared and the Santa Fe Expedition failed\"], \"a\": 2, \"e\": \"Expensive wars and failed plans deepened the money crisis.\"}, {\"q\": \"What did Navarro fight for at the Convention of 1845?\", \"o\": [\"Ending annexation\", \"Keeping voting from being limited to white men only, protecting Tejano rights\", \"Moving the capital\"], \"a\": 1, \"e\": \"He was the only Tejano delegate.\"}]}], \"quiz\": [{\"q\": \"How long did the Republic of Texas last?\", \"o\": [\"Two years\", \"About nine years (1836–1845)\", \"Fifty years\", \"One year\"], \"a\": 1, \"e\": \"It became a state at the end of 1845.\"}, {\"q\": \"Who was the first elected president of the Republic of Texas?\", \"o\": [\"Stephen F. Austin\", \"Anson Jones\", \"Lorenzo de Zavala\", \"Sam Houston\"], \"a\": 3, \"e\": \"Houston served twice.\"}, {\"q\": \"Mirabeau B. Lamar is called the Father of Texas Education because he…\", \"o\": [\"Set aside public land to pay for schools and a university\", \"Built the first college himself\", \"Taught school\", \"Wrote the first textbook\"], \"a\": 0, \"e\": \"Land grants funded schools for generations.\"}, {\"q\": \"How did Lamar's policy toward American Indians differ from Houston's?\", \"o\": [\"Lamar sought peace; Houston waged war\", \"They were the same\", \"Lamar waged war; Houston sought peace\", \"Neither had a policy\"], \"a\": 2, \"e\": \"Lamar's wars were costly in lives and money.\"}, {\"q\": \"What happened to the Santa Fe Expedition?\", \"o\": [\"It captured Santa Fe\", \"It found gold\", \"Its members were captured by Mexican troops\", \"It founded Austin\"], \"a\": 2, \"e\": \"The failure embarrassed Texas and added to debt.\"}, {\"q\": \"Why did the U.S. refuse annexation at first?\", \"o\": [\"Northern opposition to adding a slave state and fear of war with Mexico\", \"Texas was too small\", \"Texas did not want to join\", \"Britain owned Texas\"], \"a\": 0, \"e\": \"Slavery made annexation a national fight.\"}, {\"q\": \"Which was NOT a major problem of the Republic?\", \"o\": [\"Debt\", \"Defense against Mexico\", \"Conflict on the frontier\", \"Too much money in the treasury\"], \"a\": 3, \"e\": \"The Republic was always short of money.\"}, {\"q\": \"What happened in 1845?\", \"o\": [\"Texas declared independence\", \"Texas joined the United States\", \"The Civil War began\", \"Mexico won independence\"], \"a\": 1, \"e\": \"1845 is a required date.\"}, {\"q\": \"Who was José Antonio Navarro?\", \"o\": [\"A Tejano patriot who signed the Declaration, was imprisoned after Santa Fe, and served at the 1845 convention\", \"A Mexican general\", \"The last president of the Republic\", \"A British diplomat\"], \"a\": 0, \"e\": \"He defended Tejano rights at every step.\"}, {\"q\": \"Which sentence best answers the big question?\", \"o\": [\"The Republic ended because Mexico conquered it\", \"Britain bought Texas\", \"Debt, weak defense, and costly frontier wars pushed Texans to join the U.S., which agreed in 1845 once Polk was elected\", \"The Republic lasted 100 years\"], \"a\": 2, \"e\": \"Texas could not solve its problems alone.\"}], \"review\": \"Review the presidents chart and the Republic's problems\"};\n(function(){\nconst C=window.LESSON;\nconst KEY=C.key;\nlet S={};\ntry{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst strip=s=>String(s).replace(/<[^>]+>/g,\"\");\nfunction shuffled(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction fb(id,n,t,word){const el=$(id);el.className=\"fb \"+(n===t?\"ok\":\"no\");el.textContent=n===t?`All ${t} ${word}. Nice work.`:`${n} of ${t} ${word}. Fix the red ones and check again.`}\nfunction mcHTML(set,prefix,ans,marks){return set.map((q,i)=>`<fieldset><legend>${q.q}<\/legend>${q.o.map((o,j)=>{const c=marks&&String(ans[i])===String(j)?(j===q.a?\"ok\":\"no\"):\"\";return `<label class=\"opt ${c}\"><input type=\"radio\" name=\"${prefix}${i}\" value=\"${j}\" ${String(ans[i])===String(j)?\"checked\":\"\"}> <span>${o}<\/span><\/label>`}).join(\"\")}${marks&&String(ans[i])===String(q.a)?`<p class=\"explain\">${q.e}<\/p>`:\"\"}<\/fieldset>`).join(\"\")}\n\nS.p=S.p||{};S.ps=S.ps||{};\nconst T=C.practice;\nconst total=t=>t.type===\"compare\"?t.items.length*t.columns.length:t.items.length;\n$(\"practiceTasks\").innerHTML=T.map((t,ti)=>`<div class=\"task\" id=\"task${ti}\"><header><h3>${String.fromCharCode(65+ti)}. ${t.title}<\/h3><p>${t.intro}<\/p><\/header>${t.before||\"\"}<div id=\"body${ti}\" class=\"${t.type===\"match\"?\"match wide\":t.type===\"sort\"?\"sort\":\"\"}\"${t.type===\"mc\"?' style=\"display:grid;gap:18px\"':\"\"}><\/div><div class=\"row\"><button class=\"btn\" id=\"chk${ti}\">${t.button}<\/button><span class=\"fb\" id=\"fb${ti}\" aria-live=\"polite\"><\/span><\/div><\/div>`).join(\"\");\n\nfunction setScore(ti,n){S.ps[ti]=n;save();fb(\"fb\"+ti,n,total(T[ti]),T[ti].word);updateAll()}\nfunction clearScore(ti){if(S.ps[ti]!=null){S.ps[ti]=null;save()}$(\"fb\"+ti).textContent=\"\";updateAll()}\nconst scored=ti=>S.ps[ti]!=null;\n\nT.forEach((t,ti)=>{\n  const body=$(\"body\"+ti);\n  if(t.type===\"match\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    body.innerHTML=t.items.map((c,i)=>`<label id=\"m${ti}_${i}\" for=\"ms${ti}_${i}\"><span class=\"t\">${c[0]}<\/span><select id=\"ms${ti}_${i}\" data-i=\"${i}\"><option value=\"\">${t.placeholder}<\/option>${t.options.map((n,j)=>`<option value=\"${j}\">${esc(n)}<\/option>`).join(\"\")}<\/select><\/label>`).join(\"\");\n    t.items.forEach((c,i)=>{if(A[i]!=null)$(`ms${ti}_${i}`).value=A[i]});\n    const ok=i=>String(A[i])===String(t.items[i][1]);\n    const mark=on=>t.items.forEach((c,i)=>{$(`m${ti}_${i}`).className=on?(ok(i)?\"ok\":\"no\"):\"\"});\n    body.addEventListener(\"change\",e=>{A[e.target.dataset.i]=e.target.value;save();mark(false);clearScore(ti)});\n    $(\"chk\"+ti).onclick=()=>{mark(true);setScore(ti,t.items.filter((c,i)=>ok(i)).length)};\n    if(scored(ti)){mark(true);fb(\"fb\"+ti,S.ps[ti],total(t),t.word)}\n  }\n  if(t.type===\"sort\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    const render=marks=>{body.innerHTML=t.items.map((s,i)=>{const v=A[i];const cls=marks&&v?(v===s[1]?\"ok\":\"no\"):\"\";\n      return `<div class=\"src ${cls}\"><span class=\"t\">${s[0]}<\/span><span class=\"seg\" role=\"group\" aria-label=\"${esc(t.choices.map(c=>c[1]).join(\" or \"))}\">${t.choices.map(c=>`<button type=\"button\" data-i=\"${i}\" data-v=\"${c[0]}\" aria-pressed=\"${v===c[0]}\">${c[1]}<\/button>`).join(\"\")}<\/span>${marks&&v?`<span class=\"why\">${v===s[1]?\"Correct.\":\"Not quite.\"} ${s[2]}<\/span>`:\"\"}<\/div>`}).join(\"\")};\n    body.addEventListener(\"click\",e=>{const b=e.target.closest(\"button[data-v]\");if(!b)return;A[b.dataset.i]=b.dataset.v;save();render(false);clearScore(ti)});\n    $(\"chk\"+ti).onclick=()=>{render(true);setScore(ti,t.items.filter((s,i)=>A[i]===s[1]).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n  if(t.type===\"order\"){\n    let A=S.p[ti];\n    if(!Array.isArray(A)||A.length!==t.items.length){A=shuffled(t.items.length,t.seed||7);if(A.every((v,i)=>v===i))A.reverse();S.p[ti]=A;save()}\n    body.innerHTML=`<ol class=\"order\" id=\"ol${ti}\"><\/ol>`;\n    const render=marks=>{$(\"ol\"+ti).innerHTML=A.map((idx,pos)=>{const it=t.items[idx];const cls=marks?(idx===pos?\"ok\":\"no\"):\"\";\n      return `<li class=\"${cls}\"><span class=\"grip\" aria-hidden=\"true\">⠿<\/span><span class=\"t\">${it[0]}${marks&&idx===pos?` <span class=\"yr\" style=\"color:var(--good)\">· ${it[1]}<\/span>`:\"\"}<\/span><span class=\"mv\"><button type=\"button\" class=\"icon\" data-p=\"${pos}\" data-d=\"-1\" aria-label=\"Move up: ${esc(strip(it[0]))}\" ${pos===0?\"disabled\":\"\"}>↑<\/button><button type=\"button\" class=\"icon\" data-p=\"${pos}\" data-d=\"1\" aria-label=\"Move down: ${esc(strip(it[0]))}\" ${pos===A.length-1?\"disabled\":\"\"}>↓<\/button><\/span><\/li>`}).join(\"\")};\n    // Drag to reorder. Pointer Events cover mouse, touch and pen with one path; the\n    // drag starts on the grip only, so touching the row itself still scrolls the page.\n    (()=>{const ol=$(\"ol\"+ti);let d=null;\n      ol.addEventListener(\"pointerdown\",e=>{const g=e.target.closest(\".grip\");if(!g)return;\n        const li=g.closest(\"li\");if(!li)return;e.preventDefault();\n        d={li,from:[...ol.children].indexOf(li),id:e.pointerId};\n        li.classList.add(\"dragging\");try{g.setPointerCapture(e.pointerId)}catch(err){}});\n      ol.addEventListener(\"pointermove\",e=>{if(!d||e.pointerId!==d.id)return;e.preventDefault();\n        const other=[...ol.children].filter(x=>x!==d.li);\n        const before=other.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});\n        if(before)ol.insertBefore(d.li,before);else ol.appendChild(d.li)});\n      const end=e=>{if(!d||e.pointerId!==d.id)return;\n        const li=d.li,from=d.from,to=[...ol.children].indexOf(li);d=null;\n        li.classList.remove(\"dragging\");\n        if(to<0||to===from){render(scored(ti));return}\n        A.splice(to,0,A.splice(from,1)[0]);save();render(false);clearScore(ti)};\n      ol.addEventListener(\"pointerup\",end);ol.addEventListener(\"pointercancel\",end);})();\n    body.addEventListener(\"click\",e=>{const b=e.target.closest(\"button[data-d]\");if(!b)return;const p=+b.dataset.p,q=p+(+b.dataset.d);if(q<0||q>=A.length)return;[A[p],A[q]]=[A[q],A[p]];save();render(false);clearScore(ti);\n      const nb=$(\"ol\"+ti).querySelectorAll(\"li\")[q]?.querySelector(`button[data-d=\"${b.dataset.d}\"]`);if(nb&&!nb.disabled)nb.focus();else $(\"ol\"+ti).querySelectorAll(\"li\")[q]?.querySelector(\"button:not([disabled])\")?.focus()});\n    $(\"chk\"+ti).onclick=()=>{render(true);setScore(ti,A.filter((v,i)=>v===i).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n  if(t.type===\"compare\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    const cols=t.columns,ph=t.placeholder||\"Choose…\";\n    const ok=(i,k)=>String(A[i+\"_\"+k])===String(t.items[i].a[k]);\n    body.innerHTML=`<div class=\"cmpbox\"><table class=\"cmp\"><thead><tr><th scope=\"col\"><\/th>${cols.map(p=>`<th scope=\"col\">${esc(p)}<\/th>`).join(\"\")}<\/tr><\/thead><tbody>${t.items.map((r,i)=>`<tr><th scope=\"row\">${r.row}<\/th>${cols.map((p,k)=>`<td id=\"ct${ti}_${i}_${k}\"><select id=\"cs${ti}_${i}_${k}\" data-k=\"${i}_${k}\" aria-label=\"${esc(p)}: ${esc(strip(r.row))}\"><option value=\"\">${esc(ph)}<\/option>${r.o.map((o,j)=>`<option value=\"${j}\">${esc(o)}<\/option>`).join(\"\")}<\/select><\/td>`).join(\"\")}<\/tr>`).join(\"\")}<\/tbody><\/table><\/div>`;\n    t.items.forEach((r,i)=>cols.forEach((p,k)=>{const el=$(`cs${ti}_${i}_${k}`);if(A[i+\"_\"+k]!=null)el.value=A[i+\"_\"+k]}));\n    const mark=on=>t.items.forEach((r,i)=>cols.forEach((p,k)=>{$(`ct${ti}_${i}_${k}`).className=on?(ok(i,k)?\"ok\":\"no\"):\"\"}));\n    body.addEventListener(\"change\",e=>{A[e.target.dataset.k]=e.target.value;save();mark(false);clearScore(ti)});\n    $(\"chk\"+ti).onclick=()=>{mark(true);setScore(ti,t.items.reduce((n,r,i)=>n+cols.filter((p,k)=>ok(i,k)).length,0))};\n    if(scored(ti)){mark(true);fb(\"fb\"+ti,S.ps[ti],total(t),t.word)}\n  }\n  if(t.type===\"mc\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    const render=m=>{body.innerHTML=mcHTML(t.items,`c${ti}_`,A,m)};\n    body.addEventListener(\"change\",e=>{A[e.target.name.split(\"_\")[1]]=+e.target.value;save();render(false);clearScore(ti)});\n    $(\"chk\"+ti).onclick=()=>{render(true);setScore(ti,t.items.filter((q,i)=>A[i]===q.a).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n});\n\n// Quiz\nconst QUIZ=C.quiz;\nS.qz=S.qz||{};\nfunction renderQuiz(){$(\"quiz\").innerHTML=mcHTML(QUIZ,\"qz\",S.qz,S.qzScore!=null);$(\"submitQuiz\").textContent=S.qzScore!=null?\"Check again\":\"Submit quiz\"}\n// Re-answering clears only that question's marks: a full re-render would drop every\n// other question's result and scroll the student away from where they were working.\nfunction unmarkQuestion(i){const f=$(\"quiz\").querySelectorAll(\"fieldset\")[i];if(!f)return;f.querySelectorAll(\".opt\").forEach(l=>l.classList.remove(\"ok\",\"no\"));f.querySelector(\".explain\")?.remove()}\n$(\"quiz\").addEventListener(\"change\",e=>{const i=+e.target.name.slice(2);S.qz[i]=+e.target.value;save();if(S.qzScore!=null)unmarkQuestion(i);updateAll()});\n$(\"quiz\").addEventListener(\"submit\",e=>e.preventDefault());\n$(\"submitQuiz\").onclick=()=>{const left=QUIZ.length-Object.keys(S.qz).length;if(left>0){$(\"fbQuiz\").className=\"fb no\";$(\"fbQuiz\").textContent=`Answer all questions first (${left} left).`;return}\n  S.qzScore=QUIZ.filter((q,i)=>S.qz[i]===q.a).length;S.qzDate=new Date().toLocaleDateString();save();renderQuiz();fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");updateAll()};\nrenderQuiz();if(S.qzScore!=null)fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");\n\n// Exit claim\n$(\"claim\").value=S.claim||\"\";\n[\"ck1\",\"ck2\",\"ck3\"].forEach(k=>{$(k).checked=!!S[k];$(k).onchange=()=>{S[k]=$(k).checked;save();updateAll()}});\nfunction wc(){const n=($(\"claim\").value.trim().match(/\\S+/g)||[]).length;$(\"wc\").textContent=n+(n===1?\" word\":\" words\");return n}\n$(\"claim\").addEventListener(\"input\",()=>{S.claim=$(\"claim\").value;save();wc();updateAll()});wc();\n\nfunction report(){\n  const L=[`Texas History ${C.label}: ${C.title}`];\n  T.forEach((t,ti)=>L.push(`${String.fromCharCode(65+ti)}. ${strip(t.title)}: ${S.ps[ti]==null?\"not checked yet\":S.ps[ti]+\"/\"+total(t)}`));\n  L.push(`Quiz: ${S.qzScore==null?\"not submitted\":S.qzScore+\"/\"+QUIZ.length+(S.qzDate?\" (submitted \"+S.qzDate+\")\":\"\")}`);\n  if(S.qzScore!=null){const miss=QUIZ.map((q,i)=>S.qz[i]===q.a?null:i+1).filter(Boolean);if(miss.length)L.push(\"Missed quiz questions: \"+miss.join(\", \"))}\n  const ck=[\"ck1\",\"ck2\",\"ck3\"].filter(k=>S[k]).length;\n  const head=L.shift();\n  const pr=$(\"reflect\").querySelector(\".prose\");\n  const prompt=pr?pr.textContent.replace(/\\s+/g,\" \").trim():\"\";\n  return [head,\n    S.doneAt?\"Completed \"+S.doneAt:\"Not finished yet\",\n    \"\",\n    \"EXIT CLAIM (for a parent to grade)\",\n    \"Prompt: \"+prompt,\n    `Answer (${wc()} words, self-check ${ck}/3):`,\n    S.claim&&S.claim.trim()?S.claim.trim():\"(not written yet)\",\n    \"\",\n    \"SCORES\",\n    ...L].join(\"\\n\");\n}\nfunction updateAll(){\n  const doneP=T.every((t,ti)=>S.ps[ti]!=null);\n  const anyP=T.some((t,ti)=>S.ps[ti]!=null);\n  const claimDone=wc()>=20&&[\"ck1\",\"ck2\",\"ck3\"].every(k=>S[k]);\n  $(\"nav-read\").classList.toggle(\"done\",anyP);\n  $(\"nav-practice\").classList.toggle(\"done\",doneP);\n  $(\"nav-check\").classList.toggle(\"done\",S.qzScore!=null);\n  $(\"nav-reflect\").classList.toggle(\"done\",claimDone);\n  const all=doneP&&S.qzScore!=null&&claimDone;\n  $(\"nav-results\").classList.toggle(\"done\",all);\n  const pTot=T.reduce((a,t)=>a+total(t),0);\n  const pGot=T.reduce((a,t,ti)=>a+(S.ps[ti]||0),0);\n  const cell=(v,l)=>`<div><b>${v}<\/b><span>${l}<\/span><\/div>`;\n  const letters=\"A–\"+String.fromCharCode(64+T.length);\n  $(\"score\").innerHTML=cell(doneP?`${pGot}/${pTot}`:\"—\",`Practice (${letters})`)+cell(S.qzScore!=null?`${S.qzScore}/${QUIZ.length}`:\"—\",\"Quiz\")+cell(S.qzScore!=null?Math.round(S.qzScore/QUIZ.length*100)+\"%\":\"—\",\"Quiz percent\")+cell(claimDone?\"Done\":\"—\",\"Exit claim\");\n  let st;\n  const need=Math.ceil(QUIZ.length*0.8);\n  if(all) st=S.qzScore>=need?`Lesson complete. Mastery reached (${need}/${QUIZ.length} or better on the quiz).`:`Lesson complete. ${C.review}, then talk through the missed quiz questions with a parent.`;\n  else{const todo=[];if(!doneP)todo.push(`check all ${T.length===4?\"four\":T.length} practice activities`);if(S.qzScore==null)todo.push(\"submit the quiz\");if(!claimDone)todo.push(\"write the exit claim (20+ words) and tick all three boxes\");st=\"Still to do: \"+todo.join(\", \")+\".\"}\n  $(\"status\").textContent=st;\n  if(all&&!S.doneAt){S.doneAt=new Date().toLocaleString([], {dateStyle:\"medium\",timeStyle:\"short\"});save()}\n  if(!all&&S.doneAt){S.doneAt=undefined;save()}\n  $(\"cert\").classList.toggle(\"complete\",all);\n  $(\"stamp\").textContent=all?\"Lesson complete\":\"In progress\";\n  $(\"certDate\").textContent=all?\"Completed \"+S.doneAt:\"\";\n  $(\"shot\").hidden=!all;\n}\n$(\"copy\").onclick=()=>{const t=report();const box=$(\"reportText\");box.value=t;\n  const fallback=()=>{box.hidden=false;box.focus();box.select();$(\"fbCopy\").className=\"fb\";$(\"fbCopy\").textContent=\"Select all of the text below and copy it. Then paste the answers into a message to your parents.\"};\n  try{navigator.clipboard.writeText(t).then(()=>{$(\"fbCopy\").className=\"fb ok\";$(\"fbCopy\").textContent=\"Copied. Now paste the answers into a message to your parents.\"},fallback)}catch(e){fallback()}};\nfunction askReset(){$(\"resetBox\").innerHTML=`<span>Erase your answers for this lesson? Your other lessons keep their work.<\/span><button class=\"btn\" id=\"yesReset\" style=\"background:var(--bad)\">Erase this lesson<\/button><button class=\"btn ghost\" id=\"noReset\">Keep my work<\/button>`;\n  $(\"yesReset\").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};\n  $(\"noReset\").onclick=()=>{$(\"resetBox\").innerHTML=`<button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>`;$(\"reset\").onclick=askReset};}\n$(\"reset\").onclick=askReset;\nupdateAll();\n})();\n\n<\/script>\n\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');if(!a)return;e.preventDefault();var t=document.getElementById(a.getAttribute(\"href\").slice(1));if(t)t.scrollIntoView({behavior:matchMedia(\"(prefers-reduced-motion: reduce)\").matches?\"auto\":\"smooth\"})});<\/script>\n<\/body><\/html>"</script>
<script type="application/json" id="doc-lesson-9">"<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Early Statehood Lesson 9<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>\n/* Layout: same field-notebook column as Lesson 1; a west-to-east rain strip and region cards replace the timeline ruler; sticky step strip on top. */\n:root{\n  --paper:#f5f7f9; --card:#ffffff; --ink:#1b2433; --muted:#566275; --rule:#d4dbe4;\n  --blue:#2f5fb3; --blue-soft:#e3ebf8; --gold:#b9831b; --gold-soft:#f8eed9;\n  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b33a2f; --bad-soft:#f9e3e0;\n  --display:\"Zilla Slab\", Rockwell, \"Roboto Slab\", Georgia, serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n  --mono:\"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;\n  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;\n  --good:#6fd29f; --good-soft:#173527; --bad:#f08a7f; --bad-soft:#3d1f1c; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#131820; --card:#1b222d; --ink:#e7e
