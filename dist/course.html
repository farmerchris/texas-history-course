<style>
/* Layout: same field-notebook palette as the lesson pages. Home = progress strip + unit lists; a lesson opens full-height in a frame under a slim course bar. */
:root{
  --paper:#f5f7f9; --card:#ffffff; --ink:#1b2433; --muted:#566275; --rule:#d4dbe4;

  --good:#1f7a4d; --good-soft:#e1f2e8; --empty:#e6eaf0;

  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;
  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;
  --good:#6fd29f; --good-soft:#173527; --empty:#263040; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;
  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;
  --good:#6fd29f; --good-soft:#173527; --empty:#263040; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* home */
#home{padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:28px}
header.top{display:grid;gap:8px}
header.top h1{font-size:clamp(2rem,6vw,2.6rem)}
header.top p{color:var(--muted)}
.progress{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:14px}
.ptop{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.big{font-family:var(--mono);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;color:var(--muted);font-weight:500}
.cells{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px}
.cell{height:14px;border-radius:3px;background:var(--empty);border:0;padding:0}
.cell.started{background:var(--gold)}
.cell.done{background:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--empty)}
.legend .l-s::before{background:var(--gold)} .legend .l-d::before{background:var(--good)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;background:var(--blue);color:var(--card);min-height:44px}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.fb{font-size:.9rem;font-weight:700;color:var(--good)}
.unit{display:grid;gap:8px}
.unit h2{font-size:1.25rem;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid}
.row{width:100%;display:grid;grid-template-columns:5.2rem 1fr auto;align-items:center;gap:4px 12px;padding:12px 4px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left}
.row:hover{background:var(--blue-soft)}
.row .lab{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row .ttl{font-weight:700;min-width:0}
.row .ttl .tag{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 7px;vertical-align:2px}
.state{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.8rem;white-space:nowrap}
.pill{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.pill.started{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.pill.done{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.state .num{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
#reportBox{width:100%;min-height:10rem;font:inherit;font-size:.9rem;padding:10px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
@media (max-width:520px){.row{grid-template-columns:1fr auto}.row .lab{grid-column:1/-1}}

/* lesson view */
#view{height:100%;display:flex;flex-direction:column}
#view[hidden]{display:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;height:var(--bar);display:flex;align-items:center;gap:8px;padding-inline:8px;background:var(--card);border-bottom:1px solid var(--rule)}
.bar .back{display:flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--blue);padding:8px 10px;border-radius:8px;min-height:44px;white-space:nowrap}
.bar .back:hover,.bar .nav:hover{background:var(--blue-soft)}
.bar .where{flex:1;min-width:0;display:grid;line-height:1.2}
.bar .where b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.bar .where span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar .nav{width:44px;height:44px;border:1px solid var(--rule);border-radius:8px;background:var(--card);font-size:1.4rem;line-height:1}
.bar .nav:disabled{opacity:.35;cursor:default}
#frameWrap{flex:1;min-height:0}
#frameWrap iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}
@media (max-width:420px){.bar .back .txt{display:none}}
</style>

<div id="home">
  <div class="wrap">
    <header class="top">
      <p class="eyebrow" id="sub"></p>
      <h1 id="h1"></h1>
      <p>Pick any lesson to open it. Your work saves on this device as you go, and the tracker updates when you come back here.</p>
    </header>

    <section class="progress" aria-labelledby="progLabel">
      <div class="ptop">
        <h2 id="progLabel" style="font-size:1.2rem">Course progress</h2>
        <p class="big" id="countDone"></p>
      </div>
      <div class="cells" id="cells" role="list"></div>
      <div class="legend"><span>Not started</span><span class="l-s">In progress</span><span class="l-d">Complete</span></div>
      <div class="actions">
        <button class="btn" id="continue"></button>
        <button class="btn ghost" id="copyReport">Copy progress report</button>
        <span class="fb" id="fbReport" aria-live="polite"></span>
      </div>
      <textarea id="reportBox" readonly hidden aria-label="Progress report"></textarea>
    </section>

    <div id="units" style="display:grid;gap:28px"></div>
  </div>
</div>

<div id="view" hidden>
  <div class="bar">
    <button class="back" id="back" aria-label="Back to all lessons">← <span class="txt">All lessons</span></button>
    <div class="where"><span id="vLab"></span><b id="vTitle"></b></div>
    <button class="nav" id="prev" aria-label="Previous lesson">‹</button>
    <button class="nav" id="next" aria-label="Next lesson">›</button>
  </div>
  <div id="frameWrap"></div>
</div>

"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 1 of 17<\/p>\n  <h1>Eras, Dates &amp; the Historian's Toolkit<\/h1>\n  <p class=\"q\">Big question: <b>Why do historians divide Texas history into eras?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1A, 7.1B, 7.20A, 7.20B, 7.21A<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n<h2>Cutting a long story into chapters<\/h2>\n  <div class=\"prose\">\n    <p>People have lived in the land we call Texas for more than 13,000 years. That is far too much to study all at once. So historians do what authors do with a long book: they split it into chapters. In history, those chapters are called <b>eras<\/b>.<\/p>\n    <p>An era is a stretch of time with <b>defining characteristics<\/b>, things that were true for most of that period. During the Spanish Colonial era, for example, Spain ruled Texas and built missions, forts called presidios, and ranches. When Mexico won its independence in 1821, the rules changed, so a new era began.<\/p>\n    <p>Eras help us see <b>change over time<\/b>. When you can name the era, you can ask good questions: Who was in charge? How did people make a living? What changed from the era before?<\/p>\n    <div class=\"callout\"><b>Historians disagree about edges.<\/b> Did the Civil Rights era start in 1945 or 1954? Different books draw the lines differently. The dates below are approximate. What matters most is the big change that separates one era from the next.<\/div>\n  <\/div>\n\n  <h3>The 12 eras of Texas history<\/h3>\n  <div class=\"ruler\" id=\"ruler\"><div class=\"era\"><div class=\"yr\">Before 1519<\/div><div><b>Natural Texas and Its People<\/b><span>American Indian groups such as the Caddo, Jumano, and Karankawa adapt to Texas's very different regions.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1519–1689<\/div><div><b>Age of Contact<\/b><span>European explorers like Álvarez de Pineda, Cabeza de Vaca, and La Salle reach Texas.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1690–1821<\/div><div><b>Spanish Colonial<\/b><span>Spain builds missions, presidios, towns, and ranches to hold Texas.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1821–1835<\/div><div><b>Mexican National<\/b><span>Mexico rules Texas and invites settlers, including Stephen F. Austin's colonists.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1835–1845<\/div><div><b>Revolution and Republic<\/b><span>Texans fight for independence and run their own country, the Republic of Texas.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1845–1861<\/div><div><b>Early Statehood<\/b><span>Texas joins the United States and grows quickly.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1861–1874<\/div><div><b>Civil War and Reconstruction<\/b><span>Texas secedes, fights for the Confederacy, and is rebuilt after the war.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1874–1900<\/div><div><b>Cotton, Cattle, and Railroads<\/b><span>Cattle drives, cotton farming, and new railroads spread across the state.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1901–1929<\/div><div><b>Age of Oil<\/b><span>The Spindletop gusher starts an oil boom that changes the economy.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1929–1945<\/div><div><b>Great Depression and World War II<\/b><span>Hard times, the Dust Bowl, and a world war reshape Texas.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1945–1980<\/div><div><b>Civil Rights and Conservatism<\/b><span>Texans fight for equal rights, and political loyalties begin to shift.<\/span><\/div><\/div><div class=\"era\"><div class=\"yr\">1980–today<\/div><div><b>Contemporary Texas<\/b><span>Big cities, new technology, and fast population growth.<\/span><\/div><\/div><\/div>\n\n  <h3>Eight dates every Texan should know<\/h3>\n  <div class=\"dates\" id=\"dateCards\"><div class=\"date\"><span class=\"yr\">1519<\/span><p>Álvarez de Pineda maps the Texas coast; Spain founds its first settlement on the North American mainland.<\/p><\/div><div class=\"date\"><span class=\"yr\">1718<\/span><p>San Antonio is founded.<\/p><\/div><div class=\"date\"><span class=\"yr\">1821<\/span><p>Mexico, including Texas, wins independence from Spain.<\/p><\/div><div class=\"date\"><span class=\"yr\">1836<\/span><p>Texas declares independence from Mexico.<\/p><\/div><div class=\"date\"><span class=\"yr\">1845<\/span><p>Texas is annexed and becomes a U.S. state.<\/p><\/div><div class=\"date\"><span class=\"yr\">1861<\/span><p>The Civil War begins; Texas has seceded.<\/p><\/div><div class=\"date\"><span class=\"yr\">1876<\/span><p>Texans adopt the state constitution still used today.<\/p><\/div><div class=\"date\"><span class=\"yr\">1901<\/span><p>Oil gushes at Spindletop near Beaumont.<\/p><\/div><\/div>\n\n  <h3>The historian's toolkit: two kinds of sources<\/h3>\n  <div class=\"ps\">\n    <div><b>Primary source<\/b><p>Made by someone who was there, at the time. Letters, diaries, photographs, laws, maps, and interviews with eyewitnesses are primary sources.<\/p><p class=\"small\">Example: William B. Travis's letter written inside the Alamo in 1836.<\/p><\/div>\n    <div><b>Secondary source<\/b><p>Made later by someone who studied the event but did not see it. Textbooks, encyclopedia articles, and most documentaries are secondary sources.<\/p><p class=\"small\">Example: an encyclopedia article about the Alamo written in 1990.<\/p><\/div>\n  <\/div>\n  <div class=\"prose\"><p>A quick test: <b>Was the creator there when it happened?<\/b> If yes, it is primary. If they learned about it afterward, it is secondary. Both are useful. Primary sources give you evidence; secondary sources help explain it.<\/p><\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>Why do historians divide Texas history into eras?<\/b> Make a claim, give one piece of evidence from today's lesson (an era, a date, or a change), and explain how your evidence supports your claim.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"Historians divide Texas history into eras because...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (an era, a date, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 1 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 1<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Eras, Dates &amp; the Historian's Toolkit<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.thestoryoftexas.com/learn/texas-history-timeline/\" target=\"_blank\" rel=\"noopener\">Bullock Museum Texas History Timeline<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a> · Population: U.S. Census Bureau decennial census counts.<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson1-v1\", \"n\": 1, \"label\": \"Lesson 1\", \"title\": \"Eras, Dates & the Historian's Toolkit\", \"practice\": [{\"type\": \"order\", \"title\": \"Put the eras in \n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 2 of 17<\/p>\n  <h1>Natural Texas and Its People<\/h1>\n  <p class=\"q\">Big question: <b>How did the land shape the way American Indian groups lived?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.2A, 7.8A, 7.8B, 7.8C, 7.9A<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n<h2>One state, four very different lands<\/h2>\n  <div class=\"prose\">\n    <p>In Lesson 1 you met the first era of Texas history: <b>Natural Texas and Its People<\/b>, the thousands of years before Europeans arrived. To understand the people of that era, start with the land itself.<\/p>\n    <p>Texas is huge, and its land changes a lot from one side to the other. Geographers split it into four <b>physical regions<\/b>. A region is an area where the land, climate, and plants are alike. The biggest difference between the regions is <b>rain<\/b>. East Texas gets a lot of it. Far West Texas gets very little.<\/p>\n    <p>Rain decides what grows. What grows decides what animals live there. And plants and animals decided how people could feed, house, and clothe themselves.<\/p>\n  <\/div>\n\n  <h3>From west to east: how much rain falls in a year<\/h3>\n  <div class=\"strip\" id=\"strip\" aria-label=\"Average yearly rain from west to east: El Paso 8.8 inches, Lubbock 18.3, Abilene 25.2, Beaumont 65.1.\"><div class=\"band\"><div class=\"seg0\"><b>Mountains and Basins<\/b><span class=\"yr\">8.8 in.<\/span><span class=\"small\">El Paso<\/span><\/div><div class=\"seg1\"><b>Great Plains<\/b><span class=\"yr\">18.3 in.<\/span><span class=\"small\">Lubbock<\/span><\/div><div class=\"seg2\"><b>North Central Plains<\/b><span class=\"yr\">25.2 in.<\/span><span class=\"small\">Abilene<\/span><\/div><div class=\"seg3\"><b>Coastal Plains<\/b><span class=\"yr\">65.1 in.<\/span><span class=\"small\">Beaumont<\/span><\/div><\/div><div class=\"axis\"><span>West · drier<\/span><span>East · wetter<\/span><\/div><\/div>\n\n  <h3>The four physical regions<\/h3>\n  <div class=\"regions\" id=\"regionCards\"><div class=\"card\"><div class=\"ctop\"><b>Mountains and Basins<\/b><span class=\"tag\">Far West Texas<\/span><\/div><p>Mountains, deserts, and dry basins around El Paso and Big Bend. The driest region. Guadalupe Peak, the highest point in Texas (8,751 ft), is here.<\/p><p class=\"yr stat\">Under 20 in. of rain<\/p><\/div><div class=\"card\"><div class=\"ctop\"><b>Great Plains<\/b><span class=\"tag\">Panhandle and Hill Country<\/span><\/div><p>Flat, high grassland with few trees. Huge herds of bison once grazed here. Amarillo and Lubbock are here today.<\/p><p class=\"yr stat\">About 15–25 in.<\/p><\/div><div class=\"card\"><div class=\"ctop\"><b>North Central Plains<\/b><span class=\"tag\">Middle of North Texas<\/span><\/div><p>Rolling prairies, low hills, and strips of oak woods. Wetter than the Great Plains. Fort Worth, Abilene, and Wichita Falls are here today.<\/p><p class=\"yr stat\">About 25–35 in.<\/p><\/div><div class=\"card\"><div class=\"ctop\"><b>Coastal Plains<\/b><span class=\"tag\">East and South Texas<\/span><\/div><p>Flat, low land along the Gulf of Mexico. Thick pine forests and rich soil in the east (the Piney Woods), bays and marshes on the coast, dry brush country in the south.<\/p><p class=\"yr stat\">Up to 60+ in. in the east<\/p><\/div><\/div>\n\n  <h3>Four ways of life<\/h3>\n  <div class=\"prose\"><p>Historians group the American Indian peoples of early Texas into four <b>culture groups<\/b>. People in the same culture group got food, built homes, and moved (or stayed put) in similar ways, because they lived on similar land.<\/p><\/div>\n  <div class=\"regions\" id=\"cultureCards\"><div class=\"card\"><div class=\"ctop\"><b>Gulf culture<\/b><span class=\"tag\">Karankawa, Coahuiltecan<\/span><\/div><dl><dt>Land<\/dt><dd>Coastal Plains: Gulf coast and South Texas brush<\/dd><dt>Food<\/dt><dd>Fish, shellfish, deer, prickly pear, mesquite beans<\/dd><dt>Homes<\/dt><dd>Small huts of bent poles covered with hides or woven mats<\/dd><dt>Life<\/dt><dd>Moved with the seasons to find food. The Karankawa paddled dugout canoes.<\/dd><\/dl><\/div><div class=\"card\"><div class=\"ctop\"><b>Plains culture<\/b><span class=\"tag\">Comanche, Apache, Tonkawa, Kiowa<\/span><\/div><dl><dt>Land<\/dt><dd>Great Plains<\/dd><dt>Food<\/dt><dd>Bison, hunted on foot and later on horseback<\/dd><dt>Homes<\/dt><dd>Tipis made of bison hides, easy to pack and move<\/dd><dt>Life<\/dt><dd>Followed the herds. Bison also gave them clothing, tools, and tipi covers.<\/dd><\/dl><\/div><div class=\"card\"><div class=\"ctop\"><b>Puebloan culture<\/b><span class=\"tag\">Jumano, Tigua<\/span><\/div><dl><dt>Land<\/dt><dd>Mountains and Basins, along the Rio Grande<\/dd><dt>Food<\/dt><dd>Corn, beans, and squash grown with river water<\/dd><dt>Homes<\/dt><dd>Adobe houses made of sun-dried mud bricks<\/dd><dt>Life<\/dt><dd>Stayed in farming villages. Some Jumano also traveled far to trade.<\/dd><\/dl><\/div><div class=\"card\"><div class=\"ctop\"><b>Southeastern culture<\/b><span class=\"tag\">Caddo, Wichita<\/span><\/div><dl><dt>Land<\/dt><dd>Coastal Plains (Piney Woods) and the Red River valley<\/dd><dt>Food<\/dt><dd>Corn, beans, squash, and sunflowers they farmed<\/dd><dt>Homes<\/dt><dd>Tall dome houses of wooden poles covered with grass<\/dd><dt>Life<\/dt><dd>Lived in permanent villages. The Caddo built large earthen mounds. The word <i>Texas<\/i> comes from a Caddo word meaning <i>friend<\/i>.<\/dd><\/dl><\/div><\/div>\n\n  <h3>The geographer's toolkit: adapt or modify?<\/h3>\n  <div class=\"ps\">\n    <div><b>Adapt<\/b><p>Change the way <i>you<\/i> live to fit the land. Following the bison herds is adapting.<\/p><p class=\"small\">Example: Plains peoples made tipis they could pack up and carry.<\/p><\/div>\n    <div><b>Modify<\/b><p>Change the <i>land<\/i> to fit what you need. Clearing trees to plant a field is modifying.<\/p><p class=\"small\">Example: Caddo farmers cleared forest to grow corn.<\/p><\/div>\n  <\/div>\n  <div class=\"prose\"><p>A quick test: <b>Who changed, the people or the land?<\/b> If the people changed their habits, they adapted. If they changed the land, they modified it. Every group did some of both.<\/p><\/div>\n\n  <div class=\"callout\"><b>How do we know?<\/b> Most of these groups did not leave written records. Archaeologists learn about them from <b>artifacts<\/b> such as tools, pottery, and the remains of houses. Spanish and French explorers also wrote about them, but those writers were outsiders. Remember Lesson 1: a primary source shows the creator's point of view.<\/div>\n  <div class=\"callout\"><b>These stories did not end.<\/b> Many of these nations are still here. The Caddo Nation, Comanche Nation, and Wichita and Affiliated Tribes are based in Oklahoma today. In Texas, the Tigua people of Ysleta del Sur Pueblo live near El Paso, along with two other tribes, the Alabama-Coushatta and the Kickapoo.<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>How did the land shape the way American Indian groups lived?<\/b> Make a claim, give one piece of evidence from today's lesson (a region, a group, a food, or a kind of home), and explain how your evidence supports your claim.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"The land shaped the way American Indian groups lived because...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a region, a group, a food, or a home).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 2 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 2<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Natural Texas and Its People<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.texasbeyondhistory.net/\" target=\"_blank\" rel=\"noopener\">Texas Beyond History<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a> · Rainfall: NOAA National Centers for Environmental Information, 1991–2020 normals.<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson2-v1\", \"n\": 2, \"label\": \"Lesson 2\", \"title\": \"Natural Texas and Its People\", \"practice\": [{\"type\": \"match\", \"title\": \"Name the region\", \"intro\": \"Read each clue and pick the region it describes.\", \"placeholder\": \"Choose a region…\", \"button\": \"Check my regions\", \"word\": \"correct\", \"options\": [\"Mountains and Basins\", \"Great Plains\", \"North Central Plains\", \"Coastal Plains\"], \"items\": [[\"Guadalupe Peak, the highest point in Texas\", 0], [\"Flat Panhandle grassland where bison herds once grazed\", 1], [\"Thick pine forests and the most rain in the state\", 3], [\"Rolling prairies and low hills around Fort Worth and Abilene\", 2], [\"The driest region, with deserts and dry basins\", 0], [\"Bays, marshes, and islands along the Gulf of Mexico\", 3], [\"High, flat land around Amarillo and Lubbock with few trees\", 1], [\"Wetter than the Great Plains, drier than the Piney Woods, with st lid var(--rule);border-radius:12px;padding:18px;display:grid;gap:12px}\n.cert.complete{border-color:var(--good);box-shadow:0 0 0 4px var(--good-soft)}\n.cert-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}\n.stamp{font-family:var(--mono);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--muted);color:var(--muted)}\n.cert.complete .stamp{border-color:var(--good);color:var(--good);background:var(--good-soft)}\n.certdate{font-size:.85rem;color:var(--muted)}\n.shot{background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:16px 18px;display:grid;gap:8px}\n.shot ul,.shot ol{margin:0;padding-left:1.2em;display:grid;gap:4px}\n@media (max-width:520px){body{font-size:16px}.task{padding:14px}.match label{grid-template-columns:3.4rem 1fr}.order li{padding:6px 8px}.btn{width:100%}}\n@media (prefers-reduced-motion:no-preference){.order li,.src,.opt{transition:background .2s,border-color .2s}html{scroll-behavior:smooth}}\n\n\n/* Lesson 2 additions */\n.strip{display:grid;gap:6px}\n.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}\n.band>div{padding:10px;border-radius:6px;display:grid;gap:2px;align-content:start;min-width:0;overflow-wrap:anywhere}\n.band b{font-size:.85rem;line-height:1.2}\n.band .yr{font-size:1.1rem;color:var(--ink)}\n.seg0{background:var(--gold-soft)}\n.seg1{background:color-mix(in srgb,var(--gold-soft) 66%,var(--blue-soft))}\n.seg2{background:color-mix(in srgb,var(--gold-soft) 33%,var(--blue-soft))}\n.seg3{background:var(--blue-soft)}\n.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--muted)}\n.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}\n.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}\n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 3 of 17<\/p>\n  <h1>Age of Contact<\/h1>\n  <p class=\"q\">Big question: <b>What did Europeans want from Texas, and what did they find?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.2B, 7.20D<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n<h2>Strangers on the shore<\/h2>\n  <div class=\"prose\">\n    <p>In Lesson 2 you met the peoples who had lived in Texas for thousands of years. In <span class=\"yr\">1519<\/span>, something new appeared off the coast: European ships. Historians call the next period the <b>Age of Contact<\/b>, the time when American Indians and Europeans first met.<\/p>\n    <p>Why did Europeans come at all? Teachers often sum it up as <b>gold, God, and glory<\/b>.<\/p>\n  <\/div>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Gold<\/b><span class=\"tag\">Wealth<\/span><\/div><p>Spain had found silver and gold in Mexico. Explorers hoped Texas held more. They also hunted for a water route to Asia and its spices.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>God<\/b><span class=\"tag\">Religion<\/span><\/div><p>Spain and France were Catholic countries. Priests traveled with explorers to spread their faith to the people they met.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Glory<\/b><span class=\"tag\">Power and fame<\/span><\/div><p>Kings wanted land before rival countries grabbed it. Explorers wanted fame, titles, and rewards for their service.<\/p><\/div>\n  <\/div>\n\n  <h3>Who came, and what they found<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1519<\/span><div><b>Alonso Álvarez de Pineda<\/b><span>A Spanish captain who sailed the whole Gulf coast looking for a water route to Asia. He found no route, but he drew the first map of the Texas coast.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1528<\/span><div><b>Cabeza de Vaca and Estevanico<\/b><span>Part of a Spanish expedition that fell apart. Their rafts washed ashore near Galveston Island. Only a few men survived. They lived among the Karankawa and other peoples for years as captives, traders, and healers.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1536<\/span><div><b>Four survivors reach Mexico<\/b><span>Cabeza de Vaca, Estevanico, and two other Spaniards walked across Texas and northern Mexico until they found Spanish soldiers. They told stories of rich cities farther north.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1541<\/span><div><b>Francisco Vázquez de Coronado<\/b><span>Led a large army searching for the Seven Cities of Gold. He crossed the Texas Panhandle and found grasslands, huge bison herds, and villages of farmers. He found no gold.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1685<\/span><div><b>René-Robert Cavelier, Sieur de La Salle<\/b><span>A French explorer who planned a colony at the mouth of the Mississippi River. He missed it and landed at Matagorda Bay, where he built Fort Saint Louis. Hunger, disease, and conflict ruined the colony. His own men killed him in 1687.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1689<\/span><div><b>Alonso de León<\/b><span>A Spanish governor sent to find the French. He found the fort in ruins. Spain now feared France would take Texas, which set up Lesson 4.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>What did they find?<\/b> No gold and no shortcut to Asia. They found nations of people with their own leaders and trade, open grasslands full of bison, and a coast that wrecked ships. After Coronado, Spain mostly ignored Texas for about 140 years. It took a French colony to bring Spain back.<\/div>\n\n  <div class=\"ps\">\n    <div><b>Estevanico<\/b><p>He was an enslaved man from Azemmour, Morocco. He is the first African known to have crossed Texas. He was skilled at learning languages and became the group's go-between. He left no writing of his own, so we only know him through what others wrote.<\/p><\/div>\n    <div><b>La Belle<\/b><p>La Salle's ship <i>La Belle<\/i> sank in Matagorda Bay in 1686. In 1995 Texas Historical Commission archaeologists found it, pumped the water out from around it, and dug it up. Its hull is now on display at the Bullock Museum in Austin.<\/p><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>Contact had a cost.<\/b> Europeans carried diseases such as smallpox and measles that American Indians had never faced. Their bodies had no defense against them. Over the next two centuries, these diseases killed a huge share of the Native people of Texas, often before many of them had ever met a European.<\/div>\n\n  <h3>Reading a primary source: whose eyes?<\/h3>\n  <div class=\"prose\">\n    <p>Cabeza de Vaca wrote about his journey in a report published in <span class=\"yr\">1542<\/span>. It is one of the oldest written descriptions of Texas and its people. It is also a source with a strong <b>point of view<\/b>.<\/p>\n    <p>Ask three questions about any source: <b>Who wrote it? Who was it for? Why?<\/b> Cabeza de Vaca wrote for the king of Spain. He had lost the expedition and wanted to prove he had still served God and the king well. He hoped for a reward, and he got one: a job as a governor in South America.<\/p>\n    <p>That does not make him a liar. It means some of what he wrote is something he <b>saw<\/b>, and some is how he <b>interpreted<\/b> what he saw. Your job in Practice B is to tell the difference.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Weigh the source<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, pick <b>one thing Cabeza de Vaca might have exaggerated or left out<\/b>, and explain why. Make a claim, give one piece of evidence (a line from the excerpt, or a fact about his audience or purpose), and explain how your evidence supports your claim.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"Cabeza de Vaca might have exaggerated... because...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I named <b>one thing<\/b> he might have exaggerated or left out.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a line from the excerpt, or his audience or purpose).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>why<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 3 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 3<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Age of Contact<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Álvarez de Pineda, Alonso,” “Cabeza de Vaca, Álvar Núñez,” “Estevanico,” “Coronado Expedition,” “La Salle Expedition” · <a href=\"https://www.thestoryoftexas.com/learn/la-belle-resources/\" target=\"_blank\" rel=\"noopener\">Bullock Museum La Belle resources<\/a>. The excerpt is a plain-language retelling, not a word-for-word translation.<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson3-v1\", \"n\": 3, \"label\": \"Lesson 3\", \"title\": \"Age of Contact\", \"practice\": [{\"type\": \"match\", \"title\": \"Who's who?\", \"intro\": \"Read each clue and pick the person it describes.\", \"placeholder\": \"Choose a person…\", \"button\": \"Check my matches\", \"word\": \"correct\", \"options\": [\"Álvarez de Pineda\", \"Cabeza de Vaca\", \"Estevanico\", \"Coronado\", \"La Salle\", \"Alonso de León\"], \"items\": [[\"Sailed the Gulf coast in 1519 and drew the first map of the Texas coast\", 0], [\"Spanish officer who survived a shipwreck, lived among Native peoples for years, and wrote a report about it\", 1], [\"Enslaved man from Morocco who survived the same shipwreck and became the group's go-between\", 2], [\"Led a large army across the Panhandle searching for cities of gold\", 3], [\"French explorer who meant to settle near the Mississippi River but landed at Matagorda Bay\", 4], [\"Spanish governor sent to find the French fort, who found it in ruins\", 5]]}, {\"type\": \"sort\", \"title\": \"Saw it, or how he saw it?\", \"intro\": \"Read the excerpt. For each line, decide: is it something he could <b>observe<\\/b> with his own eyes, or is it shaped by his <b>point of view<\\/b>?\", \"before\": \"<div class=\\\"excerpt\\\">\\n      <p class=\\\"who\\\">Adapted from Cabeza de Vaca's account (1542), retold in modern English<\\/p>\\n      <p class=\\\"line\\\">The people of this island hunt with bows and arrows. For part of the year they live on fish and on roots they pull from under the water.<\\/p>\\n      <p class=\\\"line\\\">Of all the people in the world, they love their children the most and treat them the best.<\\/p>\\n      <p class=\\\"line\\\">During the winter there was little food. Many of our men died of cold and hunger.<\\/p>\\n      <p class=\\\"line\\\">The islanders told us to heal their sick. We prayed and made the sign of the cross over them, and the sick said they were well. We gave thanks to God.<\\/p>\\n      <p class=\\\"line\\\">For years I traveled as a trader. I carried shells and sea beads inland and brought back animal skins and red ochre.<\\/p>\\n      <p class=\\\"line\\\">They believed we had come from heaven.<\\/p>\\n    <\\/div>\", \"button\": \"Check my sorting\", \"word\": \"sorted correctly\", \"choices\": [[\"O\", \"Observed\"], [\"P\", \"Point of view\"]], \"items\": [[\"They hunt with bows and arrows and eat fish and roots.\", \"O\", \"He could watch them hunt and gather food.\"], [\"Of all the people in the world, they love their children the most.\", \"P\", \"He had not met all the people in the world. This is his opinion, stated as a big claim.\"], [\"During the winter many of our men died of cold and hunger.\", \"O\", \"He lived through it and saw it happen.\"], [\"We prayed over the sick, and they said they were well. We gave thanks to God.\", \"P\", \"He credits his faith for the healing. His readers back in Spain would want to hear that God was on his side.\"], [\"I carried shells and sea beads inland and brought back skins and red ochre.\", \"O\", \"These are things he did and carried himself.\"], [\"They believed we had come from heaven.\", \"P\", \"He could not see inside their minds. He is guessing what they believed, in a way that makes him look important.\"]]}, {\"type\": \"order\", \"title\": \"Put it in order\", \"intro\": \"Use the arrows to put these events in order, earliest at the top. Years appear once an event is in the right spot.\", \"button\": \"Check my order\", \"word\": \"in the right spot\", \"seed\": 11, \"items\": [[\"Álvarez de Pineda maps the Texas coast\", \"1519\"], [\"Cabeza de Vaca's raft washes ashore near Galveston Island\", \"1528\"], [\"Four survivors reach Spanish soldiers in Mexico\", \"1536\"], [\"Coronado's army crosses the Panhandle\", \"1541\"], [\"La Salle builds Fort Saint Louis on Matagorda Bay\", \"1685\"], [\"<i>La Belle<\\/i> sinks in a storm\", \"1686\"], [\"Alonso de León finds the French fort in ruins\", \"1689\"]]}, {\"type\": \"mc\", \"title\": \"Cause and effect\", \"intro\": \"Every event causes something else. Pick the best answer.\", \"button\": \"Check my answers\", \"word\": \"correct\", \"items\" aimDone=wc()>=20&&[\"ck1\",\"ck2\",\"ck3\"].every(k=>S[k]);\n  $(\"nav-read\").classList.toggle(\"done\",anyP);\n  $(\"nav-practice\").classList.toggle(\"done\",doneP);\n  $(\"nav-check\").classList.toggle(\"done\",S.qzScore!=null);\n  $(\"nav-reflect\").classList.toggle(\"done\",claimDone);\n  const all=doneP&&S.qzScore!=null&&claimDone;\n  $(\"nav-results\").classList.toggle(\"done\",all);\n  const pTot=T.reduce((a,t)=>a+total(t),0);\n  const pGot=T.reduce((a,t,ti)=>a+(S.ps[ti]||0),0);\n  const cell=(v,l)=>`<div><b>${v}<\/b><span>${l}<\/span><\/div>`;\n  const letters=\"A–\"+String.fromCharCode(64+T.length);\n  $(\"score\").innerHTML=cell(doneP?`${pGot}/${pTot}`:\"—\",`Practice (${letters})`)+cell(S.qzScore!=null?`${S.qzScore}/${QUIZ.length}`:\"—\",\"Quiz\")+cell(S.qzScore!=null?Math.round(S.qzScore/QUIZ.length*100)+\"%\":\"—\",\"Quiz percent\")+cell(claimDone?\"Done\":\"—\",\"Exit claim\");\n  let st;\n  const need=Math.ceil(QUIZ.length*0.8);\n  if(all) st=S.qzScore>=need?`Lesson complete. Mastery reached (${need}/${QUIZ.length} or better on the quiz).`:`Lesson complete. ${C.review}, then talk through the missed quiz questions with a parent.`;\n  else{const todo=[];if(!doneP)todo.push(`check all ${T.length===4?\"four\":T.length} practice activities`);if(S.qzScore==null)todo.push(\"submit the quiz\");if(!claimDone)todo.push(\"write the exit claim (20+ words) and tick all three boxes\");st=\"Still to do: \"+todo.join(\", \")+\".\"}\n  $(\"status\").textContent=st;\n  if(all&&!S.doneAt){S.doneAt=new Date().toLocaleString([], {dateStyle:\"medium\",timeStyle:\"short\"});save()}\n  if(!all&&S.doneAt){S.doneAt=undefined;save()}\n  $(\"cert\").classList.toggle(\"complete\",all);\n  $(\"stamp\").textContent=all?\"Lesson complete\":\"In progress\";\n  $(\"certDate\").textContent=all?\"Completed \"+S.doneAt:\"\";\n  $(\"shot\").hidden=!all;\n}\n$(\"copy\").onclick=()=>{const t=report();const box=$(\"reportText\");box.value=t;\n  const fallback=()=>{box.hidden=false;box.focu li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 4 of 17<\/p>\n  <h1>Spanish Colonial Texas<\/h1>\n  <p class=\"q\">Big question: <b>How did Spain try to hold Texas, and what lasted?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.2C, 7.6B, 7.18C<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n<h2>Holding a huge land with very few people<\/h2>\n  <div class=\"prose\">\n    <p>At the end of Lesson 3, Spain found La Salle's fort in ruins. The French were gone, but the scare worked. Spain decided it had to <b>hold Texas<\/b> before France or anyone else did.<\/p>\n    <p>There was a problem. Very few Spaniards wanted to move to a far-off frontier with no gold. So Spain tried a different plan. It built four kinds of places, and it hoped to turn the American Indians who already lived there into Catholic, Spanish-speaking subjects who would help hold the land.<\/p>\n  <\/div>\n\n  <h3>The four building blocks of Spanish Texas<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Mission<\/b><span class=\"tag\">misión<\/span><\/div><dl><dt>Goal<\/dt><dd>Convert American Indians to Catholicism and teach them Spanish ways, farming, and trades<\/dd><dt>Who<\/dt><dd>Franciscan friars and the Native families who lived there<\/dd><dt>Ex.<\/dt><dd>Mission San Antonio de Valero, later called the Alamo<\/dd><\/dl><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Presidio<\/b><span class=\"tag\">fort<\/span><\/div><dl><dt>Goal<\/dt><dd>Protect the missions and the border with soldiers<\/dd><dt>Who<\/dt><dd>Soldiers and their families<\/dd><dt>Ex.<\/dt><dd>Presidio La Bahía at Goliad<\/dd><\/dl><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Town<\/b><span class=\"tag\">villa · pueblo<\/span><\/div><dl><dt>Goal<\/dt><dd>Bring in settler families who would farm, trade, and stay<\/dd><dt>Who<\/dt><dd>Settlers, with a town council to run local affairs<\/dd><dt>Ex.<\/dt><dd>San Fernando de Béxar, founded by Canary Islanders<\/dd><\/dl><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Ranch<\/b><span class=\"tag\">rancho<\/span><\/div><dl><dt>Goal<\/dt><dd>Raise cattle and horses on open land to feed missions and towns<\/dd><dt>Who<\/dt><dd>Ranch owners and vaqueros, the first cowboys of Texas<\/dd><dt>Ex.<\/dt><dd>Mission and private ranches along the San Antonio River<\/dd><\/dl><\/div>\n  <\/div>\n\n  <h3>How the plan played out<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1682<\/span><div><b>Ysleta, near El Paso<\/b><span>The first mission in what is now Texas, built for Tigua people who fled south after a revolt in New Mexico. Their descendants still live there.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1690<\/span><div><b>San Francisco de los Tejas<\/b><span>Father Damián Massanet and Alonso de León built a mission among the Caddo in East Texas. Disease and conflict drove the friars out by 1693.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1716<\/span><div><b>Back to East Texas<\/b><span>France was close again, in Louisiana. Spain returned with several missions and a presidio. Father Antonio Margil de Jesús founded some of them.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1718<\/span><div><b>San Antonio is founded<\/b><span>A mission and a presidio went up beside the San Antonio River, halfway between Mexico and East Texas. It became the heart of Spanish Texas.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1731<\/span><div><b>Canary Islanders arrive<\/b><span>About 16 families from the Canary Islands founded San Fernando de Béxar, the first town in Texas with its own town government.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1772<\/span><div><b>East Texas abandoned<\/b><span>Spain now owned Louisiana, so the French threat was gone. Spain pulled settlers out of East Texas and made San Antonio the capital.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"dates\">\n    <div class=\"date\"><span class=\"yr\">1718<\/span><b>Founding of San Antonio<\/b><p>This is one of your eight required dates. Add it to your timeline from Lesson 1.<\/p><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>A mission looked different depending on who you were.<\/b> The friars believed they were saving souls. For some Native families, such as the Coahuiltecans, a mission offered food in hard times and protection from Apache and Comanche raids. It also meant hard work, strict rules, giving up old beliefs, and deadly disease spreading through crowded rooms. Many people left, and some came back. Both views belong in the story.<\/div>\n\n  <div class=\"callout\"><b>Why the plan struggled.<\/b> Spanish Texas never had many settlers. By 1800 only a few thousand lived there. The Comanche and Apache were strong, and the Comanche controlled much of the plains. Supplies came from far away in Mexico. Spain held San Antonio, Goliad, and Nacogdoches, but most of Texas stayed out of its reach.<\/div>\n\n  <h3>What lasted<\/h3>\n  <div class=\"prose\"><p>Spain ruled Texas for over a hundred years. Look around Texas today and you can still see its mark.<\/p><\/div>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Words<\/b><span class=\"tag\">language<\/span><\/div><p>Rodeo, corral, lasso, ranch, mustang, and bronco all come from Spanish.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Place names<\/b><span class=\"tag\">maps<\/span><\/div><p>San Antonio, El Paso, Amarillo (yellow), the Brazos, the Nueces, and the Rio Grande.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Ranching<\/b><span class=\"tag\">work<\/span><\/div><p>Vaqueros taught later cowboys how to rope and herd from horseback. Longhorn cattle descend from Spanish cattle.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Buildings<\/b><span class=\"tag\">architecture<\/span><\/div><p>The San Antonio missions are a World Heritage Site, the only one in Texas, named in 2015.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>How did Spain try to hold Texas, and what lasted?<\/b> Make a claim, give one piece of evidence from today's lesson (a place, a date, a person, or a legacy), and explain how your evidence supports your claim.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"Spain tried to hold Texas by...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or a legacy).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 4 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 4<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Spanish Colonial Texas<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Spanish Missions,” “San Antonio, TX,” “Massanet, Damián,” “Margil de Jesús, Antonio,” “Canary Islanders” · <a href=\"https://www.nps.gov/saan/\" target=\"_blank\" rel=\"noopener\">San Antonio Missions National Historical Park<\/a>.<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson4-v1\", \"n\": 4, \"label\": \"Lesson 4\", \"title\": \"Spanish Colonial Texas\", \"practice\": [{\"type\": \"match\", \"title\": \"Station rotation\", \"intro\": \"Read each clue and pick the place it describes: mission, presidio, town, or ranch.\", \"placeholder\": \"Choose a place…\", \"button\": \"Check my stations\", \"word\": \"correct\", \"options\": [\"Mission\", \"Presidio\", \"Town\", \"Ranch\"], \"items\": [[\"Franciscan friars taught prayers, farming, and Spanish\", 0], [\"Soldiers guarded the frontier\", 1], [\"Vaqueros rounded up cattle on horseback\", 3], [\"A town council made local rules for settler families\", 2], [\"Native families lived and worked beside a stone church\", 0], [\"Built to protect nearby missions from raids\", 1], [\"Canary Islanders founded one beside the San Antonio River in 1731\", 2], [\"Raised cattle and horses to feed missions and towns\", 3]]}, {\"type\": \"order\", \"title\": \"Put it in order\", \"intro\": \"Use the arrows to put these events in order, earliest at the top. Years appear once an event is in the right spot.\", \"button\": \"Check my order\", \"word\": \"in the right spot\", \"seed\": 2, \"items\": [[\"The first mission in Texas is built at Ysleta, near El Paso\", \"1682\"], [\"Massanet and de León found a mission among the Caddo\", \"1690\"], [\"Spain returns to East Texas with several missions\", \"1716\"], [\"A mission and presidio are founded at San Antonio\", \"1718\"], [\"Canary Islander families found San Fernando de Béxar\", \"1731\"], [\"Spain abandons East Texas and makes San Antonio the capital\", \"1772\"]]}, {\"type\": \"sort\", \"title\": \"Spanish legacy?\", \"intro\": \"Which of these came to Texas from Spain? Pick <b>From Spain<\\/b> or <b>Not from Spain<\\/b>.\", \"button\": \"Check my sorting\", \"word\": \"sorted correctly\", \"choices\": [[\"S\", \"From Spain\"], [\"N\", \"Not from Spain\"]], \"items\": [[\"The word <i>rodeo<\\/i>\", \"S\", \"It comes from the Spanish word for a cattle roundup.\"], [\"Longhorn cattle\", \"S\", \"They descend from cattle the Spanish brought to the Americas.\"], [\"The city name Amarillo\", \"S\", \"It is the Spanish word for yellow.\"], [\"Tipis made of bison hides\", \"N\", \"Plains peoples built these long before Europeans arrived (Lesson 2).\"], [\"The stone church of the Alamo\", \"S\", \"It was built as the church of Mission San Antonio de Valero.\"], [\"Cotton plantations worked by enslaved people\", \"N\", \"These came with settlers from the United States, starting in the 1820s (Lesson 5).\"], [\"Roping cattle from horseback\", \"S\", \"Vaqueros developed these skills, and later cowboys learned them.\"], [\"Log cabins\", \"N\", \"Settlers from the eastern United States brought log cabins with them.\"]]}, {\"type\": \"mc\", \"title\": \"Two points of view\", \"intro\": \"Historians look at a mission from more than one side. Pick the best answer.\", \"button\": \"Check my answers\", \"word\": \"correct\", \"items\": [{\"q\": \"A Franciscan friar would most likely describe a mission as…\", \"o\": [\"A trading post for furs\", \"A place to save souls and teach a Christian way of life\", \"A fort for soldiers\"], \"a\": 1, \"e\": \"The friars saw their work as a religious duty.\", \"fixed\": true}, {\"q\": \"What is one reason some Coahuiltecan families moved to missions?\", \"o\": [\"They wanted to become soldiers\", \"Food in hard times and protection from Apache raids\", \"Spain paid them in gold\"], \"a\": 1, \"e\": \"Drought and raids made the mission's food and walls valuable, even with its costs.\", \"fixed\": true}, {\"q\": \"Most written records of mission life come from Spanish friars and officials. What does that mean for historians?\", \"o\": [\"They have the complete story\", \"They must look for what those writers left out, like Native vie <script type="application/json" id="doc-lesson-5">"<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Mexican Texas Lesson 5<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>\n/* Layout: same field-notebook column as Lesson 1; a west-to-east rain strip and region cards replace the timeline ruler; sticky step strip on top. */\n:root{\n  --paper:#f5f7f9; --card:#ffffff; --ink:#1b2433; --muted:#566275; --rule:#d4dbe4;\n  --blue:#2f5fb3; --blue-soft:#e3ebf8; --gold:#b9831b; --gold-soft:#f8eed9;\n  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b33a2f; --bad-soft:#f9e3e0;\n  --display:\"Zilla Slab\", Rockwell, \"Roboto Slab\", Georgia, serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n  --mono:\"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;\n  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;\n  --good:#6fd29f; --good-soft:#173527; --bad:#f08a7f; --bad-soft:#3d1f1c; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf
