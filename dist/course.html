n-width:0}\n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 14 of 17<\/p>\n  <h1>Civil Rights &amp; Political Change<\/h1>\n  <p class=\"q\">Big question: <b>How did different groups in Texas fight for equal rights?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.7C, 7.7D, 7.16A, 7.17B, 7.22D<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>Unfinished business<\/h2>\n  <div class=\"prose\">\n    <p>In Lesson 10, freed Texans won rights during Reconstruction, then lost many of them. By 1900, Texas laws kept Black and white Texans apart in schools, trains, and parks, a system called <b>segregation<\/b>. Black Texans were blocked from voting in Democratic primaries, which in one-party Texas decided most elections. Mexican Americans faced segregated \"Mexican schools,\" juries that left them out, and signs that said they were not welcome.<\/p>\n    <p>Different groups fought back in different ways: in courtrooms, at the ballot box, and in the streets. As you read, compare their <b>goals<\/b> and their <b>strategies<\/b>.<\/p>\n  <\/div>\n\n  <h3>Leaders and organizations<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>LULAC<\/b><span class=\"tag\">founded 1929<\/span><\/div><p>The League of United Latin American Citizens began in Corpus Christi. It worked through courts and education, backing lawsuits against school segregation such as <i>Delgado v. Bastrop ISD<\/i> (1948), and <i>Hernandez v. Texas<\/i> (1954), where the U.S. Supreme Court ruled that Mexican Americans could not be kept off juries.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Hector P. García<\/b><span class=\"tag\">American GI Forum<\/span><\/div><p>A doctor and World War II veteran in Corpus Christi. In 1948 he founded the American GI Forum to fight for Mexican American veterans. In 1949 a funeral home in Three Rivers refused a chapel to the family of Felix Longoria, a soldier killed in the war. García's protest led to Longoria's burial at Arlington National Cemetery.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Lulu B. White<\/b><span class=\"tag\">NAACP, Houston<\/span><\/div><p>Led the Houston branch of the NAACP in the 1940s and built it into one of the largest in the South. She supported the cases that ended the white primary (<i>Smith v. Allwright<\/i>, 1944) and opened the University of Texas law school to Heman Sweatt (<i>Sweatt v. Painter<\/i>, 1950).<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>James Farmer<\/b><span class=\"tag\">CORE<\/span><\/div><p>Born in Marshall and a star debater at Wiley College. He co-founded the Congress of Racial Equality (CORE), which used nonviolent protest, and he organized the 1961 Freedom Rides to challenge segregated buses in the South.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Barbara Jordan<\/b><span class=\"tag\">lawmaker<\/span><\/div><p>In 1966 she became the first African American elected to the Texas Senate since 1883. In 1972 she became the first Black woman from the South elected to the U.S. House, where her speech on the Constitution during the Watergate hearings made her nationally known.<\/p><\/div>\n  <\/div>\n\n  <h3>Comparing strategies<\/h3>\n  <div class=\"cmpbox\"><table class=\"cmp\">\n    <thead><tr><th><\/th><th>Courts<\/th><th>Ballot box<\/th><th>Direct action<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><th>How<\/th><td>Sue to overturn unfair laws<\/td><td>Register voters, run for office<\/td><td>Marches, sit-ins, Freedom Rides<\/td><\/tr>\n      <tr><th>Example<\/th><td><i>Hernandez v. Texas<\/i>; <i>Sweatt v. Painter<\/i><\/td><td>Barbara Jordan's elections; later, La Raza Unida Party (1970)<\/td><td>CORE's Freedom Rides<\/td><\/tr>\n      <tr><th>Strength<\/th><td>A win changes the law for everyone<\/td><td>Puts people with a voice in government<\/td><td>Draws national attention fast<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n\n  <h3>Political change: Texas turns Republican<\/h3>\n  <div class=\"prose\"><p>For about 100 years after Reconstruction, almost every Texas officeholder was a Democrat. Starting in the 1960s, a conservative movement built the Republican Party in Texas.<\/p><\/div>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1961<\/span><div><b>John Tower<\/b><span>Won a U.S. Senate seat, the first Republican elected to statewide office in Texas since Reconstruction.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1978<\/span><div><b>Bill Clements<\/b><span>Elected the first Republican governor since Reconstruction.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1980s–90s<\/span><div><b>Realignment<\/b><span>Many conservative Democrats switched parties. Texans voted for Republicans for president and more state offices.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">2002<\/span><div><b>Full control<\/b><span>Republicans won majorities in both houses of the Texas Legislature for the first time since Reconstruction.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>Structured academic discussion.<\/b> In a discussion, you listen, build on what others say, and use evidence. Useful sentence starters: \"I agree with ___ because ___.\" \"I want to add to what ___ said.\" \"I see it differently, because the evidence shows ___.\" Talk through today's question with a parent or sibling before you write your claim.<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Compare two movements<\/h2>\n  <div class=\"prose\"><p>Venn diagram in words. In 3 to 5 sentences, compare <b>two<\/b> of today's movements or leaders. Name <b>one way they were alike<\/b> and <b>one way they were different<\/b>, with evidence, and say which strategy you think worked best and why.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"LULAC and the NAACP were alike because... They were different because...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I named <b>one similarity<\/b> and <b>one difference<\/b>.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a person, a case, a date, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I said which strategy worked best and explained <b>why<\/b>.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 14 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 14<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Civil Rights &amp; Political Change<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Garcia, Hector Perez,” “League of United Latin American Citizens,” “White, Lulu Belle Madison,” “Jordan, Barbara Charline,” “Farmer, James Leonard Jr.,” “Hernandez v. State of Texas,” “Smith v. Allwright,” “Sweatt v. Painter,” “Republican Party”<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson14-v1\", \"n\": 14, \"label\": \"Lesson 14\", \"title\": \"Civil Rights & Political Change\", \"practice\": [{\"type\": \"match\", \"title\": \"Jigsaw: who did what?\", \"intro\": \"Match each achievement to the right leader or group.\", \"placeholder\": \"Choose one…\", \"button\": \"Check my matches\", \"word\": \"correct\", \"options\": [\"LULAC\", \"Hector P. García\", \" s[ti],total(t),t.word)}\n  }\n  if(t.type===\"mc\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    const render=m=>{body.innerHTML=mcHTML(t.items,`c${ti}_`,A,m)};\n    body.addEventListener(\"change\",e=>{A[e.target.name.split(\"_\")[1]]=+e.target.value;save();render(false);clearScore(ti)});\n    $(\"chk\"+ti).onclick=()=>{render(true);setScore(ti,t.items.filter((q,i)=>A[i]===q.a).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n});\n\n// Quiz\nconst QUIZ=C.quiz;\nS.qz=S.qz||{};\nfunction renderQuiz(){$(\"quiz\").innerHTML=mcHTML(QUIZ,\"qz\",S.qz,S.qzScore!=null);$(\"submitQuiz\").textContent=S.qzScore!=null?\"Check again\":\"Submit quiz\"}\n// Re-answering clears only that question's marks: a full re-render would drop every\n// other question's result and scroll the student away from where they were working.\nfunction unmarkQuestion(i){const f=$(\"quiz\").querySelectorAll(\"fieldset\")[i];if(!f)return;f.querySelectorAll(\".opt\").forEach(l=>l.classList.remove(\"ok\",\"no\"));f.querySelector(\".explain\")?.remove()}\n$(\"quiz\").addEventListener(\"change\",e=>{const i=+e.target.name.slice(2);S.qz[i]=+e.target.value;save();if(S.qzScore!=null)unmarkQuestion(i);updateAll()});\n$(\"quiz\").addEventListener(\"submit\",e=>e.preventDefault());\n$(\"submitQuiz\").onclick=()=>{const left=QUIZ.length-Object.keys(S.qz).length;if(left>0){$(\"fbQuiz\").className=\"fb no\";$(\"fbQuiz\").textContent=`Answer all questions first (${left} left).`;return}\n  S.qzScore=QUIZ.filter((q,i)=>S.qz[i]===q.a).length;S.qzDate=new Date().toLocaleDateString();save();renderQuiz();fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");updateAll()};\nrenderQuiz();if(S.qzScore!=null)fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");\n\n// Exit claim\n$(\"claim\").value=S.claim||\"\";\n[\"ck1\",\"ck2\",\"ck3\"].forEach(k=>{$(k).checked=!!S[k];$(k).onchange=()=>{S[k]=$(k).checked;save();updateAll()}});\nfunction wc(){const n=($(\"claim\").value.trim().match(/\\S+/g)||[]).length;$(\"wc\").textContent=n+(n===1?\" word\":\" words\");return n}\n$(\"claim\").addEventListener(\"input\",()=>{S.claim=$(\"claim\").value;save();wc();updateAll()});wc();\n\nfunction report(){\n  const L=[`Texas History ${C.label}: ${C.title}`];\n  T.forEach((t,ti)=>L.push(`${String.fromCharCode(65+ti)}. ${strip(t.title)}: ${S.ps[ti]==null?\"not checked yet\":S.ps[ti]+\"/\"+total(t)}`));\n  L.push(`Quiz: ${S.qzScore==null?\"not submitted\":S.qzScore+\"/\"+QUIZ.length+(S.qzDate?\" (submitted \"+S.qzDate+\")\":\"\")}`);\n  if(S.qzScore!=null){const miss=QUIZ.map((q,i)=>S.qz[i]===q.a?null:i+1).filter(Boolean);if(miss.length)L.push(\"Missed quiz questions: \"+miss.join(\", \"))}\n  const ck=[\"ck1\",\"ck2\",\"ck3\"].filter(k=>S[k]).length;\n  const head=L.shift();\n  const pr=$(\"reflect\").querySelector(\".prose\");\n  const prompt=pr?pr.textContent.replace(/\\s+/g,\" \").trim():\"\";\n  return [head,\n    S.doneAt?\"Completed \"+S.doneAt:\"Not finished yet\",\n    \"\",\n    \"EXIT CLAIM (for a parent to grade)\",\n    \"Prompt: \"+prompt,\n    `Answer (${wc()} words, self-check ${ck}/3):`,\n    S.claim&&S.claim.trim()?S.claim.trim():\"(not written yet)\",\n    \"\",\n    \"SCORES\",\n    ...L].join(\"\\n\");\n}\nfunction updateAll(){\n  const doneP=T.every((t,ti)=>S.ps[ti]!=null);\n  const anyP=T.some((t,ti)=>S.ps[ti]!=null);\n  const claimDone=wc()>=20&&[\"ck1\",\"ck2\",\"ck3\"].every(k=>S[k]);\n  $(\"nav-read\").classList.toggle(\"done\",anyP);\n  $(\"nav-practice\").classList.toggle(\"done\",doneP);\n  $(\"nav-check\").classList.toggle(\"done\",S.qzScore!=null);\n  $(\"nav-reflect\").classList.toggle(\"done\",claimDone);\n  const all=doneP&&S.qzScore!=null&&claimDone;\n  $(\"nav-results\").classList.toggle(\"done\",all);\n  const pTot=T.reduce((a,t)=>a+total(t),0);\n  const pGot=T.reduce((a,t,ti)=>a+(S.ps[ti]||0),0);\n  const cell=(v,l)=>`<div><b>${v}<\/b><span>${l}<\/span><\/div>`;\n  const letters=\"A–\"+String.fromCharCode(64+T.length);\n  $(\"score\").innerHTML=cell(doneP?`${pGot}/${pTot}`:\"—\",`Practice (${letters})`)+cell(S.qzScore!=null?`${S.qzScore}/${QUIZ.length}`:\"—\",\"Quiz\")+cell(S.qzScore!=null?Math.round(S.qzScore/QUIZ.length*100)+\"%\":\"—\",\"Quiz percent\")+cell(claimDone?\"Done\":\"—\",\"Exit claim\");\n  let st;\n  const need=Math.ceil(QUIZ.length*0.8);\n  if(all) st=S.qzScore>=need?`Lesson complete. Mastery reached (${need}/${QUIZ.length} or better on the quiz).`:`Lesson complete. ${C.review}, then talk through the missed quiz questions with a parent.`;\n  else{const todo=[];if(!doneP)todo.push(`check all ${T.length===4?\"four\":T.length} practice activities`);if(S.qzScore==null)todo.push(\"submit the quiz\");if(!claimDone)todo.push(\"write the exit claim (20+ words) and tick all three boxes\");st=\"Still to do: \"+todo.join(\", \")+\".\"}\n  $(\"status\").textContent=st;\n  if(all&&!S.doneAt){S.doneAt=new Date().toLocaleString([], {dateStyle:\"medium\",timeStyle:\"short\"});save()}\n  if(!all&&S.doneAt){S.doneAt=undefined;save()}\n  $(\"cert\").classList.toggle(\"complete\",all);\n  $(\"stamp\").textContent=all?\"Lesson complete\":\"In progress\";\n  $(\"certDate\").textContent=all?\"Completed \"+S.doneAt:\"\";\n  $(\"shot\").hidden=!all;\n}\n$(\"copy\").onclick=()=>{const t=report();const box=$(\"reportText\");box.value=t;\n  const fallback=()=>{box.hidden=false;box.focus();box.select();$(\"fbCopy\").className=\"fb\";$(\"fbCopy\").textContent=\"Select all of the text below and copy it. Then paste the answers into a message to your parents.\"};\n  try{navigator.clipboard.writeText(t).then(()=>{$(\"fbCopy\").className=\"fb ok\";$(\"fbCopy\").textContent=\"Copied. Now paste the answers into a message to your parents.\"},fallback)}catch(e){fallback()}};\nfunction askReset(){$(\"resetBox\").innerHTML=`<span>Erase your answers for this lesson? Your other lessons keep their work.<\/span><button class=\"btn\" id=\"yesReset\" style=\"background:var(--bad)\">Erase this lesson<\/button><button class=\"btn <script type="application/json" id="doc-lesson-15">"<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Contemporary Texas Lesson 15<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>\n/* Layout: same field-notebook column as Lesson 1; a west-to-east rain strip and region cards replace the timeline ruler; sticky step strip on top. */\n:root{\n  --paper:#f5f7f9; --card:#ffffff; --ink:#1b2433; --muted:#566275; --rule:#d4dbe4;\n  --blue:#2f5fb3; --blue-soft:#e3ebf8; --gold:#b9831b; --gold-soft:#f8eed9;\n  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b33a2f; --bad-soft:#f9e3e0;\n  --display:\"Zilla Slab\", Rockwell, \"Roboto Slab\", Georgia, serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n  --mono:\"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;\n  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;\n  --good:#6fd29f; --good-soft:#173527; --bad:#f08a7f; --bad-soft:#3d1f1c; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;\n  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;\n  --good:#6fd29f; --good-soft:#173527; --bad:#f08a7f; --bad-soft:#3d1f1c; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 64px}\n.wrap{max-width:760px;margin:0 auto}\nh1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}\nh1{font-size:clamp(2rem,6vw,2.8rem);font-weight:700}\nh2{font-size:1.65rem;font-weight:700}\nh3{font-size:1.2rem;font-weight:700}\np{margin:0}\n.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}\n.yr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}\na{color:var(--blue)}\n/* step strip */\n.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}\n.steps ol{list-style:none;display:flex;gap:6px;margin:0 auto;padding:0;max-width:760px;overflow-x:auto}\n.steps a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:.85rem;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap}\n.steps a:hover{background:var(--blue-soft);color:var(--ink)}\n.steps .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}\n.steps a.done .dot{background:var(--good);border-color:var(--good)}\n.steps a.done{color:var(--ink)}\nheader.hero{display:grid;gap:12px;padding-block:36px 24px}\n.hero .q{font-size:1.15rem;color:var(--muted);max-width:60ch}\n.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--muted)}\nsection.step{display:grid;gap:18px;padding-block:36px;border-top:2px solid var(--ink)}\n.prose{display:grid;gap:14px;max-width:65ch}\n.callout{background:var(--gold-soft);border-left:4px solid var(--gold);padd 2px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:12px}\n.cert.complete{border-color:var(--good);box-shadow:0 0 0 4px var(--good-soft)}\n.cert-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}\n.stamp{font-family:var(--mono);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--muted);color:var(--muted)}\n.cert.complete .stamp{border-color:var(--good);color:var(--good);background:var(--good-soft)}\n.certdate{font-size:.85rem;color:var(--muted)}\n.shot{background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:16px 18px;display:grid;gap:8px}\n.shot ul,.shot ol{margin:0;padding-left:1.2em;display:grid;gap:4px}\n@media (max-width:520px){body{font-size:16px}.task{padding:14px}.match label{grid-template-columns:3.4rem 1fr}.order li{padding:6px 8px}.btn{width:100%}}\n@media (prefers-reduced-motion:no-preference){.order li,.src,.opt{transition:background .2s,border-color .2s}html{scroll-behavior:smooth}}\n\n\n/* Lesson 2 additions */\n.strip{display:grid;gap:6px}\n.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}\n.band>div{padding:10px;border-radius:6px;display:grid;gap:2px;align-content:start;min-width:0;overflow-wrap:anywhere}\n.band b{font-size:.85rem;line-height:1.2}\n.band .yr{font-size:1.1rem;color:var(--ink)}\n.seg0{background:var(--gold-soft)}\n.seg1{background:color-mix(in srgb,var(--gold-soft) 66%,var(--blue-soft))}\n.seg2{background:color-mix(in srgb,var(--gold-soft) 33%,var(--blue-soft))}\n.seg3{background:var(--blue-soft)}\n.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--muted)}\n.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}\n.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}\n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 15 of 17<\/p>\n  <h1>Contemporary Texas<\/h1>\n  <p class=\"q\">Big question: <b>What challenges come with Texas's rapid growth?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.9A, 7.9B, 7.10B, 7.10C, 7.10D, 7.12B, 7.12C, 7.18A, 7.18B, 7.19A, 7.19B, 7.19C, 7.19D, 7.19E, 7.23B<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>A fast-growing state<\/h2>\n  <div class=\"prose\">\n    <p>Lesson 13 ended in 1945 with Texans moving from farms to cities. That move never stopped. Texas has grown faster than almost any other state, and in 2025 it added more people than any other state, about 391,000 in one year. More than 31 million people now live here.<\/p>\n  <\/div>\n\n  <div class=\"chartbox\"><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"Texas population: 7.7 million in 1950, 14.2 million in 1980, 20.9 million in 2000, 25.1 million in 2010, 29.1 million in 2020, 31.7 million in 2025\">\n    <g font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"var(--muted)\">\n      <line x1=\"40\" y1=\"160\" x2=\"350\" y2=\"160\" stroke=\"var(--rule)\"/>\n      <line x1=\"40\" y1=\"110\" x2=\"350\" y2=\"110\" stroke=\"var(--rule)\" stroke-dasharray=\"3 3\"/><line x1=\"40\" y1=\"60\" x2=\"350\" y2=\"60\" stroke=\"var(--rule)\" stroke-dasharray=\"3 3\"/>\n      <text x=\"34\" y=\"164\" text-anchor=\"end\">0<\/text><text x=\"34\" y=\"114\" text-anchor=\"end\">15M<\/text><text x=\"34\" y=\"64\" text-anchor=\"end\">30M<\/text>\n    <\/g>\n    <g fill=\"var(--blue)\">\n      <rect x=\"50\" y=\"134.3\" width=\"38\" height=\"25.7\"/><rect x=\"100\" y=\"112.6\" width=\"38\" height=\"47.4\"/><rect x=\"150\" y=\"90.5\" width=\"38\" height=\"69.5\"/><rect x=\"200\" y=\"76.2\" width=\"38\" height=\"83.8\"/><rect x=\"250\" y=\"62.8\" width=\"38\" height=\"97.2\"/><rect x=\"300\" y=\"54.3\" width=\"38\" height=\"105.7\" fill=\"var(--gold)\"/>\n    <\/g>\n    <g font-family=\"IBM Plex Mono, monospace\" font-size=\"10.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n      <text x=\"69\" y=\"128\">7.7<\/text><text x=\"119\" y=\"106\">14.2<\/text><text x=\"169\" y=\"84\">20.9<\/text><text x=\"219\" y=\"70\">25.1<\/text><text x=\"269\" y=\"56\">29.1<\/text><text x=\"319\" y=\"48\">31.7<\/text>\n      <text x=\"69\" y=\"177\">1950<\/text><text x=\"119\" y=\"177\">1980<\/text><text x=\"169\" y=\"177\">2000<\/text><text x=\"219\" y=\"177\">2010<\/text><text x=\"269\" y=\"177\">2020<\/text><text x=\"319\" y=\"177\">2025<\/text>\n    <\/g><\/svg><p class=\"cap\">Texas population in millions. U.S. Census counts, plus the Census Bureau's 2025 estimate.<\/p><\/div>\n\n  <h3>Why people come<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Jobs<\/b><span class=\"tag\">economy<\/span><\/div><p>Energy, health care, technology, shipping, and farming. Texas has led the nation in exports for many years, trading heavily with Mexico through its border ports.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Cost<\/b><span class=\"tag\">pull<\/span><\/div><p>Housing has often cost less than in states like California, and Texas has no state income tax.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Family<\/b><span class=\"tag\">natural growth<\/span><\/div><p>Many new Texans are born here. Others move from other states or other countries to join family.<\/p><\/div>\n  <\/div>\n\n  <h3>Texas in the world: science and technology<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Space<\/b><span class=\"tag\">NASA Houston<\/span><\/div><p>Johnson Space Center in Houston has run Mission Control since the 1960s, guiding the Apollo Moon landings and today's astronauts.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Computers<\/b><span class=\"tag\">Dell · TI<\/span><\/div><p>Jack Kilby of Texas Instruments in Dallas helped invent the integrated circuit (microchip) in 1958. Michael Dell started Dell in his UT Austin dorm room in 1984; it is based in Round Rock and sells around the world.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Medicine<\/b><span class=\"tag\">Texas Medical Center<\/span><\/div><p>Dr. Michael DeBakey of Houston pioneered heart surgery and devices that help failing hearts pump. The Texas Medical Center is among the largest medical centers in the world.<\/p><\/div>\n  <\/div>\n\n  <h3>The challenges of growth<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Water<\/b><span class=\"tag\">the big one<\/span><\/div><p>The 2022 State Water Plan projected that Texas's population would grow more than 70 percent between 2020 and 2070, while existing water supplies would <i>fall<\/i> by about 18 percent as reservoirs fill with silt and aquifers are pumped down. In a severe drought, about a quarter of Texans could face city water shortages without new projects.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Traffic and housing<\/b><span class=\"tag\">cities<\/span><\/div><p>Roads and housing struggle to keep up in fast-growing areas like Austin, Houston, Dallas–Fort Worth, and San Antonio.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Land<\/b><span class=\"tag\">environment<\/span><\/div><p>Farms and ranchland are paved for suburbs. Growth puts pressure on wildlife habitat and on the Gulf Coast.<\/p><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>Many cultures, one state.<\/b> Texas has no single majority group. Hispanic Texans and white Texans are the two largest groups, with large Black and Asian American communities and people from nearly every country. You can hear it in the music (Tejano, country, blues, hip-hop), taste it in the food, and see it in festivals from Juneteenth to Diez y Seis to Wurstfest.<\/div>\n\n  <h3>How to make a good decision (SE 23B)<\/h3>\n  <ol class=\"prose\" style=\"padding-left:1.2em\">\n    <li><b>Identify<\/b> the situation that needs a decision.<\/li>\n    <li><b>Gather information.<\/b><\/li>\n    <li><b>Identify options.<\/b><\/li>\n    <li><b>Predict consequences<\/b> of each option: pros and cons.<\/li>\n    <li><b>Take action<\/b> to carry out the decision.<\/li>\n    <li><b>Evaluate<\/b> how well it worked.<\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Write a decision memo<\/h2>\n  <div class=\"prose\"><p>Decision memo. A growing Texas county needs more water. In 3 to 5 sentences, <b>recommend one option<\/b> (a new reservoir, desalination, conservation, or another idea). Name the situation, give one pro and one con, and explain why your choice is the best option. Use at least one fact from today's lesson.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"The county should... because...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>recommendation<\/b>.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave a <b>pro and a con<\/b> and one fact from the lesson.<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>why<\/b> my option is the best choice.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 15 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 15<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Contemporary Texas<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.census.gov/quickfacts/TX\" target=\"_blank\" rel=\"noopener\">U.S. Census QuickFacts: Texas<\/a> · <a href=\"https://www.ksat.com/news/texas/2026/01/27/census-texas-led-us-in-population-growth-in-2025-but-immigration-slowed/\" target=\"_blank\" rel=\"noopener\">KSAT, Jan. 27, 2026 (2025 estimates)<\/a> · <a href=\"https://www.twdb.texas.gov/waterplanning/swp/\" target=\"_blank\" rel=\"noopener\">2022 State Water Plan<\/a> and <a href=\"https://comptroller.texas.gov/economy/fiscal-notes/archive/2023/sep/water.php\" target=\"_blank\" rel=\"noopener\">Comptroller summary<\/a> · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “DeBakey, Michael Ellis,” “Johnson Space Center,” “Texas Instruments”<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson15-v1\", \"n\": 15, \"label\": \"Lesson 15\", \"title\": \"Contemporary Texas\", \"practice\": [{\"type\": \"mc\", \"title\": \"Read the population chart\", \"intro\": \"Use the bar chart above. Pick the best answer.\", \"button\": \"Check my answers\", \"word\": \"correct\", \"items\": [{\"q\": \"About how much did Texas's population grow from 1950 to 2025?\", \"o\": [\"It roughly quadrupled\", \"It about doubled\", \"It stayed the same\"], \"a\": 0, \"e\": \"7.7 million to 31.7 million is about four times as many people.\"}, {\"q\": \"About how many people did Texas add between 2010 and 2020?\", \"o\": [\"About 4 million\", \"About 4,000\", \"About 40 million\"], \"a\": 0, \"e\": \"29.1 million minus 25.1 million is about 4 million, more than the whole population of many states.\"}, {\"q\": \"What does the chart predict will happen to demand for water?\", \"o\": [\"It will fall\", \"It will rise as more people need water\", \"The chart says nothing about people\"], \"a\": 1, \"e\": \"More people use more water, which is why the State Water Plan matters.\"}]}, {\"type\": \"match\", \"title\": \"Texans in science and business\", \"intro\": \"Match each clue to the right answer.\", \"placeholder\": \"Choose one…\", \"button\": \"Check my matches\", \"word\": \"correct\", \"options\": [\"Michael DeBakey\", \"Jack Kilby\", \"Michael Dell\", \"Johnson Space Center\"], \"items\": [[\"Houston surgeon who pioneered heart devices\", 0], [\"Helped invent the microchip at Texas Instruments\", 1], [\"Started a computer company in a college dorm\", 2], [\"Home of Mission Control\", 3]]}, {\"type\": \"order\", \"title\": \"The decision-making steps\", \"intro\": \"Use the arrows to put the six steps in order, first at the top.\", \"button\": \"Check my order\", \"word\": \"in the right spot\", \"seed\": 13, \"items\": [[\"Identify the situation\", \"1\"], [\"Gather information\", \"2\"], [\"Identify options\", \"3\"], [\"Predict consequences\", \"4\"], [\"Take action\", \"5\"], [\"Evaluate the results\", \"6\"]]}, {\"type\": \"sort\", \"title\": \"Water options: pro or con?\", \"intro\": \"A growing county needs more water. Is each statement a <b>pro<\\/b> or a <b>con<\\/b> of the option named?\", \"button\": \"Check my sorting\", \"word\": \"sorted correctly\", \"choices\": [[\"P\", \"Pro\"], [\"C\", \"Con\"]], \"items\": [[\"Build a new reservoir: stores a large amount of water\", \"P\", \"Reservoirs hold water for dry years.\"], [\"Build a new reservoir: floods farms, homes, and habitat\", \"C\", \"Land under the lake is lost.\"], [\"Desalination (removing salt from seawater or salty groundwater): a supply that does not depend on rain\", \"P\", \"It works even in drought.\"], [\"Desalination: uses a lot of energy and costs a lot\", \"C\", \"It is one of the most expensive options.\"], [\"Conservation (watering limits, fixing leaks): cheap and fast\", \"P\", \"Saving water is often the least expensive new supply.\"], [\"Conservation: alone, it can't keep up with fast growth\", \"C\", \"Most plans combine conservation with new supply.\"]]}], \"quiz\": [{\"q\": \"About how many people live in Texas today?\", \"o\": [\"About 3 million\", \"More than 31 million\", \"About 100 million\", \"About 10 million\"], \"a\": 1, \"e\": \"The Census Bureau estimated about 31.7 million in 2025.\"}, {\"q\": \"In 2025, Texas…\", \"o\": [\"Lost population\", \"Stopped growing\", \"Became the smallest state\", \"Added more people than any other state\"], \"a\": 3, \"e\": \"About 391,000 new residents.\"}, {\"q\": \"What did the 2022 State Water Plan warn about?\", \"o\": [\"Growing population while existing water supplies shrink\", \"Too much rain\", \"No one using water\", \"Water becoming free\"], \"a\": 0, \"e\": \"Supplies were projected to fall about 18 percent by 2070.\"}, {\"q\": \"Michael DeBakey is known for…\", \"o\": [\"Founding Dell\", \"Walking on the Moon\", \"Pioneering heart surgery and devices\", \"Discovering oil\"], \"a\": 2, \"e\": \"He worked in Houston.\"}, {\"q\": \"What happens at Johnson Space Center?\", \"o\": [\"Oil refining\", \"Cattle auctions\", \"NASA's Mission Control guides astronauts\", \"State laws are passed\"], \"a\": 2, \"e\": \"It is in Houston.\"}, {\"q\": \"Why do many people move to Texas?\", \"o\": [\"Jobs, lower costs, and family\", \"Snowy winters\", \"High state income taxes\", \"There is no reason\"], \"a\": 0, \"e\": \"These are pull factors.\"}, {\"q\": \"Which is the FIRST step in the decision-making process?\", \"o\": [\"Take action\", \"Evaluate\", \"Predict consequences\", \"Identify the situation\"], \"a\": 3, \"e\": \"You have to know the problem first.\"}, {\"q\": \"Which is a con of building a new reservoir?\", \"o\": [\"It stores water\", \"It floods land, homes, and habitat\", \"It helps in droughts\", \"It provides recreation\"], \"a\": 1, \"e\": \"Every option has trade-offs.\"}, {\"q\": \"How does Texas connect to the world economy?\", \"o\": [\"It is a leading exporting state that trades heavily with Mexico\", \"It does not trade\", \"It only trades cattle\", \"It trades only with Canada\"], \"a\": 0, \"e\": \"Energy, chemicals, computers, and farm goods go worldwide.\"}, {\"q\": \"Which sentence best answers the big question?\", \"o\": [\"Growth has no downsides\", \"Texas is shrinking\", \"Rapid growth brings jobs and diversity, but strains water, roads, housing, and land\", \"Water is not a concern\"], \"a\": 2, \"e\": \"Use a number as evidence.\"}], \"review\": \"Review the water challenge and the decision-making steps\"};\n(function(){\nconst C=window.LESSON;\nconst KEY=C.key;\nlet S={};\ntry{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst strip=s=>String(s).replace(/<[^>]+>/g,\"\");\nfunction shuffled(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction fb(id,n,t,word){const el=$(id);el.className=\"fb \"+(n===t?\"ok\":\"no\");el.textContent=n===t?`All ${t} ${word}. Nice work.`:`${n} of ${t} ${word}. Fix the red ones and check again.`}\nfunction mcHTML(set,prefix,ans,marks){return set.map((q,i)=>`<fieldset><legend>${q.q}<\/legend>${q.o.map((o,j)=>{const c=marks&&String(ans[i])===String(j)?(j===q.a?\"ok\":\"no\"):\"\";return `<label class=\"opt ${c}\"><input type=\"radio\" name=\"${prefix}${i}\" value=\"${j}\" ${String(ans[i])===String(j)?\"checked\":\"\"}> <span>${o}<\/span><\/label>`}).join(\"\")}${marks&&String(ans[i])===String(q.a)?`<p class=\"explain\">${q.e}<\/p>`:\"\"}<\/fieldset>`).join(\"\")}\n\nS.p=S.p||{};S.ps=S.ps||{};\nconst T=C.practice;\nconst total=t=>t.type===\"compare\"?t.items.length*t.columns.length:t.items.length;\n$(\"practiceTasks\").innerHTML=T.map((t,ti)=>`<div class=\"task\" id=\"task${ti}\"><header><h3>${String.fromCharCode(65+ti)}. ${t.title}<\/h3><p>${t.intro}<\/p><\/header>${t.before||\"\"}<div id=\"body${ti}\" class=\"${t.type===\"match\"?\"match wide\":t.type===\"sort\"?\"sort\":\"\"}\"${t.type===\"mc\"?' style=\"display:grid;gap:18px\"':\"\"}><\/div><div class=\"row\"><button class=\"btn\" id=\"chk${ti}\">${t.button}<\/button><span class=\"fb\" id=\"fb${ti}\" aria-live=\"polite\"><\/span><\/div><\/div>`).join(\"\");\n\nfunction setScore(ti,n){S.ps[ti]=n;save();fb(\"fb\"+ti,n,total(T[ti]),T[ti].word);updateAll()}\nfunction clearScore(ti){if(S.ps[ti]!=null){S.ps[ti]=null;save()}$(\"fb\"+ti).textContent=\"\";updateAll()}\nconst scored=ti=>S.ps[ti]!=null;\n\nT.forEach((t,ti)=>{\n  const body=$(\"body\"+ti);\n  if(t.type===\"match\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    body.innerHTML=t.items.map((c,i)=>`<label id=\"m${ti}_${i}\" for=\"ms${ti}_${i}\"><span class=\"t\">${c[0]}<\/span><select id=\"ms${ti}_${i}\" data-i=\"${i}\"><option value=\"\">${t.placeholder}<\/option>${t.options.map((n,j)=>`<option value=\"${j}\">${esc(n)}<\/option>`).join(\"\")}<\/select><\/label>`).join(\"\");\n    t.items.forEach((c,i)=>{if(A[i]!=null)$(`ms${ti}_${i}`).value=A[i]});\n    const ok=i=>String(A[i])===String(t.items[i][1]);\n    const mark=on=>t.items.forEach((c,i)=>{$(`m${ti}_${i}`).className=on?(ok(i)?\"ok\":\"no\"):\"\"});\n    body.addEventListener(\"change\",e=>{A[e.target.dataset.i]=e.target.value;save();mark(false);clearScore(ti)});\n    $(\"chk\"+ti).onclick=()=>{mark(true);setScore(ti,t.items.filter((c,i)=>ok(i)).length)};\n    if(scored(ti)){mark(true);fb(\"fb\"+ti,S.ps[ti],total(t),t.word)}\n  }\n  if(t.type===\"sort\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    const render=marks=>{body.innerHTML=t.items.map((s,i)=>{const v=A[i];const cls=marks&&v?(v===s[1]?\"ok\":\"no\"):\"\";\n      return `<div class=\"src ${cls}\"><span class=\"t\">${s[0]}<\/span><span class=\"seg\" role=\"group\" aria-label=\"${esc(t.choices.map(c=>c[1]).join(\" or \"))}\">${t.choices.map(c=>`<button type=\"button\" data-i=\"${i}\" data-v=\"${c[0]}\" aria-pressed=\"${v===c[0]}\">${c[1]}<\/button>`).join(\"\")}<\/span>${marks&&v?`<span class=\"why\">${v===s[1]?\"Correct.\":\"Not quite.\"} ${s[2]}<\/span>`:\"\"}<\/div>`}).join(\"\")};\n    body.addEventListener(\"click\",e=>{const b=e.target.closest(\"button[data-v]\");if(!b)return;A[b.dataset.i]=b.dataset.v;save();render(false);clearScore(ti)});\n    $(\"chk\"+ti).onclick=()=>{render(true);setScore(ti,t.items.filter((s,i)=>A[i]===s[1]).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n  if(t.type===\"order\"){\n    let A=S.p[ti];\n    if(!Array.isArray(A)||A.length!==t.items.length){A=shuffled(t.items.length,t.seed||7);if(A.every((v,i)=>v===i))A.reverse();S.p[ti]=A;save()}\n    body.innerHTML=`<ol class=\"order\" id=\"ol${ti}\"><\/ol>`;\n    const render=marks=>{$(\"ol\"+ti).innerHTML=A.map((idx,pos)=>{const it=t.items[idx];const cls=marks?(idx===pos?\"ok\":\"no\"):\"\";\n      return `<li class=\"${cls}\"><span class=\"grip\" aria-hidden=\"true\">⠿<\/span><span class=\"t\">${it[0]}${marks&&idx===pos?` <span class=\"yr\" style=\"color:var(--good)\">· ${it[1]}<\/span>`:\"\"}<\/span><span class=\"mv\"><button type=\"button\" class=\"icon\" data-p=\"${pos}\" data-d=\"-1\" aria-label=\"Move up: ${esc(strip(it[0]))}\" ${pos===0?\"disabled\":\"\"}>↑<\/button><button type=\"button\" class=\"icon\" data-p=\"${pos}\" data-d=\"1\" aria-label=\"Move down: ${esc(strip(it[0]))}\" ${pos===A.length-1?\"disabled\":\"\"}>↓<\/button><\/span><\/li>`}).join(\"\")};\n    // Drag to reorder. Pointer Events cover mouse, touch and pen with one path; the\n    // drag starts on the grip only, so touching the row itself still scrolls the page.\n    (()=>{const ol=$(\"ol\"+ti);let d=null;\n      ol.addEventListener(\"pointerdown\",e=>{const g=e.target.closest(\".grip\");if(!g)return;\n        const li=g.closest(\"li\");if(!li)return;e.preventDefault();\n        d={li,from:[...ol.children].indexOf(li),id:e.pointerId};\n        li.classList.add(\"dragging\");try{g.setPointerCapture(e.pointerId)}catch(err){}});\n      ol.addEventListener(\"pointermove\",e=>{if(!d||e.pointerId!==d.id)return;e.preventDefault();\n        const other=[...ol.children].filter(x=>x!==d.li);\n        const before=other.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});\n        if(before)ol.insertBefore(d.li,before);else ol.appendChild(d.li)});\n      const end=e=>{if(!d||e.pointerId!==d.id)return;\n        const li=d.li,from=d.from,to=[...ol.children].indexOf(li);d=null;\n        li.classList.remove(\"dragging\");\n        if(to<0||to===from){render(scored(ti));return}\n        A.splice(to,0,A.splice(from,1)[0]);save();render(false);clearScore(ti)};\n      ol.addEventListener(\"pointerup\",end);ol.addEventListener(\"pointercancel\",end);})();\n    body.addEventListener(\"click\",e=>{const b=e.target.closest(\"button[data-d]\");if(!b)return;const p=+b.dataset.p,q=p+(+b.dataset.d);if(q<0||q>=A.length)return;[A[p],A[q]]=[A[q],A[p]];save();render(false);clearScore(ti);\n      const nb=$(\"ol\"+ti).querySelectorAll(\"li\")[q]?.querySelector(`button[data-d=\"${b.dataset.d}\"]`);if(nb&&!nb.disabled)nb.focus();else $(\"ol\"+ti).querySelectorAll(\"li\")[q]?.querySelector(\"button:not([disabled])\")?.focus()});\n    $(\"chk\"+ti).onclick=()=>{render(true);setScore(ti,A.filter((v,i)=>v===i).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n  if(t.type===\"compare\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    const cols=t.columns,ph=t.placeholder||\"Choose…\";\n    const ok=(i,k)=>String(A[i+\"_\"+k])===String(t.items[i].a[k]);\n    body.innerHTML=`<div class=\"cmpbox\"><table class=\"cmp\"><thead><tr><th scope=\"col\"><\/th>${cols.map(p=>`<th scope=\"col\">${esc(p)}<\/th>`).join(\"\")}<\/tr><\/thead><tbody>${t.items.map((r,i)=>`<tr><th scope=\"row\">${r.row}<\/th>${cols.map((p,k)=>`<td id=\"ct${ti}_${i}_${k}\"><select id=\"cs${ti}_${i}_${k}\" data-k=\"${i}_${k}\" aria-label=\"${esc(p)}: ${esc(strip(r. stener(\"submit\",e=>e.preventDefault());\n$(\"submitQuiz\").onclick=()=>{const left=QUIZ.length-Object.keys(S.qz).length;if(left>0){$(\"fbQuiz\").className=\"fb no\";$(\"fbQuiz\").textContent=`Answer all questions first (${left} left).`;return}\n  S.qzScore=QUIZ.filter((q,i)=>S.qz[i]===q.a).length;S.qzDate=new Date().toLocaleDateString();save();renderQuiz();fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");updateAll()};\nrenderQuiz();if(S.qzScore!=null)fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");\n\n// Exit claim\n$(\"claim\").value=S.claim||\"\";\n[\"ck1\",\"ck2\",\"ck3\"].forEach(k=>{$(k).checked=!!S[k];$(k).onchange=()=>{S[k]=$(k).checked;save();updateAll()}});\nfunction wc(){const n=($(\"claim\").value.trim().match(/\\S+/g)||[]).length;$(\"wc\").textContent=n+(n===1?\" word\":\" words\");return n}\n$(\"claim\").addEventListener(\"input\",()=>{S.claim=$(\"claim\").value;save();wc();updateAll()});wc();\n\nfunction report(){\n  const L=[`Texas History ${C.label}: ${C.title}`];\n  T.forEach((t,ti)=>L.push(`${String.fromCharCode(65+ti)}. ${strip(t.title)}: ${S.ps[ti]==null?\"not checked yet\":S.ps[ti]+\"/\"+total(t)}`));\n  L.push(`Quiz: ${S.qzScore==null?\"not submitted\":S.qzScore+\"/\"+QUIZ.length+(S.qzDate?\" (submitted \"+S.qzDate+\")\":\"\")}`);\n  if(S.qzScore!=null){const miss=QUIZ.map((q,i)=>S.qz[i]===q.a?null:i+1).filter(Boolean);if(miss.length)L.push(\"Missed quiz questions: \"+miss.join(\", \"))}\n  const ck=[\"ck1\",\"ck2\",\"ck3\"].filter(k=>S[k]).length;\n  const head=L.shift();\n  const pr=$(\"reflect\").querySelector(\".prose\");\n  const prompt=pr?pr.textContent.replace(/\\s+/g,\" \").trim():\"\";\n  return [head,\n    S.doneAt?\"Completed \"+S.doneAt:\"Not finished yet\",\n    \"\",\n    \"EXIT CLAIM (for a parent to grade)\",\n    \"Prompt: \"+prompt,\n    `Answer (${wc()} words, self-check ${ck}/3):`,\n    S.claim&&S.claim.trim()?S.claim.trim():\"(not written yet)\",\n    \"\",\n    \"SCORES\",\n    ...L].join(\"\\n\");\n}\nfunction updateAl a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 16 of 17<\/p>\n  <h1>Texas Government &amp; Citizenship<\/h1>\n  <p class=\"q\">Big question: <b>How does the 1876 Constitution shape the government Texans live under today?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.13A, 7.13B, 7.14A, 7.14B, 7.15A, 7.15B, 7.16B, 7.17A, 7.23A<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>A constitution written in 1876<\/h2>\n  <div class=\"prose\">\n    <p>In Lesson 10, Reconstruction ended and Texans reacted against Governor E. J. Davis's powerful state government. In 1876 they wrote a new constitution designed to keep government small and weak. Texas still lives under that constitution today, though voters have amended it more than 500 times.<\/p>\n  <\/div>\n\n  <div class=\"dates\">\n    <div class=\"date\"><span class=\"yr\">1876<\/span><b>Texas adopts its current constitution<\/b><p>This is the last of your eight required dates. Your timeline is complete.<\/p><\/div>\n  <\/div>\n\n  <h3>Seven constitutions<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1827<\/span><div><b>Coahuila y Tejas<\/b><span>Texas as a Mexican state (Lesson 5).<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1836<\/span><div><b>Republic of Texas<\/b><span>An independent nation (Lesson 8).<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1845<\/span><div><b>Statehood<\/b><span>Joining the United States.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1861<\/span><div><b>Confederacy<\/b><span>Joining the Confederate States (Lesson 10).<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1866 · 1869<\/span><div><b>Reconstruction<\/b><span>Two constitutions written to rejoin the Union.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1876<\/span><div><b>Today's constitution<\/b><span>Limited government after Reconstruction.<\/span><\/div><\/div>\n  <\/div>\n\n  <h3>Read the source: the Texas Bill of Rights<\/h3>\n  <div class=\"excerpt\">\n    <span class=\"who\">Texas Constitution, Article 1 · excerpts<\/span>\n    <p class=\"line\">Sec. 1: “Texas is a free and independent State, subject only to the Constitution of the United States…”<\/p>\n    <p class=\"line\">Sec. 2: “All political power is inherent in the people, and all free governments are founded on their authority, and instituted for their benefit.”<\/p>\n    <p>Article 1 lists rights such as freedom of worship, freedom of speech and the press, trial by jury, the right to bear arms, and equality under the law. Like the U.S. Bill of Rights, it protects people from their government. Unlike the U.S. version, it comes <i>first<\/i> in the constitution.<\/p>\n  <\/div>\n\n  <h3>Principles you can find in it<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Popular sovereignty<\/b><span class=\"tag\">Art. 1, Sec. 2<\/span><\/div><p>Power comes from the people. Texans vote for many officials and must approve every constitutional amendment.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Limited government<\/b><span class=\"tag\">reaction to 1870s<\/span><\/div><p>The governor shares power with other separately elected officials (the lieutenant governor, attorney general, comptroller, and more). The Legislature meets only every other year, for 140 days.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Separation of powers<\/b><span class=\"tag\">three branches<\/span><\/div><p>Legislative (150 House members, 31 senators), executive (governor and other officials), and judicial (elected judges, with two top courts).<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Checks and balances<\/b><span class=\"tag\">veto · override<\/span><\/div><p>The governor can veto bills; the Legislature can override with a two-thirds vote; courts can strike down laws.<\/p><\/div>\n  <\/div>\n\n  <h3>Three levels of government close to home<\/h3>\n  <div class=\"cmpbox\"><table class=\"cmp\">\n    <thead><tr><th><\/th><th>City<\/th><th>County<\/th><th>State<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><th>Leaders<\/th><td>Mayor and city council<\/td><td>Commissioners court: a county judge and four commissioners<\/td><td>Governor and Legislature<\/td><\/tr>\n      <tr><th>Does<\/th><td>Police, parks, water, trash, local streets<\/td><td>County roads, jails, courts, elections, records<\/td><td>State laws, highways, prisons, schools funding<\/td><\/tr>\n      <tr><th>Pays with<\/th><td>Property tax, local sales tax, fees, bonds<\/td><td>Property tax, fees, bonds<\/td><td>Sales tax (6.25%), oil and gas taxes, fees, federal funds. No state income tax.<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"prose\"><p>Texas has 254 counties, more than any other state. A <b>bond<\/b> is borrowed money paid back with interest over many years, and voters usually must approve it. School districts are also local governments with elected boards; property taxes pay for much of your school.<\/p><\/div>\n\n  <div class=\"callout\"><b>Citizenship.<\/b> Rights come with responsibilities: obeying laws, paying taxes, serving on a jury, and voting once you turn 18. Good citizens also stay informed, speak up at public meetings, and volunteer. You can attend a city council or commissioners court meeting right now; they are open to the public.<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz + Checkpoint 3<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">15 questions. Questions 11–15 review Lessons 11–15 for Checkpoint 3. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>How does the 1876 Constitution shape the government Texans live under today?<\/b> Make a claim, give one piece of evidence (a section of Article 1, a principle, or a feature like the plural executive), and explain how it affects Texans now.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"The 1876 Constitution shapes Texas government today by...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 16 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 16<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Texas Government &amp; Citizenship<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://statutes.capitol.texas.gov/\" target=\"_blank\" rel=\"noopener\">Texas Constitution and Statutes<\/a> (Article 1) · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Constitution of 1876,” “County Government,” “Plural Executive”<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson16-v1\", \"n\": 16, \"label\": \"Lesson 16\", \"title\": \"Texas Government & Citizenship\", \"practice\": [{\"type\": \"sort\", \"title\": \"Texas, U.S., or both?\", \"intro\": \"Is this true of the <b>Texas<\\/b> Bill of Rights, the <b>U.S.<\\/b> Bill of Rights, or <b>both<\\/b>?\", \"button\": \"Check my sorting\", \"word\": \"sorted correctly\", \"choices\": [[\"T\", \"Texas\"], [\"U\", \"U.S.\"], [\"B\", \"Both\"]], \"items\": [[\"Protects freedom of speech and religion\", \"B\", \"Both protect these rights.\"], [\"Comes first, before the rest of the constitution\", \"T\", \"The U.S. Bill of Rights was added later as amendments.\"], [\"Protects the right to a trial by jury\", \"B\", \"Both guarantee jury trials.\"], [\"Says the state is subject only to the U.S. Constitution\", \"T\", \"That's Article 1, Section 1.\"], [\"Is made of the first ten amendments\", \"U\", \"Added in 1791.\"], [\"Says political power comes from the people\", \"T\", \"Article 1, Section 2. The U.S. version doesn't say it this way, though the Constitution's preamble begins “We the People.”\"]]}, {\"type\": \"match\", \"title\": \"Who does it?\", \"intro\": \"Which level of government is mainly responsible?\", \"placeholder\": \"Choose a level…\", \"button\": \"Check my matches\", \"word\": \"correct\", \"options\": [\"City\", \"County\", \"State\"], \"items\": [[\"Runs the county jail and courthouse\", 1], [\"Picks up trash and runs city parks\", 0], [\"Passes laws for all of Texas\", 2], [\"Holds elections and keeps land records\", 1], [\"Builds and maintains interstate highways in Texas\", 2], [\"Hires the local police department\", 0]]}, {\"type\": \"mc\", \"title\": \"Commissioners court simulation\", \"intro\": \"Your county wants a new library. It can raise property taxes, ask voters to approve a bond, or charge fees. Pick the best answer.\", \"button\": \"Check my answers\", \"word\": \"correct\", \"items\": [{\"q\": \"Who votes on the plan at the county level?\", \"o\": [\"The governor alone\", \"The commissioners court: a county judge and four commissioners\", \"The U.S. Congress\"], \"a\": 1, \"e\": \"Five members, one vote each.\"}, {\"q\": \"If the county uses a bond, what usually has to happen first?\", \"o\": [\"Voters must approve it in an election\", \"The President must sign it\", \"Nothing; bonds are automatic\"], \"a\": 0, \"e\": \"A bond is borrowed money, so voters weigh in.\"}, {\"q\": \"What is one responsibility of a citizen during this decision?\", \"o\": [\"Ignore it\", \"Refuse to pay all taxes\", \"Stay informed and speak at the public meeting or vote\"], \"a\": 2, \"e\": \"Meetings are open, and citizens can comment.\"}, {\"q\": \"Which principle explains why voters get a say?\", \"o\": [\"Monarchy\", \"Popular sovereignty\", \"Secession\"], \"a\": 1, \"e\": \"Power comes from the people.\"}]}, {\"type\": \"order\", \"title\": \"Texas constitutions in order\", \"intro\": \"Use the arrows to put these constitutions in order, earliest at the top.\", \"button\": \"Check my order\", \"word\": \"in the right spot\", \"seed\": 14, \"items\": [[\"Coahuila y Tejas (Mexican state)\", \"1827\"], [\"Republic of Texas\", \"1836\"], [\"Statehood\", \"1845\"], [\"Confederate Texas\", \"1861\"], [\"First Reconstruction constitution\", \"1866\"], [\"Today's constitution\", \"1876\"]]}], \"quiz\": [{\"q\": \"What happened in 1876?\", \"o\": [\"Texas joined the U.S.\", \"Texas adopted the constitution it still uses\", \"Oil was found\", \"Texas seceded\"], \"a\": 1, \"e\": \"1876 is a required date.\"}, {\"q\": \"Why did the 1876 constitution limit government power?\", \"o\": [\"Mexico required it\", \"The U.S. President wrote it\", \"To give the governor more power\", \"Texans reacted against the strong Reconstruction government of E. J. Davis\"], \"a\": 3, \"e\": \"Limited government was the goal.\"}, {\"q\": \"“All political power is inherent in the people” is an example of…\", \"o\": [\"Popular sovereignty\", \"Checks and balances\", \"Federalism\", \"Monarchy\"], \"a\": 0, \"e\": \"Article 1, Section 2.\"}, {\"q\": \"How often does the Texas Legislature meet in regular session?\", \"o\": [\"Every day\", \"Once every 10 years\", \"Every other year, for 140 days\", \"Only in wartime\"], \"a\": 2, \"e\": \"Part of limited government.\"}, {\"q\": \"Who runs a Texas county?\", \"o\": [\"A mayor\", \"A president\ <script type="application/json" id="doc-cfw">"<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Celebrate Freedom Week<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>\n/* Layout: same field-notebook column as Lesson 1; a west-to-east rain strip and region cards replace the timeline ruler; sticky step strip on top. */\n:root{\n  --paper:#f5f7f9; --card:#ffffff; --ink:#1b2433; --muted:#566275; --rule:#d4dbe4;\n  --blue:#2f5fb3; --blue-soft:#e3ebf8; --gold:#b9831b; --gold-soft:#f8eed9;\n  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b33a2f; --bad-soft:#f9e3e0;\n  --display:\"Zilla Slab\", Rockwell, \"Roboto Slab\", Georgia, serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n  --mono:\"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;\n  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;\n  --good:#6fd29f; --good-soft:#173527; --bad:#f08a7f; --bad-soft:#3d1f1c; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --paper:#131820; --card:#1b222d; --ink:#e7ecf3; --muted:#9eabbd; --rule:#2f3a4a;\n  --blue:#8fb2ef; --blue-soft:#22324d; --gold:#e3b45a; --gold-soft:#3a2f19;\n  --good:#6fd29f; --good-soft:#173527; --bad:#f08a7f; --bad-soft:#3d1f1c; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 64px}\n.wrap{max-width:760px;margin:0 auto}\nh1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}\nh1{font-size:clamp(2rem,6vw,2.8rem);font-weight:700}\nh2{font-size:1.65rem;font-weight:700}\nh3{font-size:1.2rem;font-weight:700}\np{margin:0}\n.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}\n.yr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}\na{color:var(--blue)}\n/* step strip */\n.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}\n.steps ol{list-style:none;display:flex;gap:6px;margin:0 auto;padding:0;max-width:760px;overflow-x:auto}\n.steps a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:.85rem;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap}\n.steps a:hover{background:var(--blue-soft);color:var(--ink)}\n.steps .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}\n.steps a.done .dot{background:var(--good);border-color:var(--good)}\n.steps a.done{color:var(--ink)}\nheader.hero{display:grid;gap:12px;padding-block:36px 24px}\n.hero .q{font-size:1.15rem;color:var(--muted);max-width:60ch}\n.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--muted)}\nsection.step{display:grid;gap:18px;padding-block:36px;border-top:2px solid var(--ink)}\n.prose{display:grid;gap:14px;max-width:65ch}\n.callout{background:var(--gold-soft);border-left:4px solid var(--gold);padding:14px 16p
