olid var(--blue);border-radius:8px;overflow:hidden}\n.seg button{border:0;background:transparent;color:var(--blue);padding:10px 14px;min-height:44px;font-weight:700;font-size:.9rem}\n.seg button[aria-pressed=\"true\"]{background:var(--blue);color:var(--card)}\n@media (max-width:520px){.src{grid-template-columns:1fr}}\n.chartbox{overflow-x:auto}\n.chartbox svg{display:block;width:100%;min-width:320px;height:auto}\n.chartbox .cap{font-size:.8rem;color:var(--muted)}\nfieldset{border:0;margin:0;padding:0;display:grid;gap:6px}\nlegend{font-weight:700;margin-bottom:6px;padding:0}\n.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;border:1px solid transparent}\n.opt:hover{background:var(--blue-soft)}\n.opt input{margin-top:5px;accent-color:var(--blue)}\n.opt.ok{background:var(--good-soft);border-color:var(--good)}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.explain{font-size:.92rem;color:var(--muted);padding-left:10px;border-left:3px solid var(--rule)}\n.quiz{display:grid;gap:22px;counter-reset:q}\n.quiz fieldset legend::before{counter-increment:q;content:counter(q) \". \";font-family:var(--mono);color:var(--blue)}\ntextarea{font:inherit;width:100%;min-height:9rem;padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);resize:vertical}\n.checks{display:grid;gap:6px}\n.checks label{display:flex;gap:10px;align-items:flex-start}\n.checks input{margin-top:5px;accent-color:var(--good)}\n.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}\n.score div{border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--card);display:grid;gap:2px}\n.score b{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}\n.score span{font-size:.85rem;color:var(--muted)}\n.small{font-size:.85rem;color:var(--muted)}\n.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.cert{background:var(--card);border:2px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:12px}\n.cert.complete{border-color:var(--good);box-shadow:0 0 0 4px var(--good-soft)}\n.cert-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}\n.stamp{font-family:var(--mono);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--muted);color:var(--muted)}\n.cert.complete .stamp{border-color:var(--good);color:var(--good);background:var(--good-soft)}\n.certdate{font-size:.85rem;color:var(--muted)}\n.shot{background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:16px 18px;display:grid;gap:8px}\n.shot ul,.shot ol{margin:0;padding-left:1.2em;display:grid;gap:4px}\n@media (max-width:520px){body{font-size:16px}.task{padding:14px}.match label{grid-template-columns:3.4rem 1fr}.order li{padding:6px 8px}.btn{width:100%}}\n@media (prefers-reduced-motion:no-preference){.order li,.src,.opt{transition:background .2s,border-color .2s}html{scroll-behavior:smooth}}\n\n\n/* Lesson 2 additions */\n.strip{display:grid;gap:6px}\n.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}\n.band>div{padding:10px;border-radius:6px;display:grid;gap:2px;align-content:start;min-width:0;overflow-wrap:anywhere}\n.band b{font-size:.85rem;line-height:1.2}\n.band .yr{font-size:1.1rem;color:var(--ink)}\n.seg0{background:var(--gold-soft)}\n.seg1{background:color-mix(in srgb,var(--gold-soft) 66%,var(--blue-soft))}\n.seg2{background:color-mix(in srgb,var(--gold-soft) 33%,var(--blue-soft))}\n.seg3{background:var(--blue-soft)}\n.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--muted)}\n.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}\n.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}\n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 9 of 17<\/p>\n  <h1>Early Statehood &amp; the U.S.–Mexican War<\/h1>\n  <p class=\"q\">Big question: <b>How did statehood change Texas's borders and population?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.4C, 7.10A, 7.10B<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>A new state, a war, and a new shape<\/h2>\n  <div class=\"prose\">\n    <p>In Lesson 8, Texas joined the United States in 1845. Mexico had never accepted Texas independence, and the two countries disagreed about where Texas even ended. Within months, that argument became a war.<\/p>\n  <\/div>\n\n  <h3>The border dispute<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Mexico's claim<\/b><span class=\"tag\">Nueces River<\/span><\/div><p>Texas had always ended at the Nueces River, which reaches the coast at Corpus Christi.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Texas and U.S. claim<\/b><span class=\"tag\">Rio Grande<\/span><\/div><p>The border was the Rio Grande, all the way to its source in the Rocky Mountains. That claim even took in Santa Fe.<\/p><\/div>\n  <\/div>\n\n  <h3>From war to today's border<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1846<\/span><div><b>War begins<\/b><span>President Polk sent General Zachary Taylor's army to the Rio Grande. After a clash between U.S. and Mexican soldiers in the disputed land, Congress declared war. Early battles at Palo Alto and Resaca de la Palma were fought near today's Brownsville.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1847<\/span><div><b>U.S. captures Mexico City<\/b><span>Texas Rangers served as scouts. U.S. armies marched into central Mexico and took the capital.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1848<\/span><div><b>Treaty of Guadalupe Hidalgo<\/b><span>Mexico accepted the Rio Grande as the Texas border and gave up a huge area, the Mexican Cession, which later became California, Nevada, Utah, and parts of four more states.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1850<\/span><div><b>Compromise of 1850<\/b><span>Texas still claimed land as far as Santa Fe. In the Compromise of 1850, Texas gave up that claim in exchange for $10 million from the U.S., which it used to pay the old Republic's debts. This set the shape of Texas you know today.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>Map task.<\/b> Compare an 1845 map of Texas (a long strip reaching up into today's Colorado and Wyoming) with an 1850 map (today's shape, with the Panhandle). What land did Texas give up? Find period maps at the <a href=\"https://texashistory.unt.edu/\" target=\"_blank\" rel=\"noopener\">Portal to Texas History<\/a>.<\/div>\n\n  <h3>Who came, and where they settled<\/h3>\n  <div class=\"prose\"><p>Statehood brought safety and cheap land, and people poured in. Texas grew from about 212,000 people in 1850 to about 604,000 in 1860. Where each group settled depended on why they came and on the land itself.<\/p><\/div>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Germans<\/b><span class=\"tag\">Hill Country<\/span><\/div><p>Fled hard times and political turmoil in Germany. A society of nobles organized settlement at <b>New Braunfels<\/b> (1845) and <b>Fredericksburg<\/b> (1846). In 1847 John O. Meusebach made a peace treaty with the Comanche that was kept.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Czechs<\/b><span class=\"tag\">Central Texas<\/span><\/div><p>Came for farmland starting in the 1850s and settled the rolling prairies of Fayette, Austin, and Lavaca counties. Many farmed cotton and corn.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Mexican Texans<\/b><span class=\"tag\">South Texas<\/span><\/div><p>Already lived there. Tejano families ranched the brush country between the Nueces and the Rio Grande and in San Antonio. Many lost land to newcomers through lawsuits and pressure after the war.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Enslaved African Americans<\/b><span class=\"tag\">East Texas<\/span><\/div><p>Did not choose to come. Enslavers forced them to Texas to grow cotton on the rich soils and river bottoms of East Texas and the Brazos and Colorado valleys. By 1860, about 182,000 people, nearly a third of all Texans, were enslaved.<\/p><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>Geography decides.<\/b> Cotton needs rain, warm weather, and rich soil, so plantations clustered in the wetter east. Ranching works on dry grassland and brush, so it spread south and west. Rivers carried crops to the coast. When you explain where a group lived, look for both the <b>push<\/b> that made them leave home and the <b>pull<\/b> of the land in Texas.<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>How did statehood change Texas's borders and population?<\/b> Make a claim, give one piece of evidence (a treaty, a date, a group, or a number), and explain a <b>“why here?”<\/b> reason using geography.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"Statehood changed Texas by...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>why<\/b> a group settled where it did, using geography.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 9 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 9<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Early Statehood &amp; the U.S.–Mexican War<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 10 of 17<\/p>\n  <h1>Civil War &amp; Reconstruction<\/h1>\n  <p class=\"q\">Big question: <b>Why did Texas secede, and what changed when the war ended?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.5A, 7.5B, 7.5C<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<div class=\"callout\" style=\"margin-bottom:8px\"><b>For parents:<\/b> Today's primary source, the 1861 Declaration of Causes, contains openly racist language. The lesson quotes only short lines and treats them as evidence of the convention's own stated reasons. Please preview it and be ready to talk it through.<\/div>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>Texas leaves the Union<\/h2>\n  <div class=\"prose\">\n    <p>In Lesson 9, Texas grew fast, and by 1860 nearly a third of Texans were enslaved. Across the country, North and South argued over whether slavery could spread into new western lands. When Abraham Lincoln, who opposed the spread of slavery, was elected president in November 1860, Southern states began to leave the Union.<\/p>\n    <p>On February 1, 1861, a Texas convention voted 166 to 8 to secede. The next day it approved a document explaining why: the <b>Declaration of Causes<\/b>. Voters approved secession about three to one. Governor Sam Houston refused to swear loyalty to the Confederacy and was removed from office.<\/p>\n  <\/div>\n\n  <div class=\"dates\">\n    <div class=\"date\"><span class=\"yr\">1861<\/span><b>Texas secedes and joins the Confederacy<\/b><p>This is one of your eight required dates. Add it to your timeline.<\/p><\/div>\n  <\/div>\n\n  <h3>Read the source: what the convention said<\/h3>\n  <div class=\"excerpt\">\n    <span class=\"who\">Texas Declaration of Causes, February 2, 1861 · short excerpts<\/span>\n    <p class=\"line\">Texas “was received as a commonwealth holding, maintaining and protecting the institution known as negro slavery…”<\/p>\n    <p class=\"line\">The federal government “has for years almost entirely failed to protect the lives and property of the people of Texas” on the frontier.<\/p>\n    <p>Words about slavery and slaveholding appear about 18 times in this short document. The convention also listed complaints about frontier defense and Northern states, but it tied nearly all of them back to protecting slavery.<\/p>\n    <p><b>Think:<\/b> The convention wrote this to explain itself. What does it tell you about its main reason?<\/p>\n  <\/div>\n\n  <h3>The war in Texas<\/h3>\n  <div class=\"prose\"><p>Tens of thousands of Texans served the Confederacy, most of them fighting far from home. Some Texans, including many German Texans in the Hill Country, opposed the Confederacy, and some paid with their lives. Texas was spared the huge battles fought in the East, but three fights on Texas soil matter.<\/p><\/div>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Galveston<\/b><span class=\"tag\">Jan 1, 1863<\/span><\/div><p>Confederate forces under John B. Magruder retook the port of Galveston from Union troops, keeping it open for blockade runners.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Sabine Pass<\/b><span class=\"tag\">Sept 8, 1863<\/span><\/div><p>Lt. Dick Dowling and about 46 men in a small fort turned back a Union fleet trying to invade Texas from the Gulf.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Palmito Ranch<\/b><span class=\"tag\">May 1865<\/span><\/div><p>The last land battle of the war, near Brownsville. Confederates won, a month after Lee had already surrendered in Virginia.<\/p><\/div>\n  <\/div>\n\n  <h3>Freedom comes to Texas<\/h3>\n  <div class=\"excerpt\">\n    <span class=\"who\">General Order No. 3, Galveston, June 19, 1865 · excerpt<\/span>\n    <p class=\"line\">“The people of Texas are informed that, in accordance with a proclamation from the Executive of the United States, all slaves are free. This involves an absolute equality of personal rights and rights of property between former masters and slaves…”<\/p>\n    <p>Union General Gordon Granger read this order in Galveston about two and a half years after the Emancipation Proclamation. Freed Texans celebrated June 19 every year as <b>Juneteenth<\/b>. Texas made it a state holiday in 1980, the first state to do so, and it became a national holiday in 2021.<\/p>\n  <\/div>\n\n  <h3>Reconstruction: rebuilding, and a struggle over rights<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1865–66<\/span><div><b>Presidential Reconstruction<\/b><span>Texas wrote a new constitution and ended slavery, but passed \"Black Codes\" that limited what freed people could do.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1867–70<\/span><div><b>Congressional Reconstruction<\/b><span>Congress put Texas under army control and required it to accept the 14th and 15th Amendments. The Freedmen's Bureau set up schools and helped with work contracts. Black men voted, and in 1870 the first African American legislators, such as Matthew Gaines and George T. Ruby, took office.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1870–74<\/span><div><b>Texas rejoins the Union<\/b><span>Texas was readmitted in 1870. Governor E. J. Davis built public schools and a state police force, and many white Texans resented his strong government.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1876<\/span><div><b>A new constitution<\/b><span>Reconstruction ended. Texans wrote the Constitution of 1876, which limited the governor's power in reaction to the Davis years. You'll study it in Lesson 16.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>What changed?<\/b> About 182,000 people became free, but most freed families had no land and many ended up as sharecroppers. Violence against freed people was common. The economy was poor, and cotton would take years to recover. The rights won during Reconstruction were real, but many were later taken away by new laws. That struggle comes back in Lesson 14.<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz + Checkpoint 2<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">15 questions. Questions 11–15 review Lessons 6–9 for Checkpoint 2. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>Document-based claim for Checkpoint 2. In 3 to 5 sentences, answer: <b>What was the main cause of Texas's secession?<\/b> Quote or describe a line from the Declaration of Causes as evidence, and explain how it supports your claim. Then add one sentence on <b>one thing that changed<\/b> when the war ended.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"The main cause of Texas's secession was...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I used <b>evidence from the Declaration of Causes<\/b>.<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained how my evidence supports my claim and named one change after the war.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 10 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 10<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Civil War &amp; Reconstruction<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"copy\">Copy my answers<\/button>\n    <span class=\"fb\" id=\"fbCopy\" aria-live=\"polite\"><\/span>\n  <\/div>\n  <textarea id=\"reportText\" readonly hidden aria-label=\"Report text\"><\/textarea>\n  <div class=\"confirm\" id=\"resetBox\">\n    <button class=\"btn ghost\" id=\"reset\">Start this lesson over<\/button>\n  <\/div>\n  <p class=\"small\">Sources: <a href=\"https://www.law.cornell.edu/regulations/texas/19-Tex-Admin-Code-SS-113-19\" target=\"_blank\" rel=\"noopener\">19 TAC §113.19 (Grade 7 TEKS)<\/a> · <a href=\"https://www.tsl.texas.gov/ref/abouttx/secession/2feb1861.html\" target=\"_blank\" rel=\"noopener\">Declaration of Causes, Feb. 2, 1861<\/a> (Texas State Library and Archives) · <a href=\"https://www.archives.gov/news/articles/juneteenth-original-document\" target=\"_blank\" rel=\"noopener\">General Order No. 3<\/a> (National Archives) · <a href=\"https://www.tshaonline.org/handbook\" target=\"_blank\" rel=\"noopener\">Handbook of Texas Online<\/a>: “Reconstruction,” “Secession Convention,” “Sabine Pass, Battle of,” “Palmito Ranch, Battle of,” “Juneteenth”<\/p>\n<\/section>\n<\/main>\n\n<script>\nwindow.LESSON={\"key\": \"tx-lesson10-v1\", \"n\": 10, \"label\": \"Lesson 10\", \"title\": \"Civil War & Reconstruction\", \"practice\": [{\"type\": \"mc\", \"title\": \"Highlight the cause\", \"intro\": \"Use the Declaration of Causes excerpt. Pick the best answer.\", \"button\": \"Check my answers\", \"word\": \"correct\", \"items\": [{\"q\": \"According to the convention's own words, what was the main reason Texas seceded?\", \"o\": [\"Protecting slavery\", \"High taxes on tea\", \"A dispute with Mexico\"], \"a\": 0, \"e\": \"The document comes back to slavery again and again.\"}, {\"q\": \"The convention also complained that the federal government failed to…\", \"o\": [\"Protect people on the frontier\", \"Build railroads\", \"Give Texas a navy\"], \"a\": 0, \"e\": \"Frontier defense was a real complaint, but a smaller one.\"}, {\"q\": \"Why is this document strong evidence about the cause of secession?\", \"o\": [\"It was written later by historians\", \"It is the convention explaining its own reasons at the time\", \"It is a newspaper ad\"], \"a\": 1, \"e\": \"It's a primary source from the people who made the decision.\"}]}, {\"type\": \"match\", \"title\": \"Locate the battles\", \"intro\": \"Match each battle to what happened there.\", \"placeholder\": \"Choose a battle…\", \"button\": \"Check my battles\", \"word\": \"correct\", \"options\": [\"Galveston\", \"Sabine Pass\", \"Palmito Ranch\"], \"items\": [[\"Dick Dowling's small force turned back a Union fleet\", 1], [\"Confederates retook an important port on New Year's Day, 1863\", 0], [\"The last land battle of the Civil War, near Brownsville\", 2], [\"Fought after Lee had already surrendered\", 2], [\"Kept Union troops from landing on the upper Texas coast near Louisiana\", 1]]}, {\"type\": \"order\", \"title\": \"From secession to the Constitution of 1876\", \"intro\": \"Use the arrows to put these in order, earliest at the top.\", \"button\": \"Check my order\", \"word\": \"in the right spot\", \"seed\": 8, \"items\": [[\"Lincoln is elected president\", \"1860\"], [\"Texas secedes\", \"1861\"], [\"Battle of Sabine Pass\", \"1863\"], [\"General Order No. 3 is read in Galveston\", \"1865\"], [\"Texas is readmitted to the Union\", \"1870\"], [\"Texans write a new constitution\", \"1876\"]]}, {\"type\": \"sort\", \"title\": \"Effects of the war and Reconstruction\", \"intro\": \"Was this a <b>political<\\/b>, <b>economic<\\/b>, or <b>social<\\/b> effect?\", \"button\": \"Check my sorting\", \"word\": \"sorted correctly\", \"choices\": [[\"P\", \"Political\"], [\"E\", \"Economic\"], [\"S\", \"Social\"]], \"items\": [[\"Black men voted and served in the Legislature\", \"P\", \"Voting and office-holding are political.\"], [\"Many freed families became sharecroppers\", \"E\", \"Sharecropping was about land, work, and money.\"], [\"Freedmen's Bureau schools opened\", \"S\", \"Education changed daily life.\"], [\"The Constitution of 1876 limited the governor's power\", \"P\", \"It changed how government worked.\"], [\"Cotton production took years to recover\", \"E\", \"Farming was the heart of the economy.\"], [\"Juneteenth celebrations began\", \"S\", \"A community tradition is a social effect.\"]]}], \"quiz\": [{\"q\": \"What did the Texas Declaration of Causes name as the main reason for secession?\", \"o\": [\"Taxes on imports only\", \"Protecting slavery\", \"Mexico's threats\", \"A fight over oil\"], \"a\": 1, \"e\": \"It mentions slavery about 18 times.\"}, {\"q\": \"What happened to Governor Sam Houston in 1861?\", \"o\": [\"He led the Confederate army\", \"He became president of the U.S.\", \"He signed the Declaration of Causes\", \"He refused to swear loyalty to the Confederacy and was removed\"], \"a\": 3, \"e\": \"Houston opposed secession.\"}, {\"q\": \"Why does the Battle of Sabine Pass matter?\", \"o\": [\"A small Confederate force stopped a Union invasion of Texas\", \"It ended the war\", \"It freed enslaved people\", \"It was fought in Virginia\"], \"a\": 0, \"e\": \"Dick Dowling had about 46 men.\"}, {\"q\": \"What is special about the Battle of Palmito Ranch?\", \"o\": [\"It was the first battle of the war\", \"It was fought at sea\", \"It was the last land battle, fought after Lee surrendered\", \"It was in Galveston\"], \"a\": 2, \"e\": \"News traveled slowly to Texas.\"}, {\"q\": \"What did General Order No. 3 announce on June 19, 1865?\", \"o\": [\"Texas was a new republic\", \"The war would continue\", \"All enslaved people in Texas were free\", \"Galveston was closed\"], \"a\": 2, \"e\": \"This is the origin of Juneteenth.\"}, {\"q\": \"What were Black Codes?\", \"o\": [\"Laws that limited freed people's rights\", \"Laws that gave land to freed people\", \"Army rules\", \"Codes for telegraphs\"], \"a\": 0, \"e\": \"Congress pushed back with Congressional Reconstruction.\"}, {\"q\": \"What did the Freedmen's Bureau do?\", \"o\": [\"Ran the Confederate army\", \"Collected taxes for the Confederacy\", \"Built oil wells\", \"Set up schools and helped freed people with work contracts\"], \"a\": 3, \"e\": \"Education was one of its biggest effects.\"}, {\"q\": \"Why did many white Texans resent Governor E. J. Davis?\", \"o\": [\"He was from Mexico\", \"He built a strong state government with a state police force\", \"He supported secession\", \"He closed all schools\"], \"a\": 1, \"e\": \"The Constitution of 1876 limited the governor in response.\"}, {\"q\": \"What happened in 1861?\", \"o\": [\"Texas seceded and joined the Confederacy\", \"Texas joined the U.S.\", \"The Alamo fell\", \"Oil was found\"], \"a\": 0, \"e\": \"1861 is a required date.\"}, {\"q\": \"Which sentence best answers the big question?\", \"o\": [\"Texas seceded over taxes and nothing changed\", \"Texas never seceded\", \"Texas seceded to protect slavery; after the war, slavery ended and freed people gained rights during Reconstruction, though many were later taken away\", \"Reconstruction made Texas richer than ever\"], \"a\": 2, \"e\": \"Use the convention's own words as evidence.\"}, {\"q\": \"Checkpoint review (Lesson 6): What did the Law of April 6, 1830 do?\", \"o\": [\"Gave Texas independence\", \"Banned immigration from the United States\", \"Created the Republic\", \"Ended the Alamo siege\"], \"a\": 1, \"e\": \"It angered settlers and their families back home.\"}, {\"q\": \"Checkpoint review (Lesson 7): What happened on April 21, 1836?\", \"o\": [\"The Alamo fell\", \"The Declaration of Independence was signed\", \"Goliad prisoners were executed\", \"Texas won at San Jacinto\"], \"a\": 3, \"e\": \"The battle lasted about 18 minutes.\"}, {\"q\": \"Checkpoint review (Lesson 7): Which group fought for Texas independence alongside Anglo settlers?\", \"o\": [\"British soldiers\", \"The French army\", \"None\", \"Tejanos such as Juan Seguín\"], \"a\": 3, \"e\": \"Tejanos fought at the Alamo and San Jacinto.\"}, {\"q\": \"Checkpoint review (Lesson 8): Why did Texans want annexation?\", \"o\": [\"To end slavery\", \"Debt and the need for protection from Mexico\", \"To join Britain\", \"To move the capital\"], \"a\": 1, \"e\": \"The Republic could not pay its bills or defend itself.\"}, {\"q\": \"Checkpoint review (Lesson 9): What did the Compromise of 1850 do for Texas?\", \"o\": [\"Set today's borders in exchange for $10 million\", \"Made Texas a republic again\", \"Started the Mexican War\", \"Gave Texas California\"], \"a\": 0, \"e\": \"Texas gave up its claim near Santa Fe.\"}], \"review\": \"Review both primary sources and the Reconstruction timeline\"};\n(function(){\nconst C=window.LESSON;\nconst KEY=C.key;\nlet S={};\ntry{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst strip=s=>String(s).replace(/<[^>]+>/g,\"\");\nfunction shuffled(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction fb(id,n,t,word){const el=$(id);el.className=\"fb \"+(n===t?\"ok\":\"no\");el.textContent=n===t?`All ${t} ${word}. Nice work.`:`${n} of ${t} ${word}. Fix the red ones and check again.`}\nfunction mcHTML(set,prefix,ans,marks){return set.map((q,i)=>`<fieldset><legend>${q.q}<\/legend>${q.o.map((o,j)=>{const c=marks&&String(ans[i])===String(j)?(j===q.a?\"ok\":\"no\"):\"\";return `<label class=\"opt ${c}\"><input type=\"radio\" name=\"${prefix}${i}\" value=\"${j}\" ${String(ans[i])===String(j)?\"checked\":\"\"}> <span>${o}<\/span><\/label>`}).join(\"\")}${marks&&String(ans[i])===String(q.a)?`<p class=\"explain\">${q.e}<\/p>`:\"\"}<\/fieldset>`).join(\"\")}\n\nS.p=S.p||{};S.ps=S.ps||{};\nconst T=C.practice;\nconst total=t=>t.type===\"compare\"?t.items.length*t.columns.length:t.items.length;\n$(\"practiceTasks\").innerHTML=T.map((t,ti)=>`<div class=\"task\" id=\"task${ti}\"><header><h3>${String.fromCharCode(65+ti)}. ${t.title}<\/h3><p>${t.intro}<\/p><\/header>${t.before||\"\"}<div id=\"body${ti}\" class=\"${t.type===\"match\"?\"match wide\":t.type===\"sort\"?\"sort\":\"\"}\"${t.type===\"mc\"?' style=\"display:grid;gap:18px\"':\"\"}><\/div><div class=\"row\"><button class=\"btn\" id=\"chk${ti}\">${t.button}<\/button><span class=\"fb\" id=\"fb${ti}\" aria-live=\"polite\"><\/span><\/div><\/div>`).join(\"\");\n\nfunctio =>{render(true);setScore(ti,t.items.filter((s,i)=>A[i]===s[1]).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n  if(t.type===\"order\"){\n    let A=S.p[ti];\n    if(!Array.isArray(A)||A.length!==t.items.length){A=shuffled(t.items.length,t.seed||7);if(A.every((v,i)=>v===i))A.reverse();S.p[ti]=A;save()}\n    body.innerHTML=`<ol class=\"order\" id=\"ol${ti}\"><\/ol>`;\n    const render=marks=>{$(\"ol\"+ti).innerHTML=A.map((idx,pos)=>{const it=t.items[idx];const cls=marks?(idx===pos?\"ok\":\"no\"):\"\";\n      return `<li class=\"${cls}\"><span class=\"grip\" aria-hidden=\"true\">⠿<\/span><span class=\"t\">${it[0]}${marks&&idx===pos?` <span class=\"yr\" style=\"color:var(--good)\">· ${it[1]}<\/span>`:\"\"}<\/span><span class=\"mv\"><button type=\"button\" class=\"icon\" data-p=\"${pos}\" data-d=\"-1\" aria-label=\"Move up: ${esc(strip(it[0]))}\" ${pos===0?\"disabled\":\"\"}>↑<\/button><button type=\"button\" class=\"icon\" data-p=\"${pos}\" data-d=\"1\" aria-label=\"Move down: ${esc(strip(it[0]))}\" ${pos===A.length-1?\"disabled\":\"\"}>↓<\/button><\/span><\/li>`}).join(\"\")};\n    // Drag to reorder. Pointer Events cover mouse, touch and pen with one path; the\n    // drag starts on the grip only, so touching the row itself still scrolls the page.\n    (()=>{const ol=$(\"ol\"+ti);let d=null;\n      ol.addEventListener(\"pointerdown\",e=>{const g=e.target.closest(\".grip\");if(!g)return;\n        const li=g.closest(\"li\");if(!li)return;e.preventDefault();\n        d={li,from:[...ol.children].indexOf(li),id:e.pointerId};\n        li.classList.add(\"dragging\");try{g.setPointerCapture(e.pointerId)}catch(err){}});\n      ol.addEventListener(\"pointermove\",e=>{if(!d||e.pointerId!==d.id)return;e.preventDefault();\n        const other=[...ol.children].filter(x=>x!==d.li);\n        const before=other.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});\n        if(before)ol.insertBefore(d.li,before);el li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 11 of 17<\/p>\n  <h1>Cotton, Cattle &amp; Railroads<\/h1>\n  <p class=\"q\">Big question: <b>How did railroads and the closing frontier remake Texas?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.6A, 7.6B, 7.6C, 7.6D, 7.21B<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>Texas after the war<\/h2>\n  <div class=\"prose\">\n    <p>When Reconstruction ended (Lesson 10), Texas was poor but full of two things: land and cattle. Over the next 30 years, cattle drives, railroads, and the end of the open frontier changed where Texans lived and how they made a living. That change came at a terrible cost for American Indians.<\/p>\n  <\/div>\n\n  <h3>The cattle drives<\/h3>\n  <div class=\"prose\"><p>During the war, millions of longhorns ran wild in South Texas. A steer worth a few dollars in Texas could sell for many times more in the North, where cities wanted beef. So from 1866 to the 1880s, cowboys drove herds north to railroad towns in Kansas, where cattle were loaded onto trains.<\/p><\/div>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Chisholm Trail<\/b><span class=\"tag\">to Abilene, KS<\/span><\/div><p>The most famous route, running north from South Texas through Fort Worth.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Western Trail<\/b><span class=\"tag\">to Dodge City, KS<\/span><\/div><p>Ran farther west as farms and fences filled in the land along the Chisholm.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Goodnight-Loving Trail<\/b><span class=\"tag\">to New Mexico<\/span><\/div><p>Charles Goodnight and Oliver Loving drove herds west and north to forts and mining towns.<\/p><\/div>\n  <\/div>\n  <div class=\"callout\"><b>Who were the cowboys?<\/b> Many were young men back from the war. Many were African American or Mexican American, and Mexican vaqueros (Lesson 4) had taught the skills they all used. By the late 1880s, barbed wire fences, windmills, and railroads reaching into Texas itself ended the long drives.<\/div>\n\n  <h3>Railroads remake the map<\/h3>\n  <div class=\"prose\"><p>In 1870, Texas had only a few hundred miles of railroad track. By 1900 it had nearly 10,000 miles. Railroads let farmers ship cotton and ranchers ship cattle from anywhere along the line, so new towns grew up beside the tracks. Towns the railroad skipped often withered. Railroads also brought settlers to West Texas and the Panhandle.<\/p><\/div>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1870<\/span><div><b>A few short lines<\/b><span>Mostly around Houston and Galveston, carrying cotton to the coast.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1873<\/span><div><b>Dallas connects<\/b><span>Two railroads met in Dallas, which grew into a trading hub.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1881–83<\/span><div><b>East meets west<\/b><span>Lines built across West Texas reached El Paso, linking it to the rest of the country.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1900<\/span><div><b>Nearly 10,000 miles<\/b><span>Tracks crossed most of the state. Abilene, Midland, Amarillo, and many other towns grew up along them.<\/span><\/div><\/div>\n  <\/div>\n\n  <h3>The end of the open frontier<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>The bison<\/b><span class=\"tag\">1870s<\/span><\/div><p>Hide hunters killed millions of bison on the Southern Plains in just a few years. The Comanche, Kiowa, and other Plains nations depended on the bison for food, shelter, and tools (Lesson 2).<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Buffalo soldiers<\/b><span class=\"tag\">U.S. Army<\/span><\/div><p>African American regiments served at frontier forts such as Fort Concho and Fort Davis. They guarded roads, mapped West Texas, and fought in campaigns against American Indians.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Red River War<\/b><span class=\"tag\">1874–75<\/span><\/div><p>The U.S. Army attacked Comanche, Kiowa, and Cheyenne camps. At Palo Duro Canyon, soldiers destroyed their winter food and killed more than 1,000 horses.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Quanah Parker<\/b><span class=\"tag\">Comanche leader<\/span><\/div><p>The son of a Comanche chief and Cynthia Ann Parker, a captured settler. He led his band onto a reservation in Oklahoma in 1875, then became a respected leader and rancher who worked to protect his people's land and rights.<\/p><\/div>\n  <\/div>\n\n  <h3>Farmers fight back<\/h3>\n  <div class=\"prose\"><p>Cotton was still king, but many farmers, white and Black, worked land they did not own as tenant farmers or sharecroppers. They complained that railroads charged unfair rates to ship their crops. Farmers organized groups like the Grange and the Farmers' Alliance. In 1890, <b>James Stephen Hogg<\/b> was elected governor, the first born in Texas. He created the <b>Texas Railroad Commission<\/b> in 1891 to regulate railroad rates.<\/p><\/div>\n\n  <div class=\"callout\"><b>Reading a map pattern (SE 21B).<\/b> When you compare an 1870 railroad map with a 1900 map, ask: Where are the new lines? Which towns appear along them? What does that tell you about where Texans lived and worked? A pattern is something that repeats across the map, like \"new towns appear along the tracks.\"<\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Explain the pattern<\/h2>\n  <div class=\"prose\"><p>Pattern paragraph. In 3 to 5 sentences, answer: <b>What does the railroad map show about where Texans lived by 1900?<\/b> State the pattern as a claim, give one piece of evidence (a number, a town, or a date), and explain what caused the pattern.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"By 1900, the railroad map shows that Texans...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I stated the <b>pattern<\/b> as a clear claim.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained what <b>caused<\/b> the pattern.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 11 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 11<\/s ass=\"icon\" data-p=\"${pos}\" data-d=\"-1\" aria-label=\"Move up: ${esc(strip(it[0]))}\" ${pos===0?\"disabled\":\"\"}>↑<\/button><button type=\"button\" class=\"icon\" data-p=\"${pos}\" data-d=\"1\" aria-label=\"Move down: ${esc(strip(it[0]))}\" ${pos===A.length-1?\"disabled\":\"\"}>↓<\/button><\/span><\/li>`}).join(\"\")};\n    // Drag to reorder. Pointer Events cover mouse, touch and pen with one path; the\n    // drag starts on the grip only, so touching the row itself still scrolls the page.\n    (()=>{const ol=$(\"ol\"+ti);let d=null;\n      ol.addEventListener(\"pointerdown\",e=>{const g=e.target.closest(\".grip\");if(!g)return;\n        const li=g.closest(\"li\");if(!li)return;e.preventDefault();\n        d={li,from:[...ol.children].indexOf(li),id:e.pointerId};\n        li.classList.add(\"dragging\");try{g.setPointerCapture(e.pointerId)}catch(err){}});\n      ol.addEventListener(\"pointermove\",e=>{if(!d||e.pointerId!==d.id)return;e.preventDefault();\n        const other=[...ol.children].filter(x=>x!==d.li);\n        const before=other.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});\n        if(before)ol.insertBefore(d.li,before);else ol.appendChild(d.li)});\n      const end=e=>{if(!d||e.pointerId!==d.id)return;\n        const li=d.li,from=d.from,to=[...ol.children].indexOf(li);d=null;\n        li.classList.remove(\"dragging\");\n        if(to<0||to===from){render(scored(ti));return}\n        A.splice(to,0,A.splice(from,1)[0]);save();render(false);clearScore(ti)};\n      ol.addEventListener(\"pointerup\",end);ol.addEventListener(\"pointercancel\",end);})();\n    body.addEventListener(\"click\",e=>{const b=e.target.closest(\"button[data-d]\");if(!b)return;const p=+b.dataset.p,q=p+(+b.dataset.d);if(q<0||q>=A.length)return;[A[p],A[q]]=[A[q],A[p]];save();render(false);clearScore(ti);\n      const nb=$(\"ol\"+ti).querySelectorAll(\"li\")[q]?.querySelector(`button[data-d=\"${b.dataset.d}\"]`);if(nb&&!nb.disabled)nb.focus();else $(\" ed(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n});\n\n// Quiz\nconst QUIZ=C.quiz;\nS.qz=S.qz||{};\nfunction renderQuiz(){$(\"quiz\").innerHTML=mcHTML(QUIZ,\"qz\",S.qz,S.qzScore!=null);$(\"submitQuiz\").textContent=S.qzScore!=null?\"Check again\":\"Submit quiz\"}\n// Re-answering clears only that question's marks: a full re-render would drop every\n// other question's result and scroll the student away from where they were working.\nfunction unmarkQuestion(i){const f=$(\"quiz\").querySelectorAll(\"fieldset\")[i];if(!f)return;f.querySelectorAll(\".opt\").forEach(l=>l.classList.remove(\"ok\",\"no\"));f.querySelector(\".explain\")?.remove()}\n$(\"quiz\").addEventListener(\"change\",e=>{const i=+e.target.name.slice(2);S.qz[i]=+e.target.value;save();if(S.qzScore!=null)unmarkQuestion(i);updateAll()});\n$(\"quiz\").addEventListener(\"submit\",e=>e.preventDefault());\n$(\"submitQuiz\").onclick=()=>{const left=QUIZ.length-Object.keys(S.qz).length;if(left>0){$(\"fbQuiz\").className=\"fb no\";$(\"fbQuiz\").textContent=`Answer all questions first (${left} left).`;return}\n  S.qzScore=QUIZ.filter((q,i)=>S.qz[i]===q.a).length;S.qzDate=new Date().toLocaleDateString();save();renderQuiz();fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");updateAll()};\nrenderQuiz();if(S.qzScore!=null)fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");\n\n// Exit claim\n$(\"claim\").value=S.claim||\"\";\n[\"ck1\",\"ck2\",\"ck3\"].forEach(k=>{$(k).checked=!!S[k];$(k).onchange=()=>{S[k]=$(k).checked;save();updateAll()}});\nfunction wc(){const n=($(\"claim\").value.trim().match(/\\S+/g)||[]).length;$(\"wc\").textContent=n+(n===1?\" word\":\" words\");return n}\n$(\"claim\").addEventListener(\"input\",()=>{S.claim=$(\"claim\").value;save();wc();updateAll()});wc();\n\nfunction report(){\n  const L=[`Texas History ${C.label}: ${C.title}`];\n  T.forEach((t,ti)=>L.push(`${String.fromCharCode(65+ti)}. ${strip(t.title)}: ${S.ps[ti]==null?\"not checked yet\":S.ps[ti]+\"/\"+total(t)}`));\n  L.push(`Quiz: ${S.q n.ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}\n.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.stat{font-size:.85rem;color:var(--blue)}\n.card dl{display:grid;grid-template-columns:4rem 1fr;gap:4px 10px;margin:0;font-size:.95rem}\n.card dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}\n.card dd{margin:0;min-width:0}\n.match.wide label{grid-template-columns:1fr minmax(0,14rem)}\n.match .t{min-width:0}\n.cmpbox{overflow-x:auto}\n.cmp{border-collapse:collapse;width:100%;min-width:480px}\n.cmp th,.cmp td{padding:6px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}\n.cmp thead th{font-family:var(--display);font-size:1.1rem}\n.cmp tbody th{font-size:.9rem;color:var(--muted);white-space:nowrap}\n.cmp td.ok{background:var(--good-soft)} .cmp td.no{background:var(--bad-soft)}\n@media (max-width:520px){.match.wide label{grid-template-columns:1fr}.band b{font-size:.75rem}.band .yr{font-size:.95rem}}\n\n\n/* Lessons 3-4 additions */\n.excerpt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:10px;max-width:65ch}\n.excerpt p{font-size:1rem}\n.excerpt .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.excerpt p.line{padding-left:12px;border-left:3px solid var(--gold)}\n.card ul{margin:0;padding-left:1.1em;display:grid;gap:2px;font-size:.95rem}\n.era em{font-style:normal;color:var(--muted);font-size:.9rem;display:block}\n.dates .date b{font-size:1.05rem}\n/* long words and URLs wrap instead of widening the page */\n.t,.excerpt p,.card p,.callout{overflow-wrap:anywhere}\n<\/style>\n\n<nav class=\"steps\" aria-label=\"Lesson steps\">\n  <ol>\n    <li><a href=\"#read\" id=\"nav-read\"><span class=\"dot\"><\/span>1 Read<\/a><\/li>\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 12 of 17<\/p>\n  <h1>The Age of Oil<\/h1>\n  <p class=\"q\">Big question: <b>How did one well in 1901 change Texas's economy?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.1B, 7.7A, 7.7B, 7.9B, 7.11A, 7.11B, 7.12A<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>A storm, a gusher, and a new economy<\/h2>\n  <div class=\"prose\">\n    <p>In 1900, Texas made its living from farms and ranches: cotton, cattle, and lumber (Lesson 11). Within a few years, two events on the Gulf Coast began to change that. One was a disaster. The other was a fountain of oil.<\/p>\n  <\/div>\n\n  <h3>The Galveston hurricane, 1900<\/h3>\n  <div class=\"prose\"><p>Galveston was the richest city in Texas and its busiest port. On September 8, 1900, a hurricane pushed a wall of seawater over the low island. At least 6,000 people died, and some estimates are much higher. It is still the deadliest natural disaster in U.S. history.<\/p>\n  <p>Galveston rebuilt. It raised the level of the whole city and built a giant seawall. But shipping companies began to look inland for a safer port. Houston, about 50 miles from the Gulf, dug the <b>Houston Ship Channel<\/b>, which opened in 1914. Houston soon passed Galveston as the region's big city. Geography, and a storm, shifted where growth happened.<\/p><\/div>\n\n  <h3>Spindletop, 1901<\/h3>\n  <div class=\"prose\"><p>Near Beaumont, a hill called Spindletop rose above a salt dome. A local businessman, <b>Pattillo Higgins<\/b>, was sure oil lay underneath, but most geologists disagreed. An engineer named <b>Anthony F. Lucas<\/b>, an expert on salt domes, kept drilling. On <b>January 10, 1901<\/b>, mud and then oil shot more than 100 feet into the air. The Lucas gusher flowed an estimated 100,000 barrels a day, more than any well in the world at the time. It took nine days to cap it.<\/p><\/div>\n\n  <div class=\"dates\">\n    <div class=\"date\"><span class=\"yr\">1901<\/span><b>Spindletop gusher<\/b><p>This is one of your eight required dates. Add it to your timeline.<\/p><\/div>\n  <\/div>\n\n  <h3>The boom<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>People<\/b><span class=\"tag\">boomtown<\/span><\/div><p>Beaumont grew from about 10,000 people to about 50,000 within months. Workers, investors, and con artists poured in.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Companies<\/b><span class=\"tag\">big oil<\/span><\/div><p>Companies that started or grew at Spindletop include the Texas Company (later Texaco), Gulf Oil, and Humble (later part of Exxon).<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Industry<\/b><span class=\"tag\">refining<\/span><\/div><p>Refineries, pipelines, and the Houston Ship Channel turned the Gulf Coast into a center for oil and chemicals.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Energy<\/b><span class=\"tag\">fuel<\/span><\/div><p>Cheap oil fueled ships, trains, factories, and soon automobiles. Texas went from a farm state toward an industrial one.<\/p><\/div>\n  <\/div>\n\n  <h3>The bust<\/h3>\n  <div class=\"prose\"><p>Within two years, hundreds of wells crowded onto Spindletop. Each one drained the same field, so the pressure dropped. By 1904, the field produced only a tiny share of what it had. Many people who rushed in lost everything.<\/p><\/div>\n\n  <div class=\"chartbox\"><svg viewBox=\"0 0 360 180\" role=\"img\" aria-label=\"Boom and bust cycle: a line rises sharply as a discovery brings a rush of drilling, peaks, then falls as too many wells and low prices cause a bust\">\n    <g font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"var(--muted)\">\n      <line x1=\"30\" y1=\"150\" x2=\"350\" y2=\"150\" stroke=\"var(--rule)\"/><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"150\" stroke=\"var(--rule)\"/>\n      <text x=\"34\" y=\"170\">time →<\/text><text x=\"22\" y=\"90\" text-anchor=\"middle\" transform=\"rotate(-90 22 90)\">jobs, people, money<\/text>\n    <\/g>\n    <path d=\"M30 140 C 80 138, 100 40, 140 30 S 200 60, 240 120 S 320 140, 350 135\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"3\"/>\n    <g font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"12\" fill=\"var(--ink)\">\n      <text x=\"60\" y=\"110\">1 Discovery<\/text><text x=\"128\" y=\"20\">2 Boom<\/text><text x=\"200\" y=\"70\">3 Too many wells,<\/text><text x=\"200\" y=\"84\">prices fall<\/text><text x=\"255\" y=\"130\">4 Bust<\/text>\n    <\/g><\/svg><p class=\"cap\">The boom-and-bust cycle. It happened at Spindletop, and again many times after.<\/p><\/div>\n\n  <div class=\"callout\"><b>It kept happening.<\/b> New fields brought new booms: the huge East Texas field in 1930 and the Permian Basin in West Texas. Busts came too. In the early 1930s, so much oil flooded the market that prices fell to pennies a barrel, and the Texas Railroad Commission (Lesson 11) began limiting how much each well could pump. In the 1980s, a crash in oil prices cost Texas many thousands of jobs. Today, Texas spreads its risk across more industries, but oil and gas still matter.<\/div>\n\n  <h3>People change the land<\/h3>\n  <div class=\"prose\"><p>Geographers ask how people adapt to and change their environment. Galveston's seawall, the Ship Channel, and oil derricks covering Spindletop are all examples of people modifying the land to make a living. Some changes helped people, and some, like oil spills and drained fields, caused damage.<\/p><\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Answer the big question<\/h2>\n  <div class=\"prose\"><p>In 3 to 5 sentences, answer: <b>How did one well in 1901 change Texas's economy?<\/b> Make a claim, give one piece of evidence (a number, a company, a city, or a date), and explain how your evidence supports your claim. Bonus: mention one bust.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"The Spindletop well changed Texas's economy by...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained <b>how<\/b> my evidence supports my claim.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 12 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span clas >\n    <li><a href=\"#practice\" id=\"nav-practice\"><span class=\"dot\"><\/span>2 Practice<\/a><\/li>\n    <li><a href=\"#check\" id=\"nav-check\"><span class=\"dot\"><\/span>3 Quiz<\/a><\/li>\n    <li><a href=\"#reflect\" id=\"nav-reflect\"><span class=\"dot\"><\/span>4 Exit claim<\/a><\/li>\n    <li><a href=\"#results\" id=\"nav-results\"><span class=\"dot\"><\/span>Results<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<main class=\"wrap\">\n<header class=\"hero\">\n  <p class=\"eyebrow\">Texas History · Lesson 13 of 17<\/p>\n  <h1>Reform, Depression &amp; the World Wars<\/h1>\n  <p class=\"q\">Big question: <b>How did national crises reshape Texas from 1900 to 1945?<\/b><\/p>\n  <div class=\"meta\"><span>About 90 minutes<\/span><span>TEKS 7.7C, 7.7E, 7.9B, 7.17B, 7.18D<\/span><span>Your work saves on this device<\/span><\/div>\n<\/header>\n\n<section class=\"step\" id=\"read\">\n  <p class=\"eyebrow\">Step 1 · Read<\/p>\n  <h2>Four big shocks in 45 years<\/h2>\n  <div class=\"prose\">\n    <p>Between 1900 and 1945, the whole nation faced reform movements, a world war, a deep depression, and a second world war. Each one reached into Texas and changed its politics, its economy, and daily life. As you read, tag each change as <b>political<\/b> (government and voting), <b>economic<\/b> (jobs and money), or <b>social<\/b> (how people live together).<\/p>\n  <\/div>\n\n  <h3>Reform<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>Populists<\/b><span class=\"tag\">1890s<\/span><\/div><p>Farmers angry at railroads and banks formed the People's Party. They lost most elections, but many of their ideas, like regulating big business, were later adopted.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Progressives<\/b><span class=\"tag\">1900s–1910s<\/span><\/div><p>Reformers wanted cleaner, more efficient government. After the 1900 storm (Lesson 12), Galveston invented the city commission form of government, which spread nationwide.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Woman suffrage<\/b><span class=\"tag\">1918–19<\/span><\/div><p>Leaders like Minnie Fisher Cunningham and Jane Y. McCallum won Texas women the right to vote in primaries in 1918. In 1919, Texas became the first Southern state to approve the 19th Amendment.<\/p><\/div>\n  <\/div>\n\n  <h3>The wars and the Depression<\/h3>\n  <div class=\"ruler\">\n    <div class=\"era\"><span class=\"yr\">1917–18<\/span><div><b>World War I<\/b><span>Nearly 200,000 Texans served. Army camps and airfields opened across Texas, including Kelly Field in San Antonio, because of the mild weather and open land.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1929<\/span><div><b>The Great Depression begins<\/b><span>Prices for cotton and oil collapsed. Farmers lost their land and workers lost jobs.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1930s<\/span><div><b>The Dust Bowl<\/b><span>Years of drought and over-plowing on the southern plains let wind strip away topsoil. Huge dust storms rolled over the Panhandle, burying fences and ruining crops.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1933–39<\/span><div><b>The New Deal<\/b><span>Federal programs put people to work. The Civilian Conservation Corps built Texas state parks, such as Palo Duro Canyon and Bastrop. Texans in Washington helped lead it: Vice President <b>John Nance Garner<\/b> of Uvalde and Congressman <b>Sam Rayburn<\/b>, who later became the longest-serving Speaker of the House and pushed to bring electricity to rural Texas.<\/span><\/div><\/div>\n    <div class=\"era\"><span class=\"yr\">1941–45<\/span><div><b>World War II<\/b><span>About 750,000 Texans served, including about 12,000 women. Admiral Chester Nimitz of Fredericksburg commanded the Pacific Fleet. Doris Miller of Waco was honored for heroism at Pearl Harbor. Oveta Culp Hobby led the Women's Army Corps. Bases, shipyards, and factories boomed, pulling Texans from farms into cities.<\/span><\/div><\/div>\n  <\/div>\n\n  <div class=\"callout\"><b>Why do these crises matter for Texas?<\/b> They pushed Texas from a farm state toward a city and factory state. By 1950, most Texans lived in cities for the first time. They also tied Texas more closely to the national government, which now built parks, paid farmers, and set up military bases across the state.<\/div>\n\n  <h3>Texas voices of the era<\/h3>\n  <div class=\"regions\">\n    <div class=\"card\"><div class=\"ctop\"><b>J. Frank Dobie<\/b><span class=\"tag\">writer<\/span><\/div><p>Collected and retold Texas folk tales about longhorns, mustangs, and vaqueros.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Walter Prescott Webb<\/b><span class=\"tag\">historian<\/span><\/div><p>Wrote <i>The Great Plains<\/i>, showing how the dry land shaped the people who lived on it.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Elisabet Ney<\/b><span class=\"tag\">sculptor<\/span><\/div><p>Carved statues of Sam Houston and Stephen F. Austin that stand in the Texas and U.S. Capitols.<\/p><\/div>\n    <div class=\"card\"><div class=\"ctop\"><b>Scott Joplin<\/b><span class=\"tag\">composer<\/span><\/div><p>Grew up in Texarkana and became the \"King of Ragtime.\"<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"practice\">\n  <p class=\"eyebrow\">Step 2 · Practice<\/p>\n  <h2>Do the work<\/h2>\n  <div id=\"practiceTasks\" style=\"display:grid;gap:18px\"><\/div>\n<\/section>\n\n<section class=\"step\" id=\"check\">\n  <p class=\"eyebrow\">Step 3 · Quiz<\/p>\n  <h2>Show what you know<\/h2>\n  <p class=\"small\">10 questions. You can scroll up to review, but try it from memory first.<\/p>\n  <form class=\"quiz\" id=\"quiz\"><\/form>\n  <div class=\"row\"><button class=\"btn\" id=\"submitQuiz\">Submit quiz<\/button><span class=\"fb\" id=\"fbQuiz\" aria-live=\"polite\"><\/span><\/div>\n<\/section>\n\n<section class=\"step\" id=\"reflect\">\n  <p class=\"eyebrow\">Step 4 · Exit claim<\/p>\n  <h2>Explain one cause and effect<\/h2>\n  <div class=\"prose\"><p>Cause-and-effect claim. Pick <b>one<\/b> crisis (reform, World War I, the Depression and Dust Bowl, or World War II). In 3 to 5 sentences, explain <b>how it reshaped Texas<\/b>. Make a claim, give one piece of evidence, and say whether the effect was political, economic, or social.<\/p><\/div>\n  <label for=\"claim\" class=\"small\">Your answer<\/label>\n  <textarea id=\"claim\" placeholder=\"The crisis that reshaped Texas the most was...\"><\/textarea>\n  <p class=\"small\" id=\"wc\">0 words<\/p>\n  <div class=\"checks\">\n    <p><b>Check your own work before you finish:<\/b><\/p>\n    <label><input type=\"checkbox\" id=\"ck1\"> I made a clear <b>claim<\/b> that answers the question.<\/label>\n    <label><input type=\"checkbox\" id=\"ck2\"> I gave specific <b>evidence<\/b> (a place, a date, a person, or an event).<\/label>\n    <label><input type=\"checkbox\" id=\"ck3\"> I explained the <b>effect<\/b> and said whether it was political, economic, or social.<\/label>\n  <\/div>\n<\/section>\n\n<section class=\"step\" id=\"results\">\n  <p class=\"eyebrow\">Results<\/p>\n  <h2>Lesson 13 report<\/h2>\n  <div class=\"cert\" id=\"cert\">\n    <div class=\"cert-top\"><span class=\"eyebrow\">Texas History · Lesson 13<\/span><span class=\"stamp\" id=\"stamp\">In progress<\/span><\/div>\n    <h3 id=\"certTitle\">Reform, Depression &amp; the World Wars<\/h3>\n    <div class=\"score\" id=\"score\"><\/div>\n    <p class=\"small\" id=\"status\"><\/p>\n    <p class=\"certdate yr\" id=\"certDate\"><\/p>\n  <\/div>\n  <div class=\"shot\" id=\"shot\" hidden>\n    <h3>Last step: turn in your work<\/h3>\n    <ol>\n      <li>Tap <b>Copy my answers<\/b> below.<\/li>\n      <li>Paste the answers into a message to your parents.<\/li>\n      <li>Send it. A parent will read and grade your exit claim.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"co ndletop\", \"Leading the Dust Bowl relief\"], \"a\": 0, \"e\": \"Her statues stand in two Capitols.\"}, {\"q\": \"Which sentence best answers the big question?\", \"o\": [\"Texas was untouched by national events\", \"Texas got poorer every year until 1945\", \"Reform, war, and depression gave women the vote, brought federal programs and bases, and moved Texans from farms to cities\", \"Only farmers were affected\"], \"a\": 2, \"e\": \"Name a crisis, an effect, and evidence.\"}], \"review\": \"Review the timeline and the gallery tags\"};\n(function(){\nconst C=window.LESSON;\nconst KEY=C.key;\nlet S={};\ntry{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst strip=s=>String(s).replace(/<[^>]+>/g,\"\");\nfunction shuffled(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction fb(id,n,t,word){const el=$(id);el.className=\"fb \"+(n===t?\"ok\":\"no\");el.textContent=n===t?`All ${t} ${word}. Nice work.`:`${n} of ${t} ${word}. Fix the red ones and check again.`}\nfunction mcHTML(set,prefix,ans,marks){return set.map((q,i)=>`<fieldset><legend>${q.q}<\/legend>${q.o.map((o,j)=>{const c=marks&&String(ans[i])===String(j)?(j===q.a?\"ok\":\"no\"):\"\";return `<label class=\"opt ${c}\"><input type=\"radio\" name=\"${prefix}${i}\" value=\"${j}\" ${String(ans[i])===String(j)?\"checked\":\"\"}> <span>${o}<\/span><\/label>`}).join(\"\")}${marks&&String(ans[i])===String(q.a)?`<p class=\"explain\">${q.e}<\/p>`:\"\"}<\/fieldset>`).join(\"\")}\n\nS.p=S.p||{};S.ps=S.ps||{};\nconst T=C.practice;\nconst total=t=>t.type===\"compare\"?t.items.length*t.columns.length:t.items.length;\n$(\"practiceTasks\").innerHTML=T.map((t,ti)=>`<di ault();\n        d={li,from:[...ol.children].indexOf(li),id:e.pointerId};\n        li.classList.add(\"dragging\");try{g.setPointerCapture(e.pointerId)}catch(err){}});\n      ol.addEventListener(\"pointermove\",e=>{if(!d||e.pointerId!==d.id)return;e.preventDefault();\n        const other=[...ol.children].filter(x=>x!==d.li);\n        const before=other.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});\n        if(before)ol.insertBefore(d.li,before);else ol.appendChild(d.li)});\n      const end=e=>{if(!d||e.pointerId!==d.id)return;\n        const li=d.li,from=d.from,to=[...ol.children].indexOf(li);d=null;\n        li.classList.remove(\"dragging\");\n        if(to<0||to===from){render(scored(ti));return}\n        A.splice(to,0,A.splice(from,1)[0]);save();render(false);clearScore(ti)};\n      ol.addEventListener(\"pointerup\",end);ol.addEventListener(\"pointercancel\",end);})();\n    body.addEventListener(\"click\",e=>{const b=e.target.closest(\"button[data-d]\");if(!b)return;const p=+b.dataset.p,q=p+(+b.dataset.d);if(q<0||q>=A.length)return;[A[p],A[q]]=[A[q],A[p]];save();render(false);clearScore(ti);\n      const nb=$(\"ol\"+ti).querySelectorAll(\"li\")[q]?.querySelector(`button[data-d=\"${b.dataset.d}\"]`);if(nb&&!nb.disabled)nb.focus();else $(\"ol\"+ti).querySelectorAll(\"li\")[q]?.querySelector(\"button:not([disabled])\")?.focus()});\n    $(\"chk\"+ti).onclick=()=>{render(true);setScore(ti,A.filter((v,i)=>v===i).length)};\n    render(scored(ti));if(scored(ti))fb(\"fb\"+ti,S.ps[ti],total(t),t.word);\n  }\n  if(t.type===\"compare\"){\n    const A=S.p[ti]=S.p[ti]||{};\n    const cols=t.columns,ph=t.placeholder||\"Choose…\";\n    const ok=(i,k)=>String(A[i+\"_\"+k])===String(t.items[i].a[k]);\n    body.innerHTML=`<div class=\"cmpbox\"><table class=\"cmp\"><thead><tr><th scope=\"col\"><\/th>${cols.map(p=>`<th scope=\"col\">${esc(p)}<\/th>`).join(\"\")}<\/tr><\/thead><tbody>${t.items.map((r,i)=>`<tr><th scope=\"row\">${r.row}<\/th>${cols.map( e.target.name.slice(2);S.qz[i]=+e.target.value;save();if(S.qzScore!=null)unmarkQuestion(i);updateAll()});\n$(\"quiz\").addEventListener(\"submit\",e=>e.preventDefault());\n$(\"submitQuiz\").onclick=()=>{const left=QUIZ.length-Object.keys(S.qz).length;if(left>0){$(\"fbQuiz\").className=\"fb no\";$(\"fbQuiz\").textContent=`Answer all questions first (${left} left).`;return}\n  S.qzScore=QUIZ.filter((q,i)=>S.qz[i]===q.a).length;S.qzDate=new Date().toLocaleDateString();save();renderQuiz();fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");updateAll()};\nrenderQuiz();if(S.qzScore!=null)fb(\"fbQuiz\",S.qzScore,QUIZ.length,\"correct\");\n\n// Exit claim\n$(\"claim\").value=S.claim||\"\";\n[\"ck1\",\"ck2\",\"ck3\"].forEach(k=>{$(k).checked=!!S[k];$(k).onchange=()=>{S[k]=$(k).checked;save();updateAll()}});\nfunction wc(){const n=($(\"claim\").value.trim().match(/\\S+/g)||[]).length;$(\"wc\").textContent=n+(n===1?\" word\":\" words\");return n}\n$(\"claim\").addEventListener(\"input\",()=>{S.claim=$(\"claim\").value;save();wc();updateAll()});wc();\n\nfunction report(){\n  const L=[`Texas History ${C.label}: ${C.title}`];\n  T.forEach((t,ti)=>L.push(`${String.fromCharCode(65+ti)}. ${strip(t.title)}: ${S.ps[ti]==null?\"not checked yet\":S.ps[ti]+\"/\"+total(t)}`));\n  L.push(`Quiz: ${S.qzScore==null?\"not submitted\":S.qzScore+\"/\"+QUIZ.length+(S.qzDate?\" (submitted \"+S.qzDate+\")\":\"\")}`);\n  if(S.qzScore!=null){const miss=QUIZ.map((q,i)=>S.qz[i]===q.a?null:i+1).filter(Boolean);if(miss.length)L.push(\"Missed quiz questions: \"+miss.join(\", \"))}\n  const ck=[\"ck1\",\"ck2\",\"ck3\"].filter(k=>S[k]).length;\n  const head=L.shift();\n  const pr=$(\"reflect\").querySelector(\".prose\");\n  const prompt=pr?pr.textContent.replace(/\\s+/g,\" \").trim():\"\";\n  return [head,\n    S.doneAt?\"Completed \"+S.doneAt:\"Not finished yet\",\n    \"\",\n    \"EXIT CLAIM (for a parent to grade)\",\n    \"Prompt: \"+prompt,\n    `Answer (${wc()} words, self-check ${ck}/3):`,\n    S.claim&
